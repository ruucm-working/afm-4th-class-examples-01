    const ADMIN_ORDER_FILTERS = [
      { id: '',                    name: '전체' },
      { id: 'PAID',                name: ORDER_STATUS.PAID.label },
      { id: 'WAITING_FOR_DEPOSIT', name: ORDER_STATUS.WAITING_FOR_DEPOSIT.label },
      { id: 'FAILED',              name: ORDER_STATUS.FAILED.label },
      { id: 'READY',               name: ORDER_STATUS.READY.label },
    ];

    function AdminOrdersPage() {
      return <AdminShell tab="orders"><AdminOrderList /></AdminShell>;
    }

    function AdminOrderList() {
      const [query, go] = useQueryNav('/admin/orders');
      const status = query.get('status') || '';
      const q = query.get('q') || '';
      const params = new URLSearchParams();
      for (const key of ['status', 'userId', 'q']) if (query.get(key)) params.set(key, query.get(key));
      const orders = useApi(`/admin/orders?${params}`);
      const [openId, setOpenId] = useState(null);
      const closeDetail = useCallback(() => setOpenId(null), []);

      const summary = orders.extra?.summary;
      const stat = (s) => summary?.byStatus[s] || { count: 0, amount: 0, pairs: 0 };
      const countOf = (id) => (id
        ? stat(id).count
        : Object.entries(summary?.byStatus || {}).filter(([s]) => s !== 'READY').reduce((n, [, v]) => n + v.count, 0));
      const list = orders.data || [];
      const opened = list.find((o) => o.orderId === openId);

      return (
        <>
          {summary && (
            <div className="grid grid-cols-2 gap-3 sm:grid-cols-4">
              <AdminStat label="매출 (결제 완료)" value={won(stat('PAID').amount)} />
              <AdminStat label="결제 완료" value={`${stat('PAID').count}건`} hint={`${stat('PAID').pairs}켤레 판매`} />
              <AdminStat label="입금 대기" value={`${stat('WAITING_FOR_DEPOSIT').count}건`} />
              <AdminStat label="결제 실패" value={`${stat('FAILED').count}건`} />
            </div>
          )}

          {summary?.customer && (
            <div className="mt-6 flex flex-wrap items-center gap-x-3 gap-y-1 rounded-2xl bg-amber-50 px-4 py-3 text-sm text-amber-900">
              <span><b>{summary.customer.name}</b> ({summary.customer.email}) 님의 주문만 보고 있어요.</span>
              <button className="font-semibold underline underline-offset-4" onClick={() => go({ userId: '' })}>모든 회원 보기</button>
            </div>
          )}

          <div className="no-scrollbar mt-6 flex gap-2 overflow-x-auto">
            {ADMIN_ORDER_FILTERS.map((f) => (
              <button key={f.id || 'all'} onClick={() => go({ status: f.id })} aria-pressed={status === f.id}
                      className={`shrink-0 rounded-full px-4 py-2 text-sm font-semibold transition-colors ${status === f.id ? 'bg-ink text-white' : 'bg-white text-stone-600 ring-1 ring-black/10 hover:text-ink'}`}>
                {f.name}{summary && <span className="ml-1 opacity-60">{countOf(f.id)}</span>}
              </button>
            ))}
          </div>

          <div className="mt-4 flex flex-wrap items-center justify-between gap-3">
            <AdminSearch value={q} placeholder="주문번호 · 상품 · 회원 이메일 검색" onSearch={(v) => go({ q: v })} />
            <p className="text-sm text-stone-500">
              {orders.data ? `${list.length}건` : ''}
              {q && <> · ‘<b className="text-ink">{q}</b>’ <button className="underline underline-offset-4" onClick={() => go({ q: '' })}>검색어 지우기</button></>}
            </p>
          </div>
          {status === 'READY' && (
            <p className="mt-3 text-xs text-stone-500">결제 대기 = 주문서만 만들고 결제를 끝내지 않은 주문이에요. 재고는 잡히지 않았어요.</p>
          )}

          {orders.loading && !orders.data && <Spinner />}
          {orders.error && <div className="mt-4"><Alert>{orders.error}</Alert></div>}
          {orders.data && list.length === 0 && <Card className="mt-4 p-10 text-center text-sm text-stone-500">해당하는 주문이 없어요.</Card>}

          {list.length > 0 && (
            <Card className="relative mt-4 overflow-x-auto">
              <table className="w-full min-w-[780px] text-left text-sm">
                <thead className="border-b border-stone-100 text-xs text-stone-400">
                  <tr>
                    <th scope="col" className="px-5 py-3 font-semibold">상태</th>
                    <th scope="col" className="px-3 py-3 font-semibold">주문 일시</th>
                    <th scope="col" className="px-3 py-3 font-semibold">주문</th>
                    <th scope="col" className="px-3 py-3 font-semibold">회원</th>
                    <th scope="col" className="px-3 py-3 font-semibold">결제 수단</th>
                    <th scope="col" className="px-5 py-3 text-right font-semibold">금액</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-stone-100">
                  {list.map((o) => (
                    <tr key={o.orderId} className="cursor-pointer hover:bg-stone-50" onClick={() => setOpenId(o.orderId)}>
                      <td className="whitespace-nowrap px-5 py-3.5"><OrderStatusBadge status={o.status} /></td>
                      <td className="whitespace-nowrap px-3 py-3.5 text-stone-600">{fmtDate(o.createdAt, true)}</td>
                      <td className="px-3 py-3.5">
                        {/* 키보드로도 열 수 있게 주문명은 버튼으로 둔다 */}
                        <button className="block max-w-[15rem] truncate text-left font-bold hover:underline"
                                onClick={(e) => { e.stopPropagation(); setOpenId(o.orderId); }}>
                          {o.orderName}
                        </button>
                        <p className="max-w-[15rem] truncate text-xs text-stone-400">{o.orderId}</p>
                      </td>
                      <td className="px-3 py-3.5">
                        <p className="max-w-[12rem] truncate">{o.customer ? o.customer.name : '탈퇴한 회원'}</p>
                        <p className="max-w-[12rem] truncate text-xs text-stone-500">{o.customer?.email}</p>
                      </td>
                      <td className="whitespace-nowrap px-3 py-3.5 text-stone-600">{o.payment ? o.payment.method : '—'}</td>
                      <td className="whitespace-nowrap px-5 py-3.5 text-right font-bold">{won(o.amount)}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </Card>
          )}

          <Modal isOpen={!!opened} onClose={closeDetail} title="주문 상세" size="lg">
            {opened && (
              <AdminOrderDetail order={opened}
                onShowCustomer={(userId) => { closeDetail(); go({ userId: String(userId), status: '', q: '' }); }} />
            )}
          </Modal>
        </>
      );
    }

    function AdminOrderDetail({ order: o, onShowCustomer }) {
      const va = o.payment?.virtualAccount;
      return (
        <div className="space-y-5 text-sm">
          <div className="flex flex-wrap items-center gap-2">
            <OrderStatusBadge status={o.status} />
            <span className="font-bold">{o.orderName}</span>
          </div>

          {o.failReason && <Alert>{o.failReason.message} <span className="text-red-400">({o.failReason.code})</span></Alert>}

          <dl className="grid grid-cols-[5.5rem_1fr] gap-x-4 gap-y-2">
            <dt className="text-stone-500">주문번호</dt><dd className="break-all font-mono text-xs leading-5">{o.orderId}</dd>
            <dt className="text-stone-500">주문 일시</dt><dd>{fmtDate(o.createdAt, true)}</dd>
            {o.paidAt && <><dt className="text-stone-500">결제 일시</dt><dd>{fmtDate(o.paidAt, true)}</dd></>}
            <dt className="text-stone-500">회원</dt>
            <dd>
              {o.customer ? (
                <>
                  {o.customer.name} · {o.customer.email}{' '}
                  <button className="font-semibold underline underline-offset-4" onClick={() => onShowCustomer(o.customer.id)}>이 회원 주문 모두 보기</button>
                </>
              ) : '탈퇴한 회원'}
            </dd>
          </dl>

          <ul className="divide-y divide-stone-100 rounded-xl ring-1 ring-black/5">
            {o.items.map((it, idx) => (
              <li key={idx} className="flex items-center gap-3 p-3">
                <img src={ik(it.image, 120)} alt="" className="h-12 w-12 shrink-0 rounded-lg bg-stone-200 object-cover" />
                <div className="min-w-0 flex-1">
                  <p className="truncate font-medium">{it.name}</p>
                  <p className="text-xs text-stone-500">{it.colorName} · {it.size}mm · {it.qty}켤레 · 개당 {won(it.price)}</p>
                </div>
                <span className="shrink-0 font-semibold">{won(it.price * it.qty)}</span>
              </li>
            ))}
          </ul>

          <dl className="space-y-2">
            <div className="flex justify-between"><dt className="text-stone-500">상품 금액</dt><dd>{won(o.subtotal)}</dd></div>
            <div className="flex justify-between"><dt className="text-stone-500">배송비</dt><dd>{o.shipping === 0 ? '무료' : won(o.shipping)}</dd></div>
            <div className="flex justify-between border-t border-stone-200 pt-2 text-base font-black"><dt>총 결제금액</dt><dd>{won(o.amount)}</dd></div>
          </dl>

          {o.payment && (
            <dl className="grid grid-cols-[5.5rem_1fr] gap-x-4 gap-y-2 rounded-xl bg-stone-50 p-4">
              <dt className="text-stone-500">결제 수단</dt>
              <dd>{[o.payment.method, o.payment.easyPayProvider, o.payment.cardNumber].filter(Boolean).join(' · ')}</dd>
              {o.payment.approvedAt && <><dt className="text-stone-500">승인 시각</dt><dd>{fmtDate(o.payment.approvedAt, true)}</dd></>}
              {va && <><dt className="text-stone-500">입금 계좌</dt><dd>{va.bank} {va.accountNumber} · {va.customerName} · 기한 {fmtDate(va.dueDate, true)}</dd></>}
              <dt className="text-stone-500">paymentKey</dt><dd className="break-all font-mono text-xs leading-5">{o.payment.paymentKey}</dd>
            </dl>
          )}

          {o.payment?.receiptUrl && (
            <Button variant="secondary" className="w-full" href={o.payment.receiptUrl} target="_blank" rel="noopener noreferrer">토스 영수증 보기</Button>
          )}
        </div>
      );
    }

    // ========================================
    // 🚀 App
    // ========================================

    function NotFound() {
      return <EmptyState icon="🧭" title="페이지를 찾을 수 없습니다" action={<Button to="/">홈으로</Button>} />;
    }

    function App() {
      return (
        <Router>
          <ShopProvider>
            <AuthProvider>
              <CartProvider>
                <div className="flex min-h-screen flex-col">
                  <Header />
                  <main className="flex-1">
                    <Routes fallback={<NotFound />}>
                      <Route path="/" element={<HomePage />} />
                      <Route path="/shop" element={<ShopPage />} />
                      <Route path="/product/:id" element={<ProductDetailPage />} />
                      <Route path="/cart" element={<CartPage />} />
                      <Route path="/checkout" element={<CheckoutPage />} />
                      <Route path="/login" element={<AuthPage mode="login" />} />
                      <Route path="/signup" element={<AuthPage mode="signup" />} />
                      <Route path="/mypage" element={<MyPage />} />
                      <Route path="/orders/:orderId" element={<OrderDetailPage />} />
                      <Route path="/admin" element={<AdminProductsPage />} />
                      <Route path="/admin/products" element={<AdminProductsPage />} />
                      <Route path="/admin/products/:id" element={<AdminProductEditPage />} />
                      <Route path="/admin/users" element={<AdminUsersPage />} />
                      <Route path="/admin/orders" element={<AdminOrdersPage />} />
                    </Routes>
                  </main>
                  <Footer />
                </div>
              </CartProvider>
            </AuthProvider>
          </ShopProvider>
        </Router>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
