<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NALSSI · 날씨 운동화</title>
  <meta name="description" content="오늘 날씨에 맞는 한 켤레 — NALSSI 운동화 쇼핑몰">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Pretendard', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
          colors: { paper: '#f3f2ee', ink: '#141414' },
        },
      },
    };
  </script>
  <!-- ⚠️ 모든 CDN 은 버전 고정. Babel 은 반드시 7.x (8.x 는 인라인 text/babel 미지원) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.9/babel.min.js"></script>
  <!-- 토스페이먼츠 결제 SDK v2 (토스가 주소에 버전을 v2 로만 준다). 클라이언트 키는 /api/config 에서 받는다 -->
  <script src="https://js.tosspayments.com/v2/standard"></script>
  <style>
    /* Tailwind 유틸리티로 표현 불가능한 것만 */
    @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .fade-up { animation: fadeUp .35s ease-out both; }
    .fade-in { animation: fadeIn .3s ease-out both; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-paper font-sans text-ink antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef, useContext, useReducer, createContext, useCallback } = React;

    // ========================================
    // ⚙️ 상수 · 도우미
    // ========================================
    // 상품 · 카테고리 · 룩북 · 리뷰 · 재고는 전부 서버(DB)에서 받는다. 이 파일에는 데이터가 없다.

    const API_BASE_URL = '/api';
    const won = (n) => Number(n || 0).toLocaleString('ko-KR') + '원';
    const discountRate = (p) => (p.listPrice > p.price ? Math.round((1 - p.price / p.listPrice) * 100) : 0);

    // ImageKit 주소면 필요한 폭만큼 줄여 받는다 (?tr=w-600 → 600px, 브라우저에 맞는 포맷으로 자동 변환)
    // 관리자가 붙여 넣은 주소에 이미 ? 가 있으면 & 로 잇는다
    const ik = (url, width) => (url && url.includes('ik.imagekit.io') ? `${url}${url.includes('?') ? '&' : '?'}tr=w-${width},q-80` : url);

    const fmtDate = (iso, withTime = false) => {
      if (!iso) return '';
      return new Date(iso).toLocaleString('ko-KR', {
        timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit',
        ...(withTime ? { hour: '2-digit', minute: '2-digit', hour12: false } : {}),
      });
    };

    // 사이즈 가이드 (참고용 환산표 · 220~290mm)
    const SIZE_GUIDE = Array.from({ length: 15 }, (_, i) => {
      const mm = 220 + i * 5;
      const us = 4 + i * 0.5;
      return { mm, usM: us, usW: us + 1.5, uk: us - 0.5 };
    });

    const ORDER_STATUS = {
      READY:               { label: '결제 대기',   tone: 'neutral' },
      PAYING:              { label: '결제 확인 중', tone: 'soft' },
      WAITING_FOR_DEPOSIT: { label: '입금 대기',   tone: 'soft' },
      PAID:                { label: '결제 완료',   tone: 'dark' },
      FAILED:              { label: '결제 실패',   tone: 'sale' },
    };

    // ========================================
    // 🎨 Design System Components
    // ========================================

    function Svg({ className = 'h-5 w-5', children }) {
      return (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"
             strokeLinecap="round" strokeLinejoin="round" className={className} aria-hidden="true">
          {children}
        </svg>
      );
    }
    const IconSearch = (p) => <Svg {...p}><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></Svg>;
    const IconBag    = (p) => <Svg {...p}><path d="M5.5 8h13l-1 12.5h-11L5.5 8Z" /><path d="M9 8V6.5a3 3 0 0 1 6 0V8" /></Svg>;
    const IconUser   = (p) => <Svg {...p}><circle cx="12" cy="8" r="4" /><path d="M4 20.5a8 8 0 0 1 16 0" /></Svg>;
    const IconMenu   = (p) => <Svg {...p}><path d="M4 7h16M4 12h16M4 17h16" /></Svg>;
    const IconClose  = (p) => <Svg {...p}><path d="M6 6l12 12M18 6 6 18" /></Svg>;
    const IconArrow  = (p) => <Svg {...p}><path d="M5 12h14M13 6l6 6-6 6" /></Svg>;

    // to(앱 안 경로) · href(바깥 주소)를 주면 링크(<a>)로, 아니면 <button> 으로 그린다 (링크 안에 버튼을 넣지 않으려고)
    function Button({ variant = 'primary', size = 'md', to, href, className = '', children, ...props }) {
      const base = 'inline-flex items-center justify-center gap-2 rounded-full font-semibold transition-colors disabled:cursor-not-allowed disabled:opacity-40 focus:outline-none focus-visible:ring-2 focus-visible:ring-ink focus-visible:ring-offset-2';
      const variants = {
        primary:      'bg-ink text-white hover:bg-stone-700',
        secondary:    'bg-white text-ink ring-1 ring-stone-300 hover:bg-stone-50',
        ghost:        'bg-transparent text-stone-600 hover:bg-stone-200/70',
        danger:       'bg-red-600 text-white hover:bg-red-700',
        light:        'bg-white text-ink hover:bg-stone-100',
        outlineLight: 'text-white ring-1 ring-white/60 hover:bg-white/10',
      };
      const sizes = { sm: 'px-3.5 py-1.5 text-sm', md: 'px-5 py-2.5 text-sm', lg: 'px-7 py-3.5 text-base' };
      const cls = `${base} ${variants[variant]} ${sizes[size]} ${className}`;
      if (to || href) return <a href={to ? `#${to}` : href} className={cls} {...props}>{children}</a>;
      return <button className={cls} {...props}>{children}</button>;
    }

    function Input({ label, error, hint, className = '', id, ...props }) {
      const inputId = id || `input-${label || 'field'}`;
      return (
        <div className={className}>
          {label && <label htmlFor={inputId} className="mb-1.5 block text-sm font-medium text-stone-700">{label}</label>}
          <input
            id={inputId}
            aria-invalid={!!error}
            className={`w-full rounded-xl border bg-white px-4 py-3 text-sm outline-none transition-colors placeholder:text-stone-400 disabled:bg-stone-100
              ${error ? 'border-red-400 focus:border-red-500' : 'border-stone-300 focus:border-ink'}`}
            {...props}
          />
          {error ? <p className="mt-1 text-xs text-red-600">{error}</p> : hint && <p className="mt-1 text-xs text-stone-400">{hint}</p>}
        </div>
      );
    }

    function Textarea({ label, error, hint, className = '', id, rows = 5, ...props }) {
      const inputId = id || `textarea-${label || 'field'}`;
      return (
        <div className={className}>
          {label && <label htmlFor={inputId} className="mb-1.5 block text-sm font-medium text-stone-700">{label}</label>}
          <textarea
            id={inputId}
            rows={rows}
            aria-invalid={!!error}
            className={`w-full resize-y rounded-xl border bg-white px-4 py-3 text-sm leading-relaxed outline-none transition-colors placeholder:text-stone-400 disabled:bg-stone-100
              ${error ? 'border-red-400 focus:border-red-500' : 'border-stone-300 focus:border-ink'}`}
            {...props}
          />
          {error ? <p className="mt-1 text-xs text-red-600">{error}</p> : hint && <p className="mt-1 text-xs text-stone-400">{hint}</p>}
        </div>
      );
    }

    function Card({ className = '', children, ...props }) {
      return (
        <div className={`rounded-2xl bg-white ring-1 ring-black/5 ${className}`} {...props}>
          {children}
        </div>
      );
    }

    function Badge({ tone = 'neutral', className = '', children }) {
      const tones = {
        neutral: 'bg-stone-100 text-stone-600',
        dark:    'bg-ink text-white',
        sale:    'bg-red-600 text-white',
        soft:    'bg-amber-100 text-amber-800',
        light:   'bg-white/90 text-ink',
      };
      return (
        <span className={`inline-flex items-center rounded-full px-2.5 py-1 text-[11px] font-bold tracking-wide ${tones[tone]} ${className}`}>
          {children}
        </span>
      );
    }

    function Modal({ isOpen, onClose, title, size = 'md', children }) {
      useEffect(() => {
        if (!isOpen) return;
        const onKey = (e) => { if (e.key === 'Escape') onClose(); };
        document.addEventListener('keydown', onKey);
        document.body.style.overflow = 'hidden';
        return () => { document.removeEventListener('keydown', onKey); document.body.style.overflow = ''; };
      }, [isOpen, onClose]);

      if (!isOpen) return null;
      const sizes = { sm: 'max-w-sm', md: 'max-w-md', lg: 'max-w-2xl' };
      // body 로 꺼내 그린다. 페이지 전환 애니메이션(transform)이 걸린 부모 안에 두면 fixed 가 화면이 아니라
      // 그 부모 기준으로 잡혀 모달이 아래로 밀리고 헤더를 덮지 못한다.
      return ReactDOM.createPortal(
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
          <div className="absolute inset-0 bg-black/50" onClick={onClose} aria-hidden="true" />
          <div role="dialog" aria-modal="true" aria-label={title}
               className={`relative max-h-[85vh] w-full overflow-y-auto ${sizes[size]} rounded-2xl bg-white p-6 shadow-xl fade-up`}>
            <div className="mb-4 flex items-start justify-between gap-4">
              <h2 className="text-lg font-bold">{title}</h2>
              <button onClick={onClose} aria-label="닫기"
                      className="-m-1 rounded-full p-1 text-stone-400 hover:bg-stone-100 hover:text-stone-700">
                <IconClose />
              </button>
            </div>
            {children}
          </div>
        </div>,
        document.body,
      );
    }

    function Spinner({ label = '불러오는 중…' }) {
      return (
        <div className="flex items-center justify-center gap-3 py-24 text-sm text-stone-500" role="status">
          <span className="h-5 w-5 animate-spin rounded-full border-2 border-stone-300 border-t-ink" aria-hidden="true" />
          {label}
        </div>
      );
    }

    function Stars({ value, className = 'text-sm' }) {
      return (
        <span className={`relative inline-block whitespace-nowrap leading-none ${className}`} role="img" aria-label={`별점 ${value.toFixed(1)}점`}>
          <span className="text-stone-300">★★★★★</span>
          <span className="absolute inset-y-0 left-0 overflow-hidden text-amber-500" style={{ width: `${(value / 5) * 100}%` }}>★★★★★</span>
        </span>
      );
    }

    function Toast({ message, action, onClose }) {
      useEffect(() => {
        if (!message) return;
        const t = setTimeout(onClose, 4000);
        return () => clearTimeout(t);
      }, [message, onClose]);
      if (!message) return null;
      // Modal 과 같은 이유로 body 로 꺼내 그린다 (그래야 화면 아래쪽에 붙는다)
      return ReactDOM.createPortal(
        <div role="status" className="fixed inset-x-4 bottom-6 z-50 mx-auto flex max-w-md items-center justify-between gap-4 rounded-2xl bg-ink px-5 py-4 text-sm text-white shadow-2xl fade-up">
          <span>{message}</span>
          {action}
        </div>,
        document.body,
      );
    }

    function Alert({ tone = 'error', children }) {
      const tones = { error: 'bg-red-50 text-red-700', info: 'bg-sky-50 text-sky-800', warn: 'bg-amber-50 text-amber-800' };
      return <p role="alert" className={`rounded-xl px-4 py-3 text-sm leading-relaxed ${tones[tone]}`}>{children}</p>;
    }

    function EmptyState({ icon, title, desc, action }) {
      return (
        <div className="mx-auto max-w-md px-4 py-20 text-center">
          <p className="text-4xl" aria-hidden="true">{icon}</p>
          <h2 className="mt-4 text-xl font-bold">{title}</h2>
          {desc && <p className="mt-2 text-sm text-stone-500">{desc}</p>}
          {action && <div className="mt-6">{action}</div>}
        </div>
      );
    }

    // ========================================
    // 🔀 Router (hash-based)
    // ========================================

    const RouterContext = createContext(null);
    const ParamsContext = createContext({});
    const useRouter = () => useContext(RouterContext);
    const useParams = () => useContext(ParamsContext);

    function matchRoute(pattern, pathname) {
      const p = pattern.split('/').filter(Boolean);
      const c = pathname.split('/').filter(Boolean);
      if (p.length !== c.length) return null;
      const params = {};
      for (let i = 0; i < p.length; i++) {
        if (p[i].startsWith(':')) params[p[i].slice(1)] = decodeURIComponent(c[i]);
        else if (p[i] !== c[i]) return null;
      }
      return params;
    }

    function Router({ children }) {
      const read = () => window.location.hash.replace(/^#/, '') || '/';
      const [path, setPath] = useState(read);

      useEffect(() => {
        const onHash = () => { setPath(read()); window.scrollTo({ top: 0 }); };
        window.addEventListener('hashchange', onHash);
        return () => window.removeEventListener('hashchange', onHash);
      }, []);

      const navigate = useCallback((to) => { window.location.hash = to; }, []);

      return <RouterContext.Provider value={{ path, navigate }}>{children}</RouterContext.Provider>;
    }

    // 매칭된 :파라미터를 렌더링 시점에 바로 내려준다 (이전 페이지 값이 한 프레임 남지 않게)
    function Routes({ children, fallback }) {
      const { path } = useRouter();
      const pathname = path.split('?')[0]; // 쿼리스트링(?category=running)은 매칭에서 제외
      for (const route of React.Children.toArray(children)) {
        const params = matchRoute(route.props.path, pathname);
        if (params) {
          return (
            <ParamsContext.Provider value={params}>
              <div key={path} className="fade-up">{route.props.element}</div>
            </ParamsContext.Provider>
          );
        }
      }
      return fallback || null;
    }

    function Route() { return null; }

    function Link({ to, className = '', children, ...props }) {
      return <a href={`#${to}`} className={className} {...props}>{children}</a>;
    }

    // 해시 주소의 쿼리스트링(#/cart?failed=1) 을 읽는다
    function useQuery() {
      const { path } = useRouter();
      return useMemo(() => new URLSearchParams(path.split('?')[1] || ''), [path]);
    }

    // ========================================
    // 🔑 API 호출 · 로그인 상태 (JWT) · 상점 설정
    // ========================================

    const TOKEN_KEY = 'nalssi-token-v1';
    const getToken = () => { try { return localStorage.getItem(TOKEN_KEY) || ''; } catch { return ''; } };
    const setToken = (t) => { try { localStorage.setItem(TOKEN_KEY, t); } catch {} };
    const clearToken = () => { try { localStorage.removeItem(TOKEN_KEY); } catch {} };

    // 모든 서버 호출은 이 함수를 거친다. 토큰을 Authorization 헤더에 자동으로 붙이고,
    // { success:false } 응답은 예외로 바꿔서 화면에서 try/catch 로 받게 한다.
    async function api(path, { method = 'GET', body, auth = true } = {}) {
      const headers = {};
      if (body !== undefined) headers['Content-Type'] = 'application/json';
      const token = auth ? getToken() : '';
      if (token) headers.Authorization = `Bearer ${token}`;

      const res = await fetch(`${API_BASE_URL}${path}`, {
        method, headers,
        body: body === undefined ? undefined : JSON.stringify(body),
      });
      const json = await res.json().catch(() => ({ success: false, message: '서버 응답을 읽지 못했습니다.' }));
      if (!res.ok || !json.success) {
        throw Object.assign(new Error(json.message || '요청에 실패했습니다.'), { status: res.status, code: json.code });
      }
      return json;
    }

    // GET 하나를 불러오는 훅. path 가 null 이면 기다린다.
    function useApi(path) {
      const [state, setState] = useState({ data: null, extra: null, loading: !!path, error: '' });
      const [tick, setTick] = useState(0);

      useEffect(() => {
        if (!path) return;
        let alive = true;
        setState((s) => ({ ...s, loading: true, error: '' }));
        api(path)
          .then((r) => alive && setState({ data: r.data, extra: r, loading: false, error: '' }))
          .catch((err) => alive && setState({ data: null, extra: null, loading: false, error: err.message }));
        return () => { alive = false; };
      }, [path, tick]);

      const reload = useCallback(() => setTick((t) => t + 1), []);
      return { ...state, reload };
    }

    const ShopContext = createContext(null);
    const useShop = () => useContext(ShopContext);

    // 배송비 정책 · 토스 키 · 카테고리는 앱 전체에서 쓰므로 한 번만 받아 둔다
    function ShopProvider({ children }) {
      const config = useApi('/config');
      const categories = useApi('/categories');
      return (
        <ShopContext.Provider value={{ config: config.data, categories: categories.data || [] }}>
          {children}
        </ShopContext.Provider>
      );
    }

    const AuthContext = createContext(null);
    const useAuth = () => useContext(AuthContext);

    function AuthProvider({ children }) {
      const [user, setUser] = useState(null);
      const [ready, setReady] = useState(false);

      // 새로고침해도 로그인이 유지되도록, 저장된 토큰으로 내 정보를 다시 물어본다
      useEffect(() => {
        if (!getToken()) { setReady(true); return; }
        api('/auth/me')
          .then((r) => setUser(r.data.user))
          .catch(() => clearToken())
          .finally(() => setReady(true));
      }, []);

      const save = (data) => { setToken(data.token); setUser(data.user); };
      const login = async (email, password) => {
        const r = await api('/auth/login', { method: 'POST', body: { email, password }, auth: false });
        save(r.data);
      };
      const signup = async (email, password, name) => {
        const r = await api('/auth/signup', { method: 'POST', body: { email, password, name }, auth: false });
        save(r.data);
      };
      const logout = () => { clearToken(); setUser(null); };

      return (
        <AuthContext.Provider value={{ user, ready, login, signup, logout }}>
          {children}
        </AuthContext.Provider>
      );
    }

    // ========================================
    // 🛒 Cart Store (Context + useReducer)
    // ========================================
    // 장바구니는 브라우저(localStorage)에 둔다. 가격 · 재고는 주문서를 만들 때 서버가 DB 로 다시 계산한다.

    const CartContext = createContext(null);
    const useCart = () => useContext(CartContext);
    const CART_KEY = 'nalssi-cart-v1';

    function cartReducer(state, action) {
      switch (action.type) {
        case 'add': {
          const key = `${action.item.variantId}::${action.item.size}`;
          const found = state.find((i) => i.key === key);
          if (found) {
            return state.map((i) => (i.key === key
              ? { ...i, maxQty: action.item.maxQty, qty: Math.min(i.qty + action.item.qty, action.item.maxQty) }
              : i));
          }
          return [...state, { ...action.item, key }];
        }
        case 'qty':
          return state.map((i) => (i.key === action.key ? { ...i, qty: Math.max(1, Math.min(i.maxQty, action.qty)) } : i));
        case 'remove':
          return state.filter((i) => i.key !== action.key);
        case 'clear':
          return [];
        default:
          return state;
      }
    }

    function CartProvider({ children }) {
      const { config } = useShop();
      const [items, dispatch] = useReducer(cartReducer, null, () => {
        try { return JSON.parse(localStorage.getItem(CART_KEY)) || []; } catch { return []; }
      });

      useEffect(() => {
        try { localStorage.setItem(CART_KEY, JSON.stringify(items)); } catch {}
      }, [items]);

      const count = items.reduce((s, i) => s + i.qty, 0);
      const subtotal = items.reduce((s, i) => s + i.price * i.qty, 0);
      const shipping = !config || items.length === 0 || subtotal >= config.freeShippingOver ? 0 : config.shippingFee;

      return (
        <CartContext.Provider value={{ items, dispatch, count, subtotal, shipping, total: subtotal + shipping }}>
          {children}
        </CartContext.Provider>
      );
    }

    // ========================================
    // 🧩 Common / Layout Components
    // ========================================

    function Header() {
      const { count } = useCart();
      const { user } = useAuth();
      const { categories, config } = useShop();
      const { path } = useRouter();
      const [open, setOpen] = useState(false);

      useEffect(() => { setOpen(false); }, [path]);

      const [pathname, qs] = path.split('?');
      const activeCat = pathname === '/shop' ? (new URLSearchParams(qs || '').get('category') || 'all') : null;
      const nav = [{ id: 'all', name: '전체', to: '/shop' }, ...categories.map((c) => ({ id: c.id, name: c.name, to: `/shop?category=${c.id}` }))];

      return (
        <>
          <div className="bg-ink px-4 py-2 text-center text-xs text-white/85">
            {config ? `${won(config.freeShippingOver)} 이상 무료배송 · 사이즈 교환 1회 무료` : '오늘 날씨에 맞는 한 켤레'}
          </div>
          <header className="sticky top-0 z-40 border-b border-black/5 bg-paper/90 backdrop-blur">

    function SectionTitle({ eyebrow, title, desc, more, dark = false }) {
      return (
        <div className="flex flex-wrap items-end justify-between gap-4">

    function ProductCard({ product }) {
      // 고른 컬러는 id 로 기억한다 → 관리자 미리보기처럼 이미지가 바뀌어 들어와도 새 이미지로 그린다
      const [activeId, setActiveId] = useState(product.variants[0].id);
      const active = product.variants.find((v) => v.id === activeId) || product.variants[0];
      const setActive = (v) => setActiveId(v.id);
      const off = discountRate(product);
      const soldOut = product.totalStock === 0;
      const to = `/product/${product.id}?color=${active.id}`;

      return (
        <article className="group">
          <Link to={to} className="block">
            <div className="relative aspect-square overflow-hidden rounded-2xl bg-stone-200">
              <img src={ik(active.image, 600)} alt={`${product.name} ${active.colorName}`} loading="lazy"
                   className="h-full w-full object-cover transition-transform duration-500 group-hover:scale-105" />
              <div className="absolute left-3 top-3 flex gap-1.5">
                {product.badge && <Badge tone="dark">{product.badge}</Badge>}
                {off > 0 && <Badge tone="sale">-{off}%</Badge>}
              </div>
              {soldOut && (
                <div className="absolute inset-0 flex items-center justify-center bg-white/60">
                  <span className="rounded-full bg-ink px-4 py-1.5 text-sm font-bold text-white">품절</span>
                </div>
              )}
            </div>
          </Link>

          <div className="mt-3 flex items-center gap-2">
            {product.variants.map((v) => (
              <button key={v.id} type="button" onMouseEnter={() => setActive(v)} onFocus={() => setActive(v)} onClick={() => setActive(v)}
                      aria-label={`${v.colorName} 컬러 보기`} aria-pressed={active.id === v.id}
                      className={`h-4 w-4 rounded-full ring-offset-2 ring-offset-paper transition ${active.id === v.id ? 'ring-2 ring-ink' : 'ring-1 ring-black/15'}`}
                      style={{ backgroundColor: v.colorHex }} />
            ))}
            <span className="ml-1 text-xs text-stone-500">{active.colorName}</span>
          </div>

          <Link to={to} className="block">
            <h3 className="mt-2 font-bold tracking-tight">{product.name}</h3>
            <p className="mt-0.5 line-clamp-1 text-sm text-stone-500">{product.tagline}</p>
          </Link>
          <div className="mt-2 flex flex-wrap items-baseline gap-x-2">
            {off > 0 && <span className="text-sm font-bold text-red-600">{off}%</span>}
            <span className="font-bold">{won(product.price)}</span>
            {off > 0 && <span className="text-xs text-stone-400 line-through">{won(product.listPrice)}</span>}
          </div>
          {product.reviewCount > 0 && (
            <div className="mt-1.5 flex items-center gap-1.5 text-xs text-stone-500">
              <Stars value={product.rating} className="text-xs" />
              <span>{product.rating.toFixed(1)} ({product.reviewCount})</span>
            </div>
          )}
        </article>
      );
    }

    function ProductGrid({ state, skeleton = 4, cols = 'lg:grid-cols-4' }) {
      if (state.error) {
        return (
          <div className="mt-6 space-y-3">
            <Alert>{state.error}</Alert>
            <Button variant="secondary" size="sm" onClick={state.reload}>다시 시도</Button>
          </div>
        );
      }
      const list = state.data || [];
      return (
        <div className={`mt-6 grid grid-cols-2 gap-x-4 gap-y-10 md:grid-cols-3 ${cols}`}>
          {state.loading && list.length === 0
            ? Array.from({ length: skeleton }, (_, i) => (
                <div key={i} aria-hidden="true">
                  <div className="aspect-square animate-pulse rounded-2xl bg-stone-200" />
                  <div className="mt-3 h-4 w-2/3 animate-pulse rounded bg-stone-200" />
                  <div className="mt-2 h-4 w-1/3 animate-pulse rounded bg-stone-200" />

              ))
            : list.map((p) => <ProductCard key={p.id} product={p} />)}
        </div>
      );

    function LoginRequired({ next, desc = '주문 내역은 본인만 볼 수 있어요.' }) {

        <EmptyState icon="🔒" title="로그인이 필요합니다" desc={desc}
          action={<Button size="lg" to={`/login?next=${encodeURIComponent(next)}`}>로그인하기</Button>} />
      );

    function OrderStatusBadge({ status }) {
      const s = ORDER_STATUS[status] || ORDER_STATUS.READY;
      return <Badge tone={s.tone}>{s.label}</Badge>;

    // ========================================
    // 📄 Page: 홈
    // ========================================

    function HomePage() {
      const stories = useApi('/stories');
      const best = useApi('/products?sort=rating&limit=4');
      const fresh = useApi('/products?sort=new&limit=4');
      const { categories } = useShop();

      const hero = list.find((s) => s.kind === 'hero');
      const looks = list.filter((s) => s.kind === 'look');
      const craft = list.find((s) => s.kind === 'story');
      const drop = list.find((s) => s.kind === 'drop');

      return (
        <div>

            {hero && <img src={ik(hero.image, 1920)} alt="" className="absolute inset-0 -z-10 h-full w-full object-cover fade-in" />}
            <div className="absolute inset-0 -z-10 bg-gradient-to-t from-black/80 via-black/25 to-black/5" />
            <div className="mx-auto flex h-[78vh] max-h-[780px] min-h-[520px] max-w-7xl flex-col justify-end px-4 pb-14 sm:px-6 sm:pb-20">
              {hero ? (
                <div className="max-w-xl text-white">
                  <p className="text-xs font-bold tracking-[0.3em] text-white/70">{hero.eyebrow}</p>
                  <h1 className="mt-4 text-4xl font-black leading-[1.1] tracking-tight sm:text-6xl">{hero.title}</h1>
                  <p className="mt-4 text-sm leading-relaxed text-white/80 sm:text-base">{hero.body}</p>
                  <div className="mt-8 flex flex-wrap gap-3">
                    <Button size="lg" variant="light" to={hero.link}>{hero.cta}</Button>
                    <Button size="lg" variant="outlineLight" to="/shop?category=running">러닝화 보기</Button>
                  </div>

                <Alert>{stories.error}</Alert>

                <div className="h-48 w-full max-w-xl animate-pulse rounded-2xl bg-white/10" aria-hidden="true" />

          </section>

          {/* 카테고리 */}
          <section className="mx-auto max-w-7xl px-4 pt-16 sm:px-6">
            <SectionTitle eyebrow="SHOP BY CATEGORY" title="어디로, 어떻게 걸을까요" more="/shop" />
            <div className="mt-6 grid grid-cols-2 gap-3 lg:grid-cols-4">
              {categories.map((c) => (
                <Link key={c.id} to={`/shop?category=${c.id}`}
                      className="group relative block aspect-[4/5] overflow-hidden rounded-2xl bg-stone-200 sm:aspect-[4/3]">
                  <img src={ik(c.image, 700)} alt="" loading="lazy" className="h-full w-full object-cover transition-transform duration-500 group-hover:scale-105" />
                  <div className="absolute inset-x-0 bottom-0 bg-gradient-to-t from-black/65 to-transparent p-4 pt-12 text-white">
                    <p className="text-lg font-black">{c.name}</p>
                    <p className="mt-0.5 line-clamp-2 text-xs text-white/80">{c.description}</p>
                  </div>
                  <Badge tone="light" className="absolute right-3 top-3">{c.productCount}종</Badge>
                </Link>
              ))}
            </div>
          </section>

          {/* 베스트 */}
          <section className="mx-auto max-w-7xl px-4 pt-20 sm:px-6">
            <SectionTitle eyebrow="BEST" title="리뷰가 증명한 한 켤레" desc="평점과 리뷰 수로 줄 세웠어요." more="/shop?sort=rating" />
            <ProductGrid state={best} />
          </section>

          {/* 룩북 */}
          {looks.length > 0 && (
            <section className="mt-20 bg-ink py-16 text-white">
              <div className="mx-auto max-w-7xl px-4 sm:px-6">
                <SectionTitle dark eyebrow="LOOKBOOK" title="하루의 날씨, 하루의 신발" desc="새벽 조깅부터 막차까지. 시간마다 다른 한 켤레." />
                <div className="no-scrollbar -mx-4 mt-8 flex snap-x gap-4 overflow-x-auto px-4 md:mx-0 md:grid md:grid-cols-3 md:overflow-visible md:px-0">
                  {looks.map((l) => (
                    <Link key={l.id} to={l.link} className="group block w-[78%] shrink-0 snap-start md:w-auto">
                      <div className="aspect-[3/4] overflow-hidden rounded-2xl bg-stone-800">
                        <img src={ik(l.image, 800)} alt={l.title} loading="lazy" className="h-full w-full object-cover transition-transform duration-700 group-hover:scale-105" />
                      </div>
                      <p className="mt-4 text-xs font-bold tracking-[0.25em] text-white/50">{l.eyebrow}</p>

              </div>
              <div>
                <p className="text-xs font-bold tracking-[0.3em] text-stone-400">{craft.eyebrow}</p>

    // ========================================
    // 📄 Page: 상품 목록 (카테고리 · 정렬 · 검색)
    // ========================================

    const SORT_OPTIONS = [
      { id: 'recommended', name: '추천순' },
      { id: 'new',         name: '신상품순' },
      { id: 'rating',      name: '평점 높은 순' },
      { id: 'price-asc',   name: '낮은 가격순' },
      { id: 'price-desc',  name: '높은 가격순' },
    ];

    function ShopPage() {
      const query = useQuery();
      const { navigate } = useRouter();
      const { categories } = useShop();
      const category = query.get('category') || '';
      const sort = query.get('sort') || 'recommended';
      const q = query.get('q') || '';
      const [text, setText] = useState(q);
      const searchRef = useRef(null);

      useEffect(() => { if (query.get('focus') === 'search') searchRef.current?.focus(); }, []);

      const params = new URLSearchParams();
      if (category) params.set('category', category);
      if (sort !== 'recommended') params.set('sort', sort);
      if (q) params.set('q', q);
      const list = useApi(`/products?${params}`);

      // 필터를 바꾸면 주소를 바꾼다 → 새로고침 · 뒤로 가기 · 링크 공유가 그대로 된다
      const go = (patch) => {
        const next = new URLSearchParams({ ...Object.fromEntries(params), ...patch });
        for (const [k, v] of [...next]) if (!v || (k === 'sort' && v === 'recommended')) next.delete(k);
        const s = next.toString();
        navigate(`/shop${s ? `?${s}` : ''}`);
      };

      const current = categories.find((c) => c.id === category);

      return (
        <div className="mx-auto max-w-7xl px-4 pt-10 sm:px-6">
          <p className="text-xs font-bold tracking-[0.3em] text-stone-400">SHOP</p>
          <h1 className="mt-2 text-3xl font-black tracking-tight sm:text-4xl">{current ? current.name : '전체 상품'}</h1>
          <p className="mt-2 text-sm text-stone-500">{current ? current.description : '맑은 날부터 눈 오는 날까지, 날씨마다 다른 열두 켤레.'}</p>

          <div className="no-scrollbar mt-6 flex gap-2 overflow-x-auto">
            {[{ id: '', name: '전체' }, ...categories].map((c) => (
              <button key={c.id || 'all'} onClick={() => go({ category: c.id })} aria-pressed={category === c.id}
                      className={`shrink-0 rounded-full px-4 py-2 text-sm font-semibold transition-colors ${category === c.id ? 'bg-ink text-white' : 'bg-white text-stone-600 ring-1 ring-black/10 hover:text-ink'}`}>
                {c.name}{c.productCount != null && <span className="ml-1 opacity-60">{c.productCount}</span>}
              </button>
            ))}
          </div>

          <div className="mt-4 flex flex-col gap-3 border-b border-black/5 pb-4 sm:flex-row sm:items-center sm:justify-between">
            <form className="relative w-full sm:max-w-xs" role="search" onSubmit={(e) => { e.preventDefault(); go({ q: text.trim() }); }}>
              <IconSearch className="pointer-events-none absolute left-3.5 top-1/2 h-4 w-4 -translate-y-1/2 text-stone-400" />
              <input ref={searchRef} value={text} onChange={(e) => setText(e.target.value)} type="search"
                     placeholder="모델 · 컬러 검색 (예: 니트, 화이트)" aria-label="상품 검색"
                     className="w-full rounded-full border border-stone-300 bg-white py-2.5 pl-10 pr-4 text-sm outline-none focus:border-ink" />
            </form>
            <div className="flex items-center gap-3">
              <span className="text-sm text-stone-500">{list.data ? `${list.data.length}개 상품` : ''}</span>
              <select value={sort} onChange={(e) => go({ sort: e.target.value })} aria-label="정렬"
                      className="rounded-full border border-stone-300 bg-white px-4 py-2 text-sm outline-none focus:border-ink">
                {SORT_OPTIONS.map((o) => <option key={o.id} value={o.id}>{o.name}</option>)}
              </select>
            </div>
          </div>

          {q && (
            <p className="mt-4 text-sm text-stone-600">
              ‘<b>{q}</b>’ 검색 결과 · <button className="underline underline-offset-4" onClick={() => go({ q: '' })}>검색어 지우기</button>
            </p>
          )}

          {!list.loading && !list.error && list.data && list.data.length === 0 ? (
            <EmptyState icon="👟" title="맞는 신발이 없어요" desc="다른 검색어나 카테고리를 골라 보세요."
              action={<Button variant="secondary" to="/shop">전체 상품 보기</Button>} />
          ) : (
            <ProductGrid state={list} skeleton={8} />
          )}
        </div>
      );
    }

    // ========================================
    // 📄 Page: 상품 상세 (컬러 · 사이즈 재고 · 리뷰)
    // ========================================

    function ProductDetailPage() {
      const { id } = useParams();
      const query = useQuery();
      const { navigate } = useRouter();
      const { items, dispatch } = useCart();
      const { config } = useShop();
      const { data: product, loading, error, reload } = useApi(`/products/${encodeURIComponent(id)}`);
      const related = useApi(product ? `/products?category=${product.categoryId}&limit=5` : null);

      const [variantId, setVariantId] = useState(query.get('color') || '');
      const [size, setSize] = useState(null);
      const [qty, setQty] = useState(1);
      const [notice, setNotice] = useState('');
      const [guideOpen, setGuideOpen] = useState(false);
      const [toast, setToast] = useState('');
      const reviewsRef = useRef(null);
      const closeToast = useCallback(() => setToast(''), []);
      const closeGuide = useCallback(() => setGuideOpen(false), []);

      if (loading && !product) return <Spinner />;
      if (error || !product) {
        return (
          <EmptyState icon="👟" title={error || '상품을 찾을 수 없습니다'}
            action={<div className="flex justify-center gap-2"><Button variant="secondary" onClick={reload}>다시 시도</Button><Button to="/shop">상품 보러 가기</Button></div>} />
        );
      }

      const variant = product.variants.find((v) => v.id === variantId) || product.variants[0];
      const sizeInfo = size ? variant.sizes.find((s) => s.size === size) : null;
      const lineMax = Math.min(config?.maxQtyPerLine || 10, sizeInfo ? sizeInfo.stock : 0);
      const inCart = sizeInfo ? (items.find((i) => i.key === `${variant.id}::${size}`)?.qty || 0) : 0;
      const canAdd = Math.max(0, lineMax - inCart);
      const off = discountRate(product);
      const variantStock = variant.sizes.reduce((s, x) => s + x.stock, 0);
      const fitTotal = product.fit.small + product.fit.true + product.fit.large;
      const relatedList = (related.data || []).filter((p) => p.id !== product.id).slice(0, 4);

      function pickColor(v) {
        setVariantId(v.id);
        setNotice('');
        const same = size && v.sizes.find((x) => x.size === size);
        if (!same || same.stock === 0) setSize(null);
        setQty(1);
      }

      function pickSize(s) {
        setSize(s.size);
        setNotice('');
        setQty(1);
      }

      function addToCart() {
        if (!size) return setNotice('사이즈를 선택해주세요.');
        if (canAdd < 1) return setNotice(`이 사이즈는 장바구니에 이미 ${inCart}개가 있어 더 담을 수 없어요.`);
        const n = Math.min(qty, canAdd);
        dispatch({
          type: 'add',
          item: {
            variantId: variant.id, productId: product.id, name: product.name, colorName: variant.colorName,
            image: variant.image, size, qty: n, price: product.price, maxQty: lineMax,
          },
        });
        setToast(`${variant.colorName} ${size} · ${n}켤레를 담았어요`);
        setQty(1);
      }

      return (
        <div className="mx-auto max-w-7xl px-4 pt-6 sm:px-6">
          <nav className="text-xs text-stone-500" aria-label="위치">
            <Link to="/" className="hover:text-ink">홈</Link> <span aria-hidden="true">/</span>{' '}
            <Link to={`/shop?category=${product.categoryId}`} className="hover:text-ink">{product.categoryName}</Link> <span aria-hidden="true">/</span>{' '}
            <span className="text-stone-700">{product.name}</span>
          </nav>

          <div className="mt-4 grid gap-8 lg:grid-cols-[1.15fr_1fr] lg:gap-14">
            {/* 이미지 */}
            <div>
              <div className="relative aspect-square overflow-hidden rounded-3xl bg-stone-200">
                <img key={variant.id} src={ik(variant.image, 1200)} alt={`${product.name} ${variant.colorName}`} className="h-full w-full object-cover fade-in" />
                <div className="absolute left-4 top-4 flex gap-1.5">
                  {product.badge && <Badge tone="dark">{product.badge}</Badge>}
                  {off > 0 && <Badge tone="sale">-{off}%</Badge>}
                </div>
              </div>
              <div className="mt-3 grid grid-cols-4 gap-3 sm:grid-cols-6">
                {product.variants.map((v) => (
                  <button key={v.id} onClick={() => pickColor(v)} aria-label={`${v.colorName} 컬러`} aria-pressed={v.id === variant.id}
                          className={`aspect-square overflow-hidden rounded-xl bg-stone-200 transition ${v.id === variant.id ? 'ring-2 ring-ink ring-offset-2 ring-offset-paper' : 'opacity-70 hover:opacity-100'}`}>
                    <img src={ik(v.image, 200)} alt="" className="h-full w-full object-cover" />
                  </button>
                ))}
              </div>
            </div>

            {/* 구매 정보 */}
            <div className="lg:sticky lg:top-24 lg:self-start">
              <p className="text-xs font-bold tracking-[0.25em] text-stone-400">{product.categoryName.toUpperCase()}</p>
              <h1 className="mt-2 text-3xl font-black tracking-tight sm:text-4xl">{product.name}</h1>
              <p className="mt-2 text-stone-600">{product.tagline}</p>

              {product.reviewCount > 0 && (
                <button className="mt-3 flex items-center gap-2 text-sm text-stone-600 hover:text-ink"
                        onClick={() => reviewsRef.current?.scrollIntoView({ behavior: 'smooth' })}>
                  <Stars value={product.rating} />
                  <span className="font-semibold">{product.rating.toFixed(1)}</span>
                  <span className="underline underline-offset-4">리뷰 {product.reviewCount}개</span>
                </button>
              )}

              <div className="mt-5 flex flex-wrap items-baseline gap-x-3">
                {off > 0 && <span className="text-2xl font-black text-red-600">{off}%</span>}
                <span className="text-2xl font-black">{won(product.price)}</span>
                {off > 0 && <span className="text-sm text-stone-400 line-through">{won(product.listPrice)}</span>}
              </div>

              {/* 컬러 */}
              <div className="mt-7">
                <p className="text-sm font-semibold">컬러 <span className="font-normal text-stone-500">· {variant.colorName}</span></p>
                <div className="mt-3 flex gap-2.5">
                  {product.variants.map((v) => (
                    <button key={v.id} onClick={() => pickColor(v)} aria-label={v.colorName} aria-pressed={v.id === variant.id}
                            className={`h-9 w-9 rounded-full ring-offset-2 ring-offset-paper transition ${v.id === variant.id ? 'ring-2 ring-ink' : 'ring-1 ring-black/15 hover:ring-black/40'}`}
                            style={{ backgroundColor: v.colorHex }} />
                  ))}
                </div>
              </div>

              {/* 사이즈 */}
              <div className="mt-7">
                <div className="flex items-center justify-between">
                  <p className="text-sm font-semibold">사이즈 <span className="font-normal text-stone-500">(mm)</span></p>
                  <button className="text-xs text-stone-500 underline underline-offset-4 hover:text-ink" onClick={() => setGuideOpen(true)}>
                    사이즈 가이드
                  </button>
                </div>
                {variantStock === 0 && <div className="mt-3"><Alert tone="warn">이 컬러는 전 사이즈 품절이에요. 다른 컬러를 골라 보세요.</Alert></div>}
                <div className="mt-3 grid grid-cols-5 gap-2" role="radiogroup" aria-label="사이즈 선택">
                  {variant.sizes.map((s) => {
                    const out = s.stock === 0;
                    const selected = s.size === size;
                    return (
                      <button key={s.size} role="radio" aria-checked={selected} disabled={out} onClick={() => pickSize(s)}
                              aria-label={`${s.size} ${out ? '품절' : `재고 ${s.stock}개`}`}
                              className={`flex h-12 flex-col items-center justify-center rounded-xl text-sm font-semibold transition
                                ${selected ? 'bg-ink text-white' : out ? 'cursor-not-allowed bg-stone-100 text-stone-300 line-through' : 'bg-white ring-1 ring-black/10 hover:ring-ink'}`}>
                        {s.size}
                        {!out && s.stock <= 3 && (
                          <span className={`text-[10px] font-medium leading-none ${selected ? 'text-white/70' : 'text-orange-600'}`}>{s.stock}개 남음</span>
                        )}
                      </button>
                    );
                  })}
                </div>
              </div>

              {/* 수량 */}
              <div className="mt-7 flex items-center justify-between">
                <div className="flex items-center rounded-full bg-white ring-1 ring-black/10">
                  <button className="h-10 w-10 rounded-full text-lg disabled:opacity-30" aria-label="수량 줄이기"
                          disabled={qty <= 1} onClick={() => setQty((n) => Math.max(1, n - 1))}>−</button>
                  <span className="w-8 text-center text-sm font-semibold" aria-live="polite">{qty}</span>
                  <button className="h-10 w-10 rounded-full text-lg disabled:opacity-30" aria-label="수량 늘리기"
                          disabled={!size || qty >= canAdd} onClick={() => setQty((n) => Math.min(canAdd, n + 1))}>+</button>
                </div>
                <p className="text-right">
                  <span className="text-xs text-stone-500">합계 </span>
                  <span className="text-xl font-black">{won(product.price * qty)}</span>
                </p>
              </div>

              {notice && <div className="mt-4"><Alert tone="warn">{notice}</Alert></div>}

              <div className="mt-5 grid grid-cols-[1fr_auto] gap-2">
                <Button size="lg" onClick={addToCart} disabled={variantStock === 0}>
                  {size ? '장바구니 담기' : '사이즈를 고르세요'}
                </Button>
                <Button size="lg" variant="secondary" to="/cart" aria-label="장바구니로 이동"><IconBag /></Button>
              </div>

              <Card className="mt-6 divide-y divide-stone-100 text-sm">
                <div className="flex justify-between gap-4 p-4">
                  <span className="text-stone-500">배송</span>
                  <span className="text-right">{config ? `${won(config.freeShippingOver)} 이상 무료 · 미만 ${won(config.shippingFee)}` : '—'}</span>
                </div>
                <div className="flex justify-between gap-4 p-4"><span className="text-stone-500">소재</span><span className="text-right">{product.material}</span></div>
                <div className="flex justify-between gap-4 p-4"><span className="text-stone-500">무게</span><span className="text-right">{product.weight}</span></div>
              </Card>
            </div>
          </div>

          {/* 설명 */}
          <section className="mt-16 grid gap-8 border-t border-black/5 pt-12 md:grid-cols-[1fr_1fr]">
            <div>
              <h2 className="text-xl font-black">이 신발에 대해</h2>
              <p className="mt-3 leading-relaxed text-stone-600">{product.description}</p>
            </div>
            <ul className="grid gap-2 sm:grid-cols-2">
              {product.features.map((f) => (
                <li key={f} className="flex items-center gap-2 rounded-xl bg-white px-4 py-3 text-sm ring-1 ring-black/5">
                  <span className="text-emerald-600" aria-hidden="true">✓</span>{f}
                </li>
              ))}
            </ul>
          </section>

          {/* 리뷰 */}
          <section ref={reviewsRef} className="mt-16 scroll-mt-24 border-t border-black/5 pt-12">
            <div className="grid gap-8 md:grid-cols-[280px_1fr]">
              <div>
                <h2 className="text-xl font-black">리뷰 {product.reviewCount}</h2>
                {product.reviewCount > 0 && (
                  <>
                    <p className="mt-3 flex items-center gap-2"><span className="text-4xl font-black">{product.rating.toFixed(1)}</span><Stars value={product.rating} className="text-lg" /></p>
                    {fitTotal > 0 && (
                      <div className="mt-6 space-y-2.5">
                        <p className="text-sm font-semibold">착용감</p>
                        {[['작아요', product.fit.small], ['정사이즈', product.fit.true], ['커요', product.fit.large]].map(([label, n]) => (
                          <div key={label} className="flex items-center gap-3 text-xs">
                            <span className="w-14 text-stone-500">{label}</span>
                            <div className="h-1.5 flex-1 overflow-hidden rounded-full bg-stone-200">
                              <div className="h-full rounded-full bg-ink" style={{ width: `${(n / fitTotal) * 100}%` }} />
                            </div>
                            <span className="w-9 text-right text-stone-500">{Math.round((n / fitTotal) * 100)}%</span>
                          </div>
                        ))}
                      </div>
                    )}
                  </>
                )}
              </div>
              <div className="divide-y divide-black/5">
                {product.reviews.length === 0 && <p className="text-sm text-stone-500">아직 리뷰가 없어요.</p>}
                {product.reviews.map((r) => (
                  <article key={r.id} className="py-5 first:pt-0">
                    <div className="flex flex-wrap items-center gap-x-3 gap-y-1 text-xs text-stone-500">
                      <Stars value={r.rating} className="text-xs" />
                      <span className="font-semibold text-stone-700">{r.author}</span>
                      <span>{r.createdOn.replaceAll('-', '.')}</span>
                    </div>
                    <p className="mt-1.5 text-xs text-stone-400">{[r.colorName, r.size && `${r.size}mm`, r.fit].filter(Boolean).join(' · ')}</p>
                    <p className="mt-2 text-sm leading-relaxed">{r.body}</p>
                  </article>
                ))}
              </div>
            </div>
          </section>

          {/* 같은 카테고리 */}
          {relatedList.length > 0 && (
            <section className="mt-16 border-t border-black/5 pt-12">
              <SectionTitle title={`${product.categoryName} 더 보기`} more={`/shop?category=${product.categoryId}`} />
              <ProductGrid state={{ ...related, data: relatedList }} />
            </section>
          )}

          <Modal isOpen={guideOpen} onClose={closeGuide} title="사이즈 가이드">
            <p className="text-sm text-stone-500">발 길이(mm) 기준 참고용 환산표예요. 리뷰의 착용감도 함께 확인해 주세요.</p>
            <table className="mt-4 w-full text-center text-sm">
              <thead className="text-xs text-stone-500">
                <tr className="border-b border-stone-200"><th className="py-2">mm</th><th>US 남성</th><th>US 여성</th><th>UK</th></tr>
              </thead>
              <tbody>
                {SIZE_GUIDE.map((r) => (
                  <tr key={r.mm} className={`border-b border-stone-100 ${r.mm === size ? 'bg-amber-50 font-semibold' : ''}`}>
                    <td className="py-2">{r.mm}</td><td>{r.usM}</td><td>{r.usW}</td><td>{r.uk}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </Modal>

          <Toast message={toast} onClose={closeToast}
                 action={<button className="shrink-0 font-semibold underline underline-offset-4" onClick={() => navigate('/cart')}>장바구니 보기</button>} />
        </div>
      );
    }

    // ========================================
    // 📄 Page: 장바구니
    // ========================================

    function CartPage() {
      const { items, dispatch, count, subtotal, shipping, total } = useCart();
      const { config } = useShop();
      const { user } = useAuth();
      const { navigate } = useRouter();
      const query = useQuery();
      const failed = query.get('failed') === '1';
      const failMessage = query.get('message') || '결제가 완료되지 않았습니다.';
      const remain = config ? Math.max(0, config.freeShippingOver - subtotal) : 0;
      const progress = config ? Math.min(100, (subtotal / config.freeShippingOver) * 100) : 0;

      const goCheckout = () => navigate(user ? '/checkout' : `/login?next=${encodeURIComponent('/checkout')}`);

      return (
        <div className="mx-auto max-w-6xl px-4 pt-10 sm:px-6">
          <h1 className="text-3xl font-black tracking-tight">장바구니 <span className="text-stone-400">{count}</span></h1>

          {failed && <div className="mt-5"><Alert>결제가 완료되지 않았어요 — {failMessage}</Alert></div>}

          {items.length === 0 ? (
            <EmptyState icon="🛍️" title="장바구니가 비어 있어요" desc="오늘 날씨에 맞는 한 켤레를 골라 보세요."
              action={<Button size="lg" to="/shop">상품 보러 가기</Button>} />
          ) : (
            <div className="mt-6 grid gap-8 lg:grid-cols-[1fr_340px]">
              <ul className="divide-y divide-black/5 rounded-2xl bg-white ring-1 ring-black/5">
                {items.map((it) => (
                  <li key={it.key} className="flex gap-4 p-4">
                    <Link to={`/product/${it.productId}?color=${it.variantId}`} className="shrink-0">
                      <img src={ik(it.image, 240)} alt="" className="h-24 w-24 rounded-xl bg-stone-200 object-cover" />
                    </Link>
                    <div className="flex min-w-0 flex-1 flex-col">
                      <div className="flex items-start justify-between gap-3">
                        <div className="min-w-0">
                          <Link to={`/product/${it.productId}?color=${it.variantId}`} className="block truncate font-bold hover:underline">{it.name}</Link>
                          <p className="mt-0.5 text-sm text-stone-500">{it.colorName} · {it.size}mm</p>
                        </div>
                        <button className="shrink-0 rounded-full p-1 text-stone-400 hover:bg-stone-100 hover:text-ink" aria-label={`${it.name} 빼기`}
                                onClick={() => dispatch({ type: 'remove', key: it.key })}>
                          <IconClose className="h-4 w-4" />
                        </button>
                      </div>
                      <div className="mt-auto flex items-end justify-between pt-3">
                        <div className="flex items-center rounded-full ring-1 ring-black/10">
                          <button className="h-8 w-8 rounded-full disabled:opacity-30" aria-label="수량 줄이기" disabled={it.qty <= 1}
                                  onClick={() => dispatch({ type: 'qty', key: it.key, qty: it.qty - 1 })}>−</button>
                          <span className="w-7 text-center text-sm font-semibold">{it.qty}</span>
                          <button className="h-8 w-8 rounded-full disabled:opacity-30" aria-label="수량 늘리기" disabled={it.qty >= it.maxQty}
                                  onClick={() => dispatch({ type: 'qty', key: it.key, qty: it.qty + 1 })}>+</button>
                        </div>
                        <span className="font-bold">{won(it.price * it.qty)}</span>
                      </div>
                    </div>
                  </li>
                ))}
              </ul>

              <aside className="h-fit space-y-4 lg:sticky lg:top-24">
                <Card className="p-6">
                  <h2 className="font-bold">결제 예상 금액</h2>
                  <dl className="mt-4 space-y-2.5 text-sm">
                    <div className="flex justify-between"><dt className="text-stone-500">상품 금액</dt><dd>{won(subtotal)}</dd></div>
                    <div className="flex justify-between">
                      <dt className="text-stone-500">배송비</dt>
                      <dd>{shipping === 0 ? <span className="font-semibold text-emerald-600">무료</span> : won(shipping)}</dd>
                    </div>
                  </dl>
                  {config && (
                    <div className="mt-4">
                      <div className="h-1.5 overflow-hidden rounded-full bg-stone-200">
                        <div className="h-full rounded-full bg-emerald-500 transition-all" style={{ width: `${progress}%` }} />
                      </div>
                      <p className="mt-2 text-xs text-stone-500">
                        {remain > 0 ? <><b className="text-ink">{won(remain)}</b> 더 담으면 무료배송</> : '무료배송 조건을 채웠어요 🎉'}
                      </p>
                    </div>
                  )}
                  <div className="mt-5 flex items-baseline justify-between border-t border-stone-200 pt-4">
                    <span className="text-sm text-stone-600">합계</span>
                    <span className="text-2xl font-black">{won(total)}</span>
                  </div>
                  <Button size="lg" className="mt-5 w-full" onClick={goCheckout}>{user ? '주문하기' : '로그인하고 주문하기'}</Button>
                  <p className="mt-3 text-center text-xs text-stone-400">최종 금액과 재고는 주문서에서 서버가 다시 확인해요.</p>
                </Card>
                <Button variant="ghost" className="w-full" onClick={() => dispatch({ type: 'clear' })}>장바구니 비우기</Button>
              </aside>
            </div>
          )}
        </div>
      );
    }

    // ========================================
    // 📄 Page: 결제 (토스페이먼츠 결제위젯)
    // ========================================

    // 결제는 3단계다.
    //  ① 서버에 주문서를 만든다 → 서버가 DB 가격 · 재고로 금액을 계산해 orderId 와 금액을 돌려준다
    //  ② 그 금액으로 토스 결제위젯을 그린다 (카드번호는 토스만 본다. 우리 서버는 모른다)
    //  ③ 결제가 끝나면 토스가 /api/payments/success 로 되돌려 보내고, 서버가 최종 승인 + 재고 차감
    function CheckoutPage() {
      const { items } = useCart();
      const { user, ready } = useAuth();
      const { navigate } = useRouter();
      const [order, setOrder] = useState(null);
      const [widgets, setWidgets] = useState(null);
      const [error, setError] = useState(null);
      const [paying, setPaying] = useState(false);
      const startedRef = useRef(false); // 주문서가 두 번 만들어지지 않도록

      useEffect(() => {
        if (!ready || !user || items.length === 0 || startedRef.current) return;
        startedRef.current = true;

        (async () => {
          try {
            const { data: config } = await api('/config', { auth: false });
            if (!config.paymentEnabled) throw new Error('서버에 토스 키가 설정되어 있지 않습니다. .env 를 확인해주세요.');
            if (typeof TossPayments === 'undefined') throw new Error('토스 결제 SDK 를 불러오지 못했습니다. 새로고침해 주세요.');

            const { data: created } = await api('/orders', {
              method: 'POST',
              body: { items: items.map((i) => ({ variantId: i.variantId, size: i.size, qty: i.qty })) },
            });
            setOrder(created);

            const w = TossPayments(config.tossClientKey).widgets({ customerKey: created.customerKey });
            await w.setAmount({ currency: 'KRW', value: created.amount });
            await Promise.all([
              w.renderPaymentMethods({ selector: '#toss-payment-method', variantKey: 'DEFAULT' }),
              w.renderAgreement({ selector: '#toss-agreement', variantKey: 'AGREEMENT' }),
            ]);
            setWidgets(w);
          } catch (err) {
            setError({ message: err.message || '결제 준비에 실패했습니다.', code: err.code });
          }
        })();
      }, [ready, user, items.length]);

      async function handlePay() {
        if (!widgets || !order) return;
        setPaying(true);
        setError(null);
        try {
          await widgets.requestPayment({
            orderId: order.orderId,
            orderName: order.orderName,
            successUrl: `${window.location.origin}${order.successUrl}`,
            failUrl: `${window.location.origin}${order.failUrl}`,
            customerEmail: order.customerEmail,
            customerName: order.customerName,
          });

          // 결제창을 닫으면 토스는 failUrl 로 보내지 않고 여기서 USER_CANCEL 을 던진다 → 주문서는 그대로라 다시 누르면 된다
          const message = err.code === 'USER_CANCEL'
            ? '결제창을 닫아 결제가 취소됐어요. 다시 결제하려면 결제하기를 눌러 주세요.'
            : err.message || '결제를 시작하지 못했습니다.';
          setError({ message, code: err.code });
          setPaying(false);

      if (!ready) return <Spinner />;
      if (!user) return <LoginRequired next="/checkout" desc="주문하려면 로그인해 주세요." />;
      if (items.length === 0) {
        return <EmptyState icon="🛍️" title="주문할 상품이 없습니다" action={<Button size="lg" to="/shop">상품 보러 가기</Button>} />;

      const lines = order ? order.items : items;
      return (
        <div className="mx-auto max-w-6xl px-4 pt-10 sm:px-6">
          <h1 className="text-3xl font-black tracking-tight">주문 · 결제</h1>
          <p className="mt-1 text-sm text-stone-500">{user.name}님 · {user.email}</p>

          <div className="mt-6 grid gap-6 lg:grid-cols-[1fr_340px]">
            <div>

              <Card className="overflow-hidden p-2">
                <div id="toss-payment-method" />
                <div id="toss-agreement" />
                {!widgets && !error && <Spinner label="결제 수단을 불러오는 중…" />}

              <p className="mt-3 px-1 text-xs leading-relaxed text-stone-400">
                테스트 결제입니다. 실제로 돈이 나가지 않아요. 퀵계좌이체는 테스트 비밀번호 000000 으로 끝까지 진행할 수 있어요.
              </p>
            </div>

            <Card className="h-fit p-6 lg:sticky lg:top-24">
              <h2 className="font-bold">주문 상품</h2>
              <ul className="mt-4 space-y-3 text-sm">
                {lines.map((it, idx) => (
                  <li key={idx} className="flex items-center gap-3">
                    <img src={ik(it.image, 120)} alt="" className="h-12 w-12 shrink-0 rounded-lg bg-stone-200 object-cover" />
                    <div className="min-w-0 flex-1">
                      <p className="truncate font-medium">{it.name}</p>
                      <p className="text-xs text-stone-500">{it.colorName} · {it.size}mm · {it.qty}켤레</p>
                    </div>
                    <span className="shrink-0">{won(it.price * it.qty)}</span>
                  </li>
                ))}
              </ul>

              {order && (
                <dl className="mt-4 space-y-2.5 border-t border-stone-200 pt-4 text-sm">
                  <div className="flex justify-between"><dt className="text-stone-500">상품 금액</dt><dd>{won(order.subtotal)}</dd></div>
                  <div className="flex justify-between">
                    <dt className="text-stone-500">배송비</dt>
                    <dd>{order.shipping === 0 ? <span className="font-semibold text-emerald-600">무료</span> : won(order.shipping)}</dd>
                  </div>

              <div className="mt-4 flex items-baseline justify-between border-t border-stone-200 pt-4">

                <span className="text-2xl font-black">{order ? won(order.amount) : '—'}</span>

              {order && <p className="mt-2 break-all text-xs text-stone-400">주문번호 {order.orderId}</p>}

    // ========================================
    // 📄 Page: 로그인 · 회원가입

    function AuthPage({ mode }) {
      const isSignup = mode === 'signup';
      const { login, signup, user } = useAuth();
      const { navigate } = useRouter();
      const query = useQuery();
      const next = query.get('next') || '/mypage';

      const [form, setForm] = useState({ email: '', password: '', confirm: '', name: '' });
      const [errors, setErrors] = useState({});
      const [error, setError] = useState('');
      const [busy, setBusy] = useState(false);

      // 이미 로그인한 사람이 주소로 들어오면 돌려보낸다
      useEffect(() => { if (user) navigate(next); }, [user]);

      const set = (key) => (e) => { setForm((f) => ({ ...f, [key]: e.target.value })); setErrors((er) => ({ ...er, [key]: '' })); };

      function validate() {
        const er = {};
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(form.email.trim())) er.email = '이메일 형식을 확인해주세요.';
        if (isSignup && form.password.length < 8) er.password = '비밀번호는 8자 이상이어야 합니다.';
        if (!isSignup && !form.password) er.password = '비밀번호를 입력해주세요.';
        if (isSignup && form.password !== form.confirm) er.confirm = '비밀번호가 서로 달라요.';
        setErrors(er);
        return Object.keys(er).length === 0;
      }

      async function handleSubmit(e) {
        e.preventDefault();
        setError('');
        if (!validate()) return;
        setBusy(true);
        try {
          if (isSignup) await signup(form.email, form.password, form.name);
          else await login(form.email, form.password);
          navigate(next);
        } catch (err) {
          setError(err.message || '잠시 후 다시 시도해주세요.');
          setBusy(false);
        }
      }

      return (
        <div className="mx-auto max-w-md px-4 pt-14 sm:px-6">
          <p className="text-center text-xs font-bold tracking-[0.3em] text-stone-400">NALSSI MEMBERS</p>
          <h1 className="mt-2 text-center text-3xl font-black tracking-tight">{isSignup ? '회원가입' : '로그인'}</h1>
          <p className="mt-2 text-center text-sm text-stone-500">
            {isSignup ? '이메일과 비밀번호만 있으면 됩니다.' : '주문 · 결제 내역은 로그인 후 확인할 수 있어요.'}
          </p>

          <Card className="mt-8 p-6">
            <form onSubmit={handleSubmit} className="space-y-4" noValidate>
              {isSignup && (
                <Input label="이름 (선택)" value={form.name} onChange={set('name')} placeholder="날씨" autoComplete="name" maxLength={20} />
              )}
              <Input label="이메일" type="email" value={form.email} onChange={set('email')} error={errors.email}
                     placeholder="you@example.com" autoComplete="email" required />
              <Input label="비밀번호" type="password" value={form.password} onChange={set('password')} error={errors.password}
                     placeholder={isSignup ? '8자 이상' : '••••••••'} autoComplete={isSignup ? 'new-password' : 'current-password'} required />
              {isSignup && (
                <Input label="비밀번호 확인" type="password" value={form.confirm} onChange={set('confirm')} error={errors.confirm}
                       placeholder="한 번 더 입력" autoComplete="new-password" required />
              )}

              {error && <Alert>{error}</Alert>}

              <Button type="submit" size="lg" className="w-full" disabled={busy}>
                {busy ? '처리 중…' : isSignup ? '가입하고 시작하기' : '로그인'}
              </Button>
            </form>
          </Card>

          <p className="mt-5 text-center text-sm text-stone-500">
            {isSignup ? '이미 계정이 있으신가요? ' : '아직 계정이 없으신가요? '}
            <Link to={`${isSignup ? '/login' : '/signup'}?next=${encodeURIComponent(next)}`} className="font-semibold text-ink underline underline-offset-4">
              {isSignup ? '로그인' : '회원가입'}
            </Link>
          </p>
        </div>
      );
    }

    // ========================================
    // 📄 Page: 관리자 (상품 · 회원 · 주문)
    // ========================================
    // 화면에서 막는 건 안내용이다. 진짜 문지기는 서버의 /api/admin (로그인 안 함 401 · 관리자가 아니면 403).

    const ADMIN_TABS = [
      { id: 'products', name: '상품', to: '/admin/products' },
      { id: 'users',    name: '회원', to: '/admin/users' },
      { id: 'orders',   name: '주문', to: '/admin/orders' },
    ];
    const MAX_UPLOAD_MB = 5;
    const isHttpsUrl = (v) => { try { return new URL(v).protocol === 'https:'; } catch { return false; } };

    // 목록 화면의 필터 · 검색어를 주소(?status=PAID&q=…)에 담는다 → 새로고침 · 뒤로 가기 · 링크 공유가 그대로 된다
    function useQueryNav(base) {
      const query = useQuery();
      const { navigate } = useRouter();
      const go = (patch) => {
        const next = new URLSearchParams({ ...Object.fromEntries(query), ...patch });
        for (const [k, v] of [...next]) if (!v) next.delete(k);
        const s = next.toString();
        navigate(`${base}${s ? `?${s}` : ''}`);
      };
      return [query, go];
    }

    // 관리자 화면 공통 틀: 로그인 · 권한 확인 → 머리 · 탭.
    // children 은 관리자일 때만 그린다 → 관리자 API 도 그때만 부른다
    function AdminShell({ tab, children }) {
      const { user, ready } = useAuth();
      const { path } = useRouter();

      if (!ready) return <Spinner />;
      if (!user) return <LoginRequired next={path} desc="관리자 계정으로 로그인해 주세요." />;

    // ── 상품 수정 (썸네일 · 설명) ──────────────

    function AdminProductEditPage() {

    // 서버 상품 → 폼 값 (컬러별 이미지는 variantId → 주소)
    const toProductForm = (p) => ({
      tagline: p.tagline,
      description: p.description,
      images: Object.fromEntries(p.variants.map((v) => [v.id, v.image])),
    });

    // 썸네일 업로드: 서버에서 1회용 서명을 받아 브라우저가 ImageKit 에 직접 올린다.
    // 서명을 만드는 비공개 키는 서버에만 있고, 여기서는 서버가 계산해 준 서명만 쓴다.
    async function uploadImage(file, baseName) {
      const { data: auth } = await api('/admin/upload-auth');
      const ext = (file.name.match(/\.[a-z0-9]+$/i)?.[0] || '').toLowerCase();
      const body = new FormData();
      body.append('file', file);
      body.append('fileName', `${baseName}${ext}`);
      body.append('folder', auth.folder);
      body.append('useUniqueFileName', 'true'); // 같은 이름이 있으면 ImageKit 이 뒤에 무작위 글자를 붙인다
      body.append('publicKey', auth.publicKey);
      body.append('signature', auth.signature);
      body.append('expire', String(auth.expire));
      body.append('token', auth.token);
      const res = await fetch(auth.uploadUrl, { method: 'POST', body });
      const json = await res.json().catch(() => ({}));
      if (!res.ok || !json.url) throw new Error(json.message || '이미지를 올리지 못했습니다.');
      return json.url;
    }

    // 컬러 하나의 썸네일 칸: 미리보기 · 파일 올리기 · 주소 직접 입력
    function VariantImageField({ variant, isMain, value, original, onChange }) {
      const [uploading, setUploading] = useState(false);
      const [error, setError] = useState('');
      const [brokenUrl, setBrokenUrl] = useState('');
      const fileRef = useRef(null);
      const changed = value !== original;
      const valid = isHttpsUrl(value);

      async function handleFile(e) {
        const file = e.target.files[0];
        e.target.value = ''; // 같은 파일을 다시 골라도 onChange 가 오도록 비운다
        if (!file) return;
        if (!file.type.startsWith('image/')) return setError('이미지 파일만 올릴 수 있어요.');
        if (file.size > MAX_UPLOAD_MB * 1024 * 1024) return setError(`${MAX_UPLOAD_MB}MB 이하 이미지만 올릴 수 있어요.`);
        setError('');
        setUploading(true);
        try {
          onChange(await uploadImage(file, variant.id));
        } catch (err) {
          setError(err.message || '이미지를 올리지 못했습니다.');
        } finally {
          setUploading(false);
        }
      }

      return (
        <Card className="overflow-hidden">
          <div className="relative aspect-square bg-stone-200">
            {valid && (
              <img key={value} src={ik(value, 700)} alt={`${variant.colorName} 썸네일`} onError={() => setBrokenUrl(value)}
                   className="h-full w-full object-cover fade-in" />
            )}
            {valid && brokenUrl === value && (
              <p className="absolute inset-x-4 bottom-4 rounded-xl bg-white/90 px-3 py-2 text-xs text-red-700">이미지를 불러오지 못했어요. 주소를 확인해 주세요.</p>
            )}
            <div className="absolute left-3 top-3 flex flex-wrap gap-1.5">
              {isMain && <Badge tone="dark">대표 썸네일</Badge>}
              {changed && <Badge tone="soft">바뀜 · 저장 전</Badge>}
            </div>
            {uploading && (
              <div className="absolute inset-0 flex items-center justify-center gap-2 bg-white/75 text-sm font-medium text-stone-600" role="status">
                <span className="h-5 w-5 animate-spin rounded-full border-2 border-stone-300 border-t-ink" aria-hidden="true" /> 올리는 중…
              </div>
            )}
          </div>
          <div className="space-y-3 p-4">
            <p className="flex items-center gap-2 text-sm font-bold">
              <span className="h-4 w-4 rounded-full ring-1 ring-black/15" style={{ backgroundColor: variant.colorHex }} aria-hidden="true" />
              {variant.colorName}
              <span className="font-normal text-stone-400">· {variant.id}</span>
            </p>
            <input ref={fileRef} type="file" accept="image/*" className="hidden" onChange={handleFile} />
            <div className="flex flex-wrap gap-2">
              <Button size="sm" onClick={() => fileRef.current.click()} disabled={uploading}>이미지 올리기</Button>
              {changed && (
                <Button size="sm" variant="ghost" onClick={() => { setError(''); onChange(original); }} disabled={uploading}>되돌리기</Button>
              )}
            </div>
            <Input id={`admin-image-${variant.id}`} label="이미지 주소" value={value} onChange={(e) => onChange(e.target.value)}
                   placeholder="https://…" disabled={uploading}
                   error={value && !valid ? 'https:// 로 시작하는 주소를 넣어 주세요.' : ''} />
            {error && <Alert>{error}</Alert>}
          </div>
        </Card>
      );
    }

    function AdminProductForm() {
      const { id } = useParams();
      const { navigate } = useRouter();
      const { data: product, loading, error } = useApi(`/products/${encodeURIComponent(id)}`);
      const [saved, setSaved] = useState(null); // 서버에 저장된 값
      const [form, setForm] = useState(null);   // 지금 고치고 있는 값
      const [busy, setBusy] = useState(false);
      const [formError, setFormError] = useState('');
      const [toast, setToast] = useState('');
      const closeToast = useCallback(() => setToast(''), []);

      useEffect(() => {
        if (!product) return;
        const initial = toProductForm(product);
        setSaved(initial);
        setForm(initial);
      }, [product]);

      if (loading && !product) return <Spinner />;
      if (error || !product) {
        return <EmptyState icon="👟" title={error || '상품을 찾을 수 없습니다'} action={<Button to="/admin/products">상품 목록으로</Button>} />;
      }
      if (!form) return <Spinner />;

      const changedImages = product.variants.filter((v) => form.images[v.id] !== saved.images[v.id]);
      const dirty = form.tagline !== saved.tagline || form.description !== saved.description || changedImages.length > 0;
      const set = (key) => (e) => { setForm((f) => ({ ...f, [key]: e.target.value })); setFormError(''); };
      const setImage = (variantId) => (url) => { setForm((f) => ({ ...f, images: { ...f.images, [variantId]: url } })); setFormError(''); };

      // 미리보기: 스토어의 상품 카드에 지금 고친 값을 넣어 그대로 그린다
      const preview = { ...product, tagline: form.tagline, variants: product.variants.map((v) => ({ ...v, image: form.images[v.id] })) };

      async function save() {
        const tagline = form.tagline.trim();
        const description = form.description.trim();
        if (!tagline || !description) return setFormError('한 줄 소개와 상세 설명은 비워 둘 수 없어요.');
        if (changedImages.some((v) => !isHttpsUrl(form.images[v.id].trim()))) return setFormError('이미지 주소는 https:// 로 시작해야 해요.');

        // 바뀐 칸만 보낸다
        const body = {};
        if (tagline !== saved.tagline) body.tagline = tagline;
        if (description !== saved.description) body.description = description;
        if (changedImages.length > 0) body.images = changedImages.map((v) => ({ variantId: v.id, image: form.images[v.id].trim() }));
        if (Object.keys(body).length === 0) return setForm(saved); // 앞뒤 공백만 바뀐 경우

        setBusy(true);
        setFormError('');
        try {
          const { data } = await api(`/admin/products/${encodeURIComponent(product.id)}`, { method: 'PATCH', body });
          const next = toProductForm(data);
          setSaved(next);
          setForm(next);
          setToast('저장했어요. 스토어에 바로 반영됩니다.');
        } catch (err) {
          setFormError(err.message || '저장하지 못했습니다.');
        } finally {
          setBusy(false);
        }
      }

      return (
        <div>
          <div className="flex flex-wrap items-end justify-between gap-3">
            <div className="min-w-0">
              <Link to="/admin/products" className="text-sm text-stone-500 hover:text-ink">← 상품 목록</Link>
              <h2 className="mt-2 text-2xl font-black tracking-tight">{product.name}</h2>
              <p className="mt-1 text-sm text-stone-500">
                {product.categoryName} · {won(product.price)} · 재고 {product.totalStock}켤레 · 리뷰 {product.reviewCount}개
              </p>
            </div>
            <Button variant="secondary" size="sm" to={`/product/${product.id}`}>스토어에서 보기</Button>
          </div>

          <div className="mt-6 grid gap-6 lg:grid-cols-[1fr_300px]">
            <div className="space-y-10">
              <section aria-labelledby="admin-thumbs">
                <h3 id="admin-thumbs" className="text-lg font-black">썸네일</h3>
                <p className="mt-1 text-sm text-stone-500">
                  컬러마다 사진이 한 장씩 있어요. 첫 번째 컬러 사진이 상품 목록의 대표 썸네일이에요. ({MAX_UPLOAD_MB}MB 이하 이미지)
                </p>
                <div className="mt-4 grid gap-4 sm:grid-cols-2">
                  {product.variants.map((v, i) => (
                    <VariantImageField key={v.id} variant={v} isMain={i === 0}
                      value={form.images[v.id]} original={saved.images[v.id]} onChange={setImage(v.id)} />
                  ))}
                </div>
              </section>

              <section aria-labelledby="admin-desc">
                <h3 id="admin-desc" className="text-lg font-black">상품 설명</h3>
                <Card className="mt-4 space-y-5 p-5">
                  <Input id="admin-tagline" label="한 줄 소개" value={form.tagline} onChange={set('tagline')} maxLength={60}
                         hint={`${form.tagline.length}/60 · 상품 목록 카드와 상세 페이지 제목 아래에 보여요`} />
                  <Textarea id="admin-description" label="상세 설명" value={form.description} onChange={set('description')} maxLength={1000} rows={6}
                            hint={`${form.description.length}/1000 · 상품 상세의 「이 신발에 대해」에 보여요`} />
                </Card>
              </section>
            </div>

            <aside className="space-y-4 lg:sticky lg:top-24 lg:self-start">
              <Card className="p-5">
                {formError && <div className="mb-4"><Alert>{formError}</Alert></div>}
                <Button size="lg" className="w-full" onClick={save} disabled={!dirty || busy}>
                  {busy ? '저장 중…' : dirty ? '변경 사항 저장' : '바뀐 내용 없음'}
                </Button>
                <Button variant="ghost" className="mt-2 w-full" onClick={() => { setForm(saved); setFormError(''); }} disabled={!dirty || busy}>
                  모두 되돌리기
                </Button>
              </Card>
              <Card className="p-5">
                <p className="text-xs font-bold tracking-[0.2em] text-stone-400">미리보기 · 상품 목록 카드</p>
                {/* 미리보기 안의 링크를 눌러도 저장 전 화면을 떠나지 않게 막는다 (컬러 버튼은 그대로 동작) */}
                <div className="mt-4" onClickCapture={(e) => { if (e.target.closest('a')) e.preventDefault(); }}>
                  <ProductCard product={preview} />
                </div>
              </Card>
            </aside>
          </div>

          <Toast message={toast} onClose={closeToast}
                 action={<button className="shrink-0 font-semibold underline underline-offset-4" onClick={() => navigate(`/product/${product.id}`)}>스토어에서 보기</button>} />
        </div>
      );
    }
