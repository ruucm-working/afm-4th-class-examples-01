    function Button({ variant = 'primary', size = 'md', className = '', children, ...props }) {

    function Modal({ isOpen, onClose, title, size = 'md', children }) {

        document.body.style.overflow = 'hidden';
        return () => { document.removeEventListener('keydown', onKey); document.body.style.overflow = ''; };
      }, [isOpen, onClose]);

      if (!isOpen) return null;
      const sizes = { sm: 'max-w-sm', md: 'max-w-md', lg: 'max-w-2xl' };
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4">

    // ========================================
    // 🔀 Router (hash-based)
    // ========================================

    const RouterContext = createContext(null);
    const useRouter = () => useContext(RouterContext);
    const useParams = () => useContext(RouterContext).params;

    function matchRoute(pattern, path) {
      const p = pattern.split('/').filter(Boolean);
      const c = path.split('/').filter(Boolean);
      if (p.length !== c.length) return null;
      const params = {};
      for (let i = 0; i < p.length; i++) {
        if (p[i].startsWith(':')) params[p[i].slice(1)] = decodeURIComponent(c[i]);
        else if (p[i] !== c[i]) return null;
      }
      return params;
    }

    function Router({ children }) {
      const read = () => window.location.hash.replace(/^#/, '') || '/';
      const [path, setPath] = useState(read);
      const [params, setParams] = useState({});

      useEffect(() => {
        const onHash = () => { setPath(read()); window.scrollTo({ top: 0 }); };
        window.addEventListener('hashchange', onHash);
        return () => window.removeEventListener('hashchange', onHash);
      }, []);

      const navigate = useCallback((to) => { window.location.hash = to; }, []);

      return (
        <RouterContext.Provider value={{ path, params, setParams, navigate }}>
          {children}
        </RouterContext.Provider>
      );
    }

    function Routes({ children, fallback }) {
      const { path, setParams } = useRouter();
      const routes = React.Children.toArray(children);
      const pathname = path.split('?')[0];   // 쿼리스트링(?c=sofa)은 매칭에서 제외
      let matched = null, matchedParams = null;

      for (const route of routes) {
        const params = matchRoute(route.props.path, pathname);
        if (params) { matched = route; matchedParams = params; break; }
      }

      useEffect(() => { setParams(matchedParams || {}); }, [path]);

      if (!matched) return fallback || null;
      return <div key={path} className="fade-up">{matched.props.element}</div>;
    }

    function Route() { return null; }

    function Link({ to, className = '', children, ...props }) {
      return <a href={`#${to}`} className={className} {...props}>{children}</a>;

    // ========================================
    // 🛒 Cart Store (Context + useReducer)
    // ========================================

    const CartContext = createContext(null);
    const useCart = () => useContext(CartContext);
    const CART_KEY = 'moom-cart-v1';

    function cartReducer(state, action) {
      switch (action.type) {
        case 'add': {
          const key = action.item.id + '::' + action.item.color;
          const found = state.find((i) => i.key === key);
          if (found) {
            return state.map((i) => i.key === key ? { ...i, qty: Math.min(i.qty + action.item.qty, 99) } : i);
          }
          return [...state, { ...action.item, key }];
        }
        case 'qty':
          return state.map((i) => i.key === action.key ? { ...i, qty: Math.max(1, Math.min(99, action.qty)) } : i);
        case 'remove':
          return state.filter((i) => i.key !== action.key);
        case 'clear':
          return [];
        default:
          return state;
      }
    }

    function CartProvider({ children }) {
      const [items, dispatch] = useReducer(cartReducer, null, () => {
        try { return JSON.parse(localStorage.getItem(CART_KEY)) || []; } catch { return []; }
      });

      useEffect(() => {
        try { localStorage.setItem(CART_KEY, JSON.stringify(items)); } catch {}
      }, [items]);

      const count = items.reduce((s, i) => s + i.qty, 0);
      const subtotal = items.reduce((s, i) => s + i.price * i.qty, 0);
      const shipping = items.length === 0 || subtotal >= FREE_SHIPPING_OVER ? 0 : SHIPPING_FEE;

      return (
        <CartContext.Provider value={{ items, dispatch, count, subtotal, shipping, total: subtotal + shipping }}>
          {children}
        </CartContext.Provider>
      );
    }

    // ========================================
    // 🔑 API 호출 + 로그인 상태 (JWT)
    // ========================================

    const TOKEN_KEY = 'moom-token-v1';
    const getToken = () => { try { return localStorage.getItem(TOKEN_KEY) || ''; } catch { return ''; } };

    // 모든 서버 호출은 이 함수를 거친다. 토큰을 Authorization 헤더에 자동으로 붙이고,
    // { success:false } 응답은 예외로 바꿔서 화면에서 try/catch 로 받게 한다.
    async function api(path, { method = 'GET', body, auth = true } = {}) {
      const headers = {};
      if (body !== undefined) headers['Content-Type'] = 'application/json';
      const token = auth ? getToken() : '';
      if (token) headers.Authorization = `Bearer ${token}`;

      const res = await fetch(`/api${path}`, {
        method, headers,
        body: body === undefined ? undefined : JSON.stringify(body),
      });
      const json = await res.json().catch(() => ({ success: false, message: '서버 응답을 읽지 못했습니다.' }));
      if (!res.ok || !json.success) {
        throw Object.assign(new Error(json.message || '요청에 실패했습니다.'), { status: res.status });
      }
      return json;
    }

    const AuthContext = createContext(null);
    const useAuth = () => useContext(AuthContext);

    function AuthProvider({ children }) {
      const [user, setUser] = useState(null);
      const [ready, setReady] = useState(false);

      // 새로고침해도 로그인이 유지되도록, 저장된 토큰으로 내 정보를 다시 물어본다
      useEffect(() => {
        if (!getToken()) { setReady(true); return; }
        api('/auth/me')
          .then((r) => setUser(r.data.user))
          .catch(() => { try { localStorage.removeItem(TOKEN_KEY); } catch {} })
          .finally(() => setReady(true));
      }, []);

      const save = (data) => {
        try { localStorage.setItem(TOKEN_KEY, data.token); } catch {}
        setUser(data.user);
      };

      const login = async (email, password) => {
        const r = await api('/auth/login', { method: 'POST', body: { email, password }, auth: false });
        save(r.data);
      };
      const signup = async (email, password, name) => {
        const r = await api('/auth/signup', { method: 'POST', body: { email, password, name }, auth: false });
        save(r.data);
      };
      const logout = () => {
        try { localStorage.removeItem(TOKEN_KEY); } catch {}
        setUser(null);
      };

      return (
        <AuthContext.Provider value={{ user, ready, login, signup, logout }}>
          {children}
        </AuthContext.Provider>
      );
    }

    // 해시 주소의 쿼리스트링(#/cart?failed=1) 을 읽는다

      return (
        <header className="sticky top-0 z-40 border-b border-stone-200/80 bg-[#faf9f7]/90 backdrop-blur">

    function ProductListPage() {
      const { path } = useRouter();
      const initialCategory = useMemo(() => {
        const q = path.split('?')[1] || '';
        return new URLSearchParams(q).get('c') || 'all';
      }, [path]);

      const [category, setCategory] = useState(initialCategory);
      const [keyword, setKeyword] = useState('');
      const [sort, setSort] = useState('recommend');

      useEffect(() => { setCategory(initialCategory); }, [initialCategory]);

      const list = useMemo(() => {
        let result = PRODUCTS.filter((p) => category === 'all' || p.category === category);
        const k = keyword.trim().toLowerCase();
        if (k) {
          result = result.filter((p) =>
            p.name.toLowerCase().includes(k) || p.brand.toLowerCase().includes(k) || p.summary.toLowerCase().includes(k));
        }
        const sorters = {
          recommend: (a, b) => b.rating - a.rating,
          low:       (a, b) => a.price - b.price,
          high:      (a, b) => b.price - a.price,
          review:    (a, b) => b.reviews - a.reviews,
        };
        return [...result].sort(sorters[sort]);
      }, [category, keyword, sort]);

      return (
        <div className="mx-auto max-w-6xl px-4 pt-10 sm:px-6">
          <h1 className="text-2xl font-semibold">
            {CATEGORIES.find((c) => c.id === category)?.name ?? '전체'} 가구
          </h1>
          <p className="mt-1 text-sm text-stone-500">총 {list.length}개의 상품</p>

          <div className="mt-6 flex flex-wrap items-end gap-3">
            <div className="no-scrollbar flex flex-1 gap-2 overflow-x-auto">
              {CATEGORIES.map((c) => (
                <button key={c.id} onClick={() => setCategory(c.id)}
                        aria-pressed={category === c.id}
                        className={`shrink-0 rounded-full px-4 py-2 text-sm transition-colors
                          ${category === c.id ? 'bg-stone-900 text-white' : 'bg-white text-stone-600 ring-1 ring-stone-200 hover:bg-stone-100'}`}>
                  {c.name}
                </button>
              ))}
            </div>
          </div>

          <div className="mt-4 flex flex-col gap-3 sm:flex-row">
            <Input className="flex-1" placeholder="상품명으로 검색 (예: 소파, 오크)"
                   value={keyword} onChange={(e) => setKeyword(e.target.value)} aria-label="상품 검색" />
            <Select className="sm:w-44" value={sort} onChange={(e) => setSort(e.target.value)} aria-label="정렬">
              <option value="recommend">추천순</option>
              <option value="low">낮은 가격순</option>
              <option value="high">높은 가격순</option>
              <option value="review">리뷰 많은순</option>
            </Select>
          </div>

          {list.length === 0 ? (
            <Card className="mt-10 p-12 text-center">
              <p className="text-3xl" aria-hidden="true">🔍</p>
              <p className="mt-3 font-medium">조건에 맞는 상품이 없습니다</p>
              <p className="mt-1 text-sm text-stone-500">검색어나 카테고리를 바꿔 보세요.</p>
              <Button className="mt-5" variant="secondary"
                      onClick={() => { setKeyword(''); setCategory('all'); }}>
                필터 초기화
              </Button>
            </Card>
          ) : (
            <div className="mt-8 grid grid-cols-2 gap-4 sm:grid-cols-3 lg:grid-cols-4">
              {list.map((p) => <ProductCard key={p.id} product={p} />)}
            </div>
          )}
        </div>
      );
    }

              <div className="mt-6">

        <div className="mx-auto max-w-5xl px-4 pt-10 sm:px-6">
          <div className="flex items-end justify-between">
            <h1 className="text-2xl font-semibold">장바구니 <span className="text-stone-400">({count})</span></h1>
            <Button variant="ghost" size="sm" onClick={() => dispatch({ type: 'clear' })}>전체 비우기</Button>
          </div>

          <div className="mt-6 grid gap-6 lg:grid-cols-[1fr_320px]">
            <div className="space-y-3">
              {items.map((item) => (
                <Card key={item.key} className="flex gap-4 p-4">
                  <Link to={`/product/${item.id}`} className="shrink-0">
                    <img src={item.image} alt={item.name} className="h-24 w-24 rounded-lg object-cover" />
                  </Link>
                  <div className="min-w-0 flex-1">
                    <div className="flex items-start justify-between gap-3">
                      <div className="min-w-0">
                        <Link to={`/product/${item.id}`} className="block truncate font-medium hover:underline">{item.name}</Link>
                        <p className="mt-0.5 text-sm text-stone-500">{item.color}</p>
                      </div>
                      <button onClick={() => dispatch({ type: 'remove', key: item.key })}
                              className="shrink-0 text-stone-400 hover:text-red-600" aria-label={`${item.name} 삭제`}>✕</button>
                    </div>
                    <div className="mt-3 flex items-center justify-between">
                      <div className="flex items-center rounded-full ring-1 ring-stone-300">
                        <button onClick={() => dispatch({ type: 'qty', key: item.key, qty: item.qty - 1 })}
                                className="px-3 py-1.5 text-stone-500 hover:text-stone-900" aria-label="수량 감소">−</button>
                        <span className="w-8 text-center text-sm">{item.qty}</span>
                        <button onClick={() => dispatch({ type: 'qty', key: item.key, qty: item.qty + 1 })}
                                className="px-3 py-1.5 text-stone-500 hover:text-stone-900" aria-label="수량 증가">+</button>
                      </div>
                      <span className="font-semibold">{won(item.price * item.qty)}</span>
                    </div>
                  </div>
                </Card>
              ))}
            </div>

            <Card className="h-fit p-6 lg:sticky lg:top-24">
              <h2 className="font-semibold">결제 정보</h2>
              <dl className="mt-4 space-y-2.5 text-sm">
                <div className="flex justify-between"><dt className="text-stone-500">상품 금액</dt><dd>{won(subtotal)}</dd></div>
                <div className="flex justify-between">
                  <dt className="text-stone-500">배송비</dt>
                  <dd>{shipping === 0 ? <span className="text-emerald-600">무료</span> : won(shipping)}</dd>
                </div>
              </dl>
              {shipping > 0 && (
                <p className="mt-3 rounded-lg bg-amber-50 px-3 py-2 text-xs text-amber-800">
                  {won(FREE_SHIPPING_OVER - subtotal)} 더 담으면 배송비가 무료예요.
                </p>
              )}
              <div className="mt-4 flex items-baseline justify-between border-t border-stone-200 pt-4">
                <span className="text-sm text-stone-600">총 결제금액</span>
                <span className="text-xl font-semibold">{won(total)}</span>
              </div>
              {error && (
                <p role="alert" className="mt-4 rounded-lg bg-red-50 px-3 py-2 text-xs leading-relaxed text-red-700">{error}</p>
              )}

              <Button size="lg" className="mt-5 w-full" onClick={goCheckout}>
                {user ? '주문하기' : '로그인하고 주문하기'}
              </Button>
              {!user && (
                <p className="mt-2 text-center text-xs text-stone-500">주문 내역을 남기려면 로그인이 필요해요.</p>
              )}
              <Link to="/products">
                <Button size="md" variant="ghost" className="mt-2 w-full">계속 쇼핑하기</Button>
              </Link>
            </Card>
          </div>
        </div>
      );
    }

    // ========================================
    // 📄 Page: 결제 (토스페이먼츠 결제위젯)
    // ========================================

    // 결제는 3단계다.
    //  ① 서버에 주문서를 만든다 → 서버가 가격을 계산해 orderId 와 금액을 돌려준다
    //  ② 그 금액으로 토스 결제위젯을 그린다 (카드번호는 토스만 본다. 우리 서버는 모른다)
    //  ③ 결제가 끝나면 토스가 /api/payments/success 로 되돌려 보내고, 서버가 최종 승인한다
    function CheckoutPage() {
      const { items } = useCart();
      const { user, ready } = useAuth();
      const { navigate } = useRouter();
      const [order, setOrder] = useState(null);
      const [widgets, setWidgets] = useState(null);
      const [error, setError] = useState('');
      const [paying, setPaying] = useState(false);
      const startedRef = useRef(false); // 주문서가 두 번 만들어지지 않도록

      useEffect(() => {
        if (!ready || !user || items.length === 0 || startedRef.current) return;
        startedRef.current = true;

        (async () => {
          try {
            const { data: config } = await api('/config', { auth: false });
            if (!config.paymentEnabled) throw new Error('서버에 토스 키가 설정되어 있지 않습니다. .env 를 확인해주세요.');

            const { data: created } = await api('/orders', {
              method: 'POST',
              body: { items: items.map((i) => ({ id: i.id, color: i.color, qty: i.qty })) },
            });
            setOrder(created);

            const w = TossPayments(config.tossClientKey).widgets({ customerKey: created.customerKey });
            await w.setAmount({ currency: 'KRW', value: created.amount });
            await Promise.all([
              w.renderPaymentMethods({ selector: '#toss-payment-method', variantKey: 'DEFAULT' }),
              w.renderAgreement({ selector: '#toss-agreement', variantKey: 'AGREEMENT' }),
            ]);
            setWidgets(w);
          } catch (err) {
            setError(err.message || '결제 준비에 실패했습니다.');
          }
        })();
      }, [ready, user, items.length]);

      async function handlePay() {
        if (!widgets || !order) return;
        setPaying(true);
        setError('');
        try {
          await widgets.requestPayment({
            orderId: order.orderId,
            orderName: order.orderName,
            successUrl: `${window.location.origin}/api/payments/success`,
            failUrl: `${window.location.origin}/api/payments/fail`,
            customerEmail: order.customerEmail,
            customerName: order.customerName,
          });
        } catch (err) {
          setError(err.message || '결제를 시작하지 못했습니다.');
          setPaying(false);
        }
      }

      if (!ready) return <p className="py-24 text-center text-sm text-stone-400">불러오는 중…</p>;
      if (!user) return <LoginRequired next="/checkout" />;

      if (items.length === 0) {
        return (
          <div className="mx-auto max-w-2xl px-4 py-24 text-center">
            <p className="text-4xl" aria-hidden="true">🛒</p>
            <h1 className="mt-4 text-xl font-semibold">주문할 상품이 없습니다</h1>
            <Link to="/products"><Button className="mt-6" size="lg">상품 보러 가기</Button></Link>
          </div>
        );
      }

      return (
        <div className="mx-auto max-w-5xl px-4 pt-10 sm:px-6">
          <h1 className="text-2xl font-semibold">주문 · 결제</h1>
          <p className="mt-1 text-sm text-stone-500">{user.name}님 · {user.email}</p>

          <div className="mt-6 grid gap-6 lg:grid-cols-[1fr_320px]">
            <div>
              {/* 토스 결제위젯이 이 두 칸을 채운다 */}
              <Card className="overflow-hidden p-2">
                <div id="toss-payment-method" />
                <div id="toss-agreement" />
              </Card>
              {!widgets && !error && (
                <p className="py-10 text-center text-sm text-stone-400">결제 수단을 불러오는 중…</p>
              )}
            </div>

            <Card className="h-fit p-6 lg:sticky lg:top-24">
              <h2 className="font-semibold">주문 내역</h2>
              <ul className="mt-4 space-y-2 text-sm">
                {(order ? order.items : items).map((it, idx) => (
                  <li key={idx} className="flex justify-between gap-3">
                    <span className="min-w-0 truncate text-stone-600">{it.name} × {it.qty}</span>
                    <span className="shrink-0">{won(it.price * it.qty)}</span>
                  </li>
                ))}
              </ul>

              {order && (
                <dl className="mt-4 space-y-2.5 border-t border-stone-200 pt-4 text-sm">
                  <div className="flex justify-between"><dt className="text-stone-500">상품 금액</dt><dd>{won(order.subtotal)}</dd></div>
                  <div className="flex justify-between">
                    <dt className="text-stone-500">배송비</dt>
                    <dd>{order.shipping === 0 ? <span className="text-emerald-600">무료</span> : won(order.shipping)}</dd>
                  </div>
                </dl>
              )}

              <div className="mt-4 flex items-baseline justify-between border-t border-stone-200 pt-4">
                <span className="text-sm text-stone-600">총 결제금액</span>
                <span className="text-xl font-semibold">{order ? won(order.amount) : '—'}</span>
              </div>
              {order && <p className="mt-2 text-xs text-stone-400">주문번호 {order.orderId}</p>}

              {error && (
                <p role="alert" className="mt-4 rounded-lg bg-red-50 px-3 py-2 text-xs leading-relaxed text-red-700">{error}</p>
              )}

              <Button size="lg" className="mt-5 w-full" onClick={handlePay} disabled={!widgets || paying}>
                {paying ? '결제창을 여는 중…' : order ? `${won(order.amount)} 결제하기` : '준비 중…'}
              </Button>
              <Button size="md" variant="ghost" className="mt-2 w-full" onClick={() => navigate('/cart')}>
                장바구니로 돌아가기
              </Button>
            </Card>
          </div>
        </div>
      );
    }

    // ========================================
    // 📄 Page: 로그인 · 회원가입
    // ========================================

    function AuthPage({ mode }) {
      const isSignup = mode === 'signup';
      const { login, signup, user } = useAuth();
      const { navigate } = useRouter();
      const query = useQuery();
      const next = query.get('next') || '/mypage';

      const [form, setForm] = useState({ email: '', password: '', name: '' });
      const [error, setError] = useState('');
      const [busy, setBusy] = useState(false);

      // 이미 로그인한 사람이 주소로 들어오면 돌려보낸다
      useEffect(() => { if (user) navigate(next); }, [user]);

      const set = (key) => (e) => setForm((f) => ({ ...f, [key]: e.target.value }));

      async function handleSubmit(e) {
        e.preventDefault();
        setError('');
        if (isSignup && form.password.length < 8) return setError('비밀번호는 8자 이상이어야 합니다.');
        setBusy(true);
        try {
          if (isSignup) await signup(form.email, form.password, form.name);
          else await login(form.email, form.password);
          navigate(next);
        } catch (err) {
          setError(err.message || '잠시 후 다시 시도해주세요.');
          setBusy(false);
        }
      }

      return (
        <div className="mx-auto max-w-md px-4 pt-16 sm:px-6">
          <h1 className="text-center text-2xl font-semibold">{isSignup ? '회원가입' : '로그인'}</h1>
          <p className="mt-2 text-center text-sm text-stone-500">
            {isSignup ? '이메일과 비밀번호만 있으면 됩니다.' : 'MOOM 계정으로 주문 내역을 확인하세요.'}
          </p>

          <Card className="mt-8 p-6">
            <form onSubmit={handleSubmit} className="space-y-4">
              {isSignup && (
                <Input label="이름" value={form.name} onChange={set('name')}
                       placeholder="무움" autoComplete="name" maxLength={20} />
              )}
              <Input label="이메일" type="email" value={form.email} onChange={set('email')}
                     placeholder="you@example.com" autoComplete="email" required />
              <Input label="비밀번호" type="password" value={form.password} onChange={set('password')}
                     placeholder={isSignup ? '8자 이상' : '••••••••'}
                     autoComplete={isSignup ? 'new-password' : 'current-password'} required />

              {error && (
                <p role="alert" className="rounded-lg bg-red-50 px-3 py-2 text-sm text-red-700">{error}</p>
              )}

              <Button type="submit" size="lg" className="w-full" disabled={busy}>
                {busy ? '처리 중…' : isSignup ? '가입하고 시작하기' : '로그인'}
              </Button>
            </form>
          </Card>

          <p className="mt-5 text-center text-sm text-stone-500">
            {isSignup ? '이미 계정이 있으신가요? ' : '아직 계정이 없으신가요? '}
            <Link to={`${isSignup ? '/login' : '/signup'}?next=${encodeURIComponent(next)}`}
                  className="font-medium text-stone-900 underline underline-offset-4">
              {isSignup ? '로그인' : '회원가입'}
            </Link>
          </p>
        </div>
      );
    }

    // ========================================
    // 📄 Page: 마이페이지 (주문 · 결제 내역)
    // ========================================

    function OrderStatusBadge({ status }) {
      const s = ORDER_STATUS[status] || ORDER_STATUS.READY;
      return <Badge tone={s.tone}>{s.label}</Badge>;
    }

    function LoginRequired({ next }) {
      return (
        <div className="mx-auto max-w-2xl px-4 py-24 text-center">
          <p className="text-4xl" aria-hidden="true">🔒</p>
          <h1 className="mt-4 text-xl font-semibold">로그인이 필요합니다</h1>
          <p className="mt-2 text-sm text-stone-500">주문 내역은 본인만 볼 수 있어요.</p>
          <Link to={`/login?next=${encodeURIComponent(next)}`}><Button className="mt-6" size="lg">로그인하기</Button></Link>
        </div>
      );
    }

    function MyPage() {
      const { user, ready } = useAuth();
      const [state, setState] = useState({ loading: true, orders: [], summary: null, error: '' });

      useEffect(() => {
        if (!ready || !user) return;
        api('/orders')
          .then((r) => setState({ loading: false, orders: r.data, summary: r.summary, error: '' }))
          .catch((err) => setState({ loading: false, orders: [], summary: null, error: err.message }));
      }, [ready, user]);

      if (!ready) return <p className="py-24 text-center text-sm text-stone-400">불러오는 중…</p>;
      if (!user) return <LoginRequired next="/mypage" />;

      return (
        <div className="mx-auto max-w-4xl px-4 pt-10 sm:px-6">
          <h1 className="text-2xl font-semibold">마이페이지</h1>
          <p className="mt-1 text-sm text-stone-500">{user.name}님 · {user.email}</p>

          {state.summary && (
            <div className="mt-6 grid grid-cols-2 gap-3 sm:grid-cols-3">
              <Card className="p-5"><p className="text-xs text-stone-400">전체 주문</p><p className="mt-1 text-xl font-semibold">{state.summary.count}건</p></Card>
              <Card className="p-5"><p className="text-xs text-stone-400">결제 완료</p><p className="mt-1 text-xl font-semibold">{state.summary.paidCount}건</p></Card>
              <Card className="col-span-2 p-5 sm:col-span-1"><p className="text-xs text-stone-400">결제 금액 합계</p><p className="mt-1 text-xl font-semibold">{won(state.summary.paidTotal)}</p></Card>
            </div>
          )}

          <h2 className="mt-10 font-semibold">결제 내역</h2>

          {state.loading && <p className="py-10 text-center text-sm text-stone-400">불러오는 중…</p>}
          {state.error && <p role="alert" className="mt-4 rounded-lg bg-red-50 px-3 py-2 text-sm text-red-700">{state.error}</p>}

          {!state.loading && !state.error && state.orders.length === 0 && (
            <Card className="mt-4 p-10 text-center">
              <p className="text-sm text-stone-500">아직 주문 내역이 없습니다.</p>
              <Link to="/products"><Button className="mt-5">상품 보러 가기</Button></Link>
            </Card>
          )}

          <div className="mt-4 space-y-3">
            {state.orders.map((o) => (
              <Link key={o.orderId} to={`/orders/${o.orderId}`} className="block">
                <Card className="p-5 transition-shadow hover:shadow-md">
                  <div className="flex flex-wrap items-center justify-between gap-3">
                    <div className="min-w-0">
                      <div className="flex items-center gap-2">
                        <OrderStatusBadge status={o.status} />
                        <span className="text-xs text-stone-400">{o.createdAt.slice(0, 10)}</span>
                      </div>
                      <p className="mt-2 truncate font-medium">{o.orderName}</p>
                      <p className="mt-0.5 text-xs text-stone-400">주문번호 {o.orderId}</p>
                    </div>
                    <div className="text-right">
                      <p className="font-semibold">{won(o.amount)}</p>
                      {o.payment && <p className="mt-0.5 text-xs text-stone-400">{o.payment.method}</p>}
                    </div>
                  </div>
                  <div className="mt-4 flex gap-2 border-t border-stone-100 pt-4">
                    {o.items.slice(0, 4).map((it, idx) => (
                      <img key={idx} src={it.image} alt={it.name} className="h-12 w-12 rounded-lg object-cover" />
                    ))}
                    {o.items.length > 4 && <span className="self-center text-xs text-stone-400">+{o.items.length - 4}</span>}
                  </div>
                </Card>
              </Link>
            ))}
          </div>
        </div>
      );
    }

    // ========================================
    // 📄 Page: 주문 상세 (결제 직후 도착하는 화면)
    // ========================================

    function OrderDetailPage() {
      const { orderId } = useParams();
      const { user, ready } = useAuth();
      const { dispatch } = useCart();
      const query = useQuery();
      const justPaid = query.get('paid') === '1';
      const [state, setState] = useState({ loading: true, order: null, error: '' });

      useEffect(() => {
        if (!ready || !user || !orderId) return;
        api(`/orders/${orderId}`)
          .then((r) => {
            setState({ loading: false, order: r.data, error: '' });
            // 결제가 끝난 주문이면 장바구니를 비운다
            if (r.data.status === 'PAID' && justPaid) dispatch({ type: 'clear' });
          })
          .catch((err) => setState({ loading: false, order: null, error: err.message }));
      }, [ready, user, orderId]);

      if (!ready) return <p className="py-24 text-center text-sm text-stone-400">불러오는 중…</p>;
      if (!user) return <LoginRequired next={`/orders/${orderId}`} />;
      if (state.loading) return <p className="py-24 text-center text-sm text-stone-400">주문을 불러오는 중…</p>;

      if (state.error || !state.order) {
        return (
          <div className="mx-auto max-w-2xl px-4 py-24 text-center">
            <p className="text-4xl" aria-hidden="true">🧾</p>
            <h1 className="mt-4 text-xl font-semibold">{state.error || '주문을 찾을 수 없습니다'}</h1>
            <Link to="/mypage"><Button className="mt-6">마이페이지로</Button></Link>
          </div>
        );
      }

      const o = state.order;
      return (
        <div className="mx-auto max-w-3xl px-4 pt-10 sm:px-6">
          {o.status === 'PAID' && justPaid && (
            <Card className="mb-6 bg-emerald-50 p-6 text-center ring-emerald-600/10">
              <p className="text-3xl" aria-hidden="true">🎉</p>
              <h1 className="mt-2 text-xl font-semibold text-emerald-900">결제가 완료되었습니다</h1>
              <p className="mt-1 text-sm text-emerald-800">{won(o.amount)} 결제 · 영업일 기준 2–5일 내 설치 배송됩니다.</p>
            </Card>
          )}

          <div className="flex items-center gap-2">
            <OrderStatusBadge status={o.status} />
            <span className="text-xs text-stone-400">{o.createdAt.slice(0, 10)}</span>
          </div>
          <h2 className="mt-2 text-2xl font-semibold">{o.orderName}</h2>
          <p className="mt-1 text-sm text-stone-400">주문번호 {o.orderId}</p>

          {o.failReason && (
            <p role="alert" className="mt-4 rounded-lg bg-red-50 px-3 py-2 text-sm text-red-700">
              {o.failReason.message} <span className="text-red-400">({o.failReason.code})</span>
            </p>
          )}

          <Card className="mt-6 divide-y divide-stone-100">
            {o.items.map((it, idx) => (
              <div key={idx} className="flex gap-4 p-4">
                <img src={it.image} alt={it.name} className="h-20 w-20 rounded-lg object-cover" />
                <div className="min-w-0 flex-1">
                  <p className="truncate font-medium">{it.name}</p>
                  <p className="mt-0.5 text-sm text-stone-500">{it.color} · {it.qty}개</p>
                </div>
                <span className="self-center font-semibold">{won(it.price * it.qty)}</span>
              </div>
            ))}
          </Card>

          <Card className="mt-4 p-6">
            <dl className="space-y-2.5 text-sm">
              <div className="flex justify-between"><dt className="text-stone-500">상품 금액</dt><dd>{won(o.subtotal)}</dd></div>
              <div className="flex justify-between">
                <dt className="text-stone-500">배송비</dt>
                <dd>{o.shipping === 0 ? <span className="text-emerald-600">무료</span> : won(o.shipping)}</dd>
              </div>
              {o.payment && (
                <>
                  <div className="flex justify-between"><dt className="text-stone-500">결제 수단</dt><dd>{o.payment.method}{o.payment.cardNumber ? ` · ${o.payment.cardNumber}` : ''}</dd></div>
                  <div className="flex justify-between"><dt className="text-stone-500">결제 일시</dt><dd>{String(o.paidAt || '').replace('T', ' ').slice(0, 16)}</dd></div>
                </>
              )}
            </dl>
            <div className="mt-4 flex items-baseline justify-between border-t border-stone-200 pt-4">
              <span className="text-sm text-stone-600">총 결제금액</span>
              <span className="text-xl font-semibold">{won(o.amount)}</span>
            </div>
            {o.payment && o.payment.receiptUrl && (
              <a href={o.payment.receiptUrl} target="_blank" rel="noopener noreferrer">
                <Button variant="secondary" className="mt-5 w-full">영수증 보기</Button>
              </a>
            )}
          </Card>

          <Link to="/mypage"><Button variant="ghost" className="mt-4 w-full">마이페이지로</Button></Link>
        </div>
      );
    }

    // ========================================
    // 🚀 App
    // ========================================

    function NotFound() {
      return (
        <div className="mx-auto max-w-2xl px-4 py-24 text-center">
          <p className="text-4xl" aria-hidden="true">🧭</p>
          <h1 className="mt-4 text-xl font-semibold">페이지를 찾을 수 없습니다</h1>
          <Link to="/"><Button className="mt-6">홈으로</Button></Link>
        </div>
      );
    }

    function App() {
      return (
        <Router>
          <AuthProvider>
            <CartProvider>
              <div className="flex min-h-screen flex-col">
                <Header />
                <main className="flex-1 pb-16">
                  <Routes fallback={<NotFound />}>
                    <Route path="/" element={<HomePage />} />
                    <Route path="/products" element={<ProductListPage />} />
                    <Route path="/product/:id" element={<ProductDetailPage />} />
                    <Route path="/cart" element={<CartPage />} />
                    <Route path="/checkout" element={<CheckoutPage />} />
                    <Route path="/login" element={<AuthPage mode="login" />} />
                    <Route path="/signup" element={<AuthPage mode="signup" />} />
                    <Route path="/mypage" element={<MyPage />} />
                    <Route path="/orders/:orderId" element={<OrderDetailPage />} />
                  </Routes>
                </main>
                <Footer />
              </div>
            </CartProvider>
          </AuthProvider>
        </Router>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
