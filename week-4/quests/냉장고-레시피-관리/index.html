<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>냉장고 파먹기 - 재료 & 레시피 관리</title>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.9/babel.min.js"></script>
  <style>
    @keyframes fade-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .animate-fade-in { animation: fade-in .2s ease-out; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800">
  <div id="root"></div>
  <script type="text/babel">
    // ========================================
    // React Hooks Destructuring
    // ========================================
    const { useState, useEffect, useMemo, useCallback, useContext, createContext } = React;

    // ========================================
    // 📡 API Client
    // ----------------------------------------
    // 데이터는 server.js → PostgreSQL(Supabase) 에 저장된다.
    // DB 주소는 서버의 .env 에만 있고, 브라우저는 /api 만 호출한다.
    // ========================================
    const API_BASE_URL = '/api';

    const daysFromNow = (n) => {
      const d = new Date();
      d.setDate(d.getDate() + n);
      return d.toISOString().slice(0, 10);
    };

    const CATEGORIES = ['채소', '과일', '육류', '해산물', '유제품', '달걀/두부', '양념', '기타'];
    const STORAGES = ['냉장', '냉동', '실온'];
    const CATEGORY_EMOJI = { '채소': '🥬', '과일': '🍎', '육류': '🥩', '해산물': '🦐', '유제품': '🥛', '달걀/두부': '🥚', '양념': '🧂', '기타': '📦' };

    // ── JWT 토큰 보관 ──
    // 로그인하면 서버가 준 토큰을 localStorage 에 두고, 요청마다 Authorization 헤더로 보낸다.
    // (비공개 창 등에서 localStorage 가 막혀 있으면 메모리에만 두고 새로고침 시 다시 로그인)
    const TOKEN_KEY = 'fridge_token';
    let memoryToken = null;
    const tokenStore = {
      get() {
        try { return localStorage.getItem(TOKEN_KEY) || memoryToken; } catch (e) { return memoryToken; }
      },
      set(token) {
        memoryToken = token;
        try { localStorage.setItem(TOKEN_KEY, token); } catch (e) { /* 메모리에만 보관 */ }
      },
      clear() {
        memoryToken = null;
        try { localStorage.removeItem(TOKEN_KEY); } catch (e) { /* 무시 */ }
      },
    };

    // 서버 응답 { success, data, message } 를 풀어서 data 만 돌려준다
    async function request(path, options = {}) {
      const token = tokenStore.get();
      let res;
      try {
        res = await fetch(`${API_BASE_URL}${path}`, {
          method: options.method || 'GET',
          headers: {
            'Content-Type': 'application/json',
            ...(token ? { Authorization: `Bearer ${token}` } : {}),
          },
          body: options.body ? JSON.stringify(options.body) : undefined,
        });
      } catch (e) {
        throw new Error('서버에 연결할 수 없어요. node server.js 가 켜져 있는지 확인해주세요.');
      }
      const json = await res.json().catch(() => null);
      if (!json) throw new Error('서버 응답을 읽지 못했어요. (index.html 을 서버 주소로 열었는지 확인해주세요)');
      // 토큰이 만료·위조됐으면 로그아웃시키고 로그인 화면으로 돌려보낸다
      if (res.status === 401 && token && !options.skipAuthRedirect) {
        tokenStore.clear();
        window.dispatchEvent(new CustomEvent('auth:expired', { detail: json.message }));
      }
      if (!json.success) throw new Error(json.message || '요청이 실패했어요.');
      return json.data;
    }

    const api = {
      signup: (data) => request('/auth/signup', { method: 'POST', body: data, skipAuthRedirect: true }),
      login: (data) => request('/auth/login', { method: 'POST', body: data, skipAuthRedirect: true }),
      me: () => request('/auth/me'),
      getIngredients: () => request('/ingredients'),
      createIngredient: (data) => request('/ingredients', { method: 'POST', body: data }),
      updateIngredient: (id, data) => request(`/ingredients/${id}`, { method: 'PUT', body: data }),
      deleteIngredient: (id) => request(`/ingredients/${id}`, { method: 'DELETE' }),
      getRecipes: () => request('/recipes'),
      createRecipe: (data) => request('/recipes', { method: 'POST', body: data }),
      updateRecipe: (id, data) => request(`/recipes/${id}`, { method: 'PATCH', body: data }),
      deleteRecipe: (id) => request(`/recipes/${id}`, { method: 'DELETE' }),
      // AI 레시피 초안 (저장 X). OpenAI 키는 서버에만 있다.
      generateRecipe: (options) => request('/recipes/generate', { method: 'POST', body: options }),
    };

    // ========================================
    // 🧮 Utils
    // ========================================
    const daysLeft = (dateStr) => {
      const today = new Date(); today.setHours(0, 0, 0, 0);
      const target = new Date(dateStr + 'T00:00:00');
      return Math.round((target - today) / 86400000);
    };

    const expiryInfo = (dateStr) => {
      const d = daysLeft(dateStr);
      if (d < 0) return { label: `${-d}일 지남`, variant: 'red', level: 'expired' };
      if (d === 0) return { label: '오늘까지', variant: 'red', level: 'soon' };
      if (d <= 3) return { label: `D-${d}`, variant: 'amber', level: 'soon' };
      return { label: `D-${d}`, variant: 'green', level: 'ok' };
    };

    // 레시피 재료 중 냉장고에 있는(유통기한 안 지난) 재료 매칭
    const matchRecipe = (recipe, ingredients) => {
      const available = new Set(ingredients.filter((i) => daysLeft(i.expiresAt) >= 0).map((i) => i.name.trim()));
      const have = recipe.ingredients.filter((ri) => available.has(ri.name.trim()));
      const missing = recipe.ingredients.filter((ri) => !available.has(ri.name.trim()));
      const rate = recipe.ingredients.length ? Math.round((have.length / recipe.ingredients.length) * 100) : 0;
      return { have, missing, rate };
    };

    // ========================================
    // 🎨 Design System Components
    // ========================================
    function Button({ variant = 'primary', size = 'md', disabled = false, onClick, className = '', type = 'button', children, ...rest }) {
      const variants = {
        primary: 'bg-emerald-600 text-white hover:bg-emerald-700 focus-visible:ring-emerald-500',
        secondary: 'bg-white text-slate-700 border border-slate-300 hover:bg-slate-50 focus-visible:ring-slate-400',
        danger: 'bg-rose-600 text-white hover:bg-rose-700 focus-visible:ring-rose-500',
        ghost: 'text-slate-600 hover:bg-slate-100 focus-visible:ring-slate-400',
      };
      const sizes = { sm: 'px-2.5 py-1.5 text-sm', md: 'px-4 py-2 text-sm', lg: 'px-5 py-3 text-base' };
      return (
        <button
          type={type}
          disabled={disabled}
          onClick={onClick}
          className={`inline-flex items-center justify-center gap-1.5 rounded-lg font-medium transition focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed ${variants[variant]} ${sizes[size]} ${className}`}
          {...rest}
        >
          {children}
        </button>
      );
    }

    function Input({ type = 'text', label, value, onChange, placeholder, error, disabled, id, className = '', ...rest }) {
      const inputId = id || (label ? `in-${label}` : undefined);
      return (
        <div className={className}>
          {label && <label htmlFor={inputId} className="block text-sm font-medium text-slate-700 mb-1">{label}</label>}
          <input
            id={inputId}
            type={type}
            value={value}
            onChange={onChange}
            placeholder={placeholder}
            disabled={disabled}
            aria-invalid={!!error}
            className={`w-full rounded-lg border px-3 py-2 text-sm outline-none transition focus:ring-2 disabled:bg-slate-100 ${error ? 'border-rose-400 focus:ring-rose-200' : 'border-slate-300 focus:border-emerald-500 focus:ring-emerald-100'}`}
            {...rest}
          />
          {error && <p className="mt-1 text-xs text-rose-600">{error}</p>}
        </div>
      );
    }

    function Select({ label, value, onChange, options, id, className = '' }) {
      const selectId = id || (label ? `sel-${label}` : undefined);
      return (
        <div className={className}>
          {label && <label htmlFor={selectId} className="block text-sm font-medium text-slate-700 mb-1">{label}</label>}
          <select
            id={selectId}
            value={value}
            onChange={onChange}
            className="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100"
          >
            {options.map((o) => {
              const opt = typeof o === 'string' ? { value: o, label: o } : o;
              return <option key={opt.value} value={opt.value}>{opt.label}</option>;
            })}
          </select>
        </div>
      );
    }

    function Textarea({ label, value, onChange, placeholder, rows = 4, error, id, className = '' }) {
      const areaId = id || (label ? `ta-${label}` : undefined);
      return (
        <div className={className}>
          {label && <label htmlFor={areaId} className="block text-sm font-medium text-slate-700 mb-1">{label}</label>}
          <textarea
            id={areaId}
            value={value}
            onChange={onChange}
            placeholder={placeholder}
            rows={rows}
            className={`w-full rounded-lg border px-3 py-2 text-sm outline-none focus:ring-2 ${error ? 'border-rose-400 focus:ring-rose-200' : 'border-slate-300 focus:border-emerald-500 focus:ring-emerald-100'}`}
          />
          {error && <p className="mt-1 text-xs text-rose-600">{error}</p>}
        </div>
      );
    }

    function Card({ className = '', children, ...rest }) {
      return <div className={`rounded-2xl bg-white shadow-sm ring-1 ring-slate-200 p-5 ${className}`} {...rest}>{children}</div>;
    }

    function Badge({ variant = 'slate', className = '', children }) {
      const variants = {
        slate: 'bg-slate-100 text-slate-700',
        green: 'bg-emerald-100 text-emerald-700',
        amber: 'bg-amber-100 text-amber-800',
        red: 'bg-rose-100 text-rose-700',
        blue: 'bg-sky-100 text-sky-700',
      };
      return <span className={`inline-flex items-center rounded-full px-2 py-0.5 text-xs font-semibold ${variants[variant]} ${className}`}>{children}</span>;
    }

    function Modal({ isOpen, onClose, title, size = 'md', children }) {
      useEffect(() => {
        if (!isOpen) return;
        const onKey = (e) => e.key === 'Escape' && onClose();
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [isOpen, onClose]);

      if (!isOpen) return null;
      const sizes = { sm: 'max-w-sm', md: 'max-w-lg', lg: 'max-w-2xl' };
      return (
        <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-slate-900/40 p-0 sm:p-4" onClick={onClose}>
          <div
            role="dialog"
            aria-modal="true"
            aria-label={title}
            onClick={(e) => e.stopPropagation()}
            className={`animate-fade-in w-full ${sizes[size]} max-h-[90vh] overflow-y-auto rounded-t-2xl sm:rounded-2xl bg-white shadow-xl`}
          >
            <div className="sticky top-0 flex items-center justify-between border-b border-slate-100 bg-white px-5 py-4">
              <h2 className="text-lg font-bold">{title}</h2>
              <button onClick={onClose} aria-label="닫기" className="rounded-lg p-1 text-slate-400 hover:bg-slate-100 hover:text-slate-600">✕</button>
            </div>
            <div className="p-5">{children}</div>
          </div>
        </div>
      );
    }

    function Tabs({ tabs, value, onChange, className = '' }) {
      return (
        <div role="tablist" className={`flex gap-1 overflow-x-auto rounded-xl bg-slate-100 p-1 ${className}`}>
          {tabs.map((t) => (
            <button
              key={t.value}
              role="tab"
              aria-selected={value === t.value}
              onClick={() => onChange(t.value)}
              className={`whitespace-nowrap rounded-lg px-3 py-1.5 text-sm font-medium transition ${value === t.value ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}
            >
              {t.label}
            </button>
          ))}
        </div>
      );
    }

    function Spinner({ label = '불러오는 중...' }) {
      return (
        <div className="flex flex-col items-center justify-center gap-3 py-16 text-slate-500" role="status">
          <div className="h-8 w-8 animate-spin rounded-full border-4 border-emerald-200 border-t-emerald-600" />
          <span className="text-sm">{label}</span>
        </div>
      );
    }

    function EmptyState({ emoji = '🫙', title, description, action }) {
      return (
        <div className="flex flex-col items-center justify-center rounded-2xl border-2 border-dashed border-slate-200 py-14 text-center">
          <div className="text-4xl mb-2">{emoji}</div>
          <p className="font-semibold text-slate-700">{title}</p>
          {description && <p className="mt-1 text-sm text-slate-500">{description}</p>}
          {action && <div className="mt-4">{action}</div>}
        </div>
      );
    }

    function ProgressBar({ value, className = '' }) {
      const color = value === 100 ? 'bg-emerald-500' : value >= 60 ? 'bg-amber-400' : 'bg-rose-400';
      return (
        <div className={`h-2 w-full overflow-hidden rounded-full bg-slate-100 ${className}`} role="progressbar" aria-valuenow={value} aria-valuemin="0" aria-valuemax="100">
          <div className={`h-full ${color} transition-all`} style={{ width: `${value}%` }} />
        </div>
      );
    }

    // ========================================
    // 🔀 Router Components
    // ========================================
    const RouterContext = createContext(null);

    const getHashPath = () => window.location.hash.replace(/^#/, '') || '/';

    function matchRoute(pattern, path) {
      const p = pattern.split('/').filter(Boolean);
      const s = path.split('/').filter(Boolean);
      if (p.length !== s.length) return null;
      const params = {};
      for (let i = 0; i < p.length; i++) {
        if (p[i].startsWith(':')) params[p[i].slice(1)] = decodeURIComponent(s[i]);
        else if (p[i] !== s[i]) return null;
      }
      return params;
    }

    function Router({ children }) {
      const [path, setPath] = useState(getHashPath());
      useEffect(() => {
        const onChange = () => { setPath(getHashPath()); window.scrollTo(0, 0); };
        window.addEventListener('hashchange', onChange);
        return () => window.removeEventListener('hashchange', onChange);
      }, []);
      const navigate = useCallback((to) => { window.location.hash = to; }, []);
      return <RouterContext.Provider value={{ path, navigate, params: {} }}>{children}</RouterContext.Provider>;
    }

    const useRouter = () => useContext(RouterContext);
    const useParams = () => useContext(RouterContext).params;

    function Route() { return null; }

    function Routes({ children }) {
      const router = useRouter();
      for (const child of React.Children.toArray(children)) {
        const params = child.props.path === '*' ? {} : matchRoute(child.props.path, router.path);
        if (params) {
          return <RouterContext.Provider value={{ ...router, params }}>{child.props.element}</RouterContext.Provider>;
        }
      }
      return null;
    }

    function Link({ to, className = '', children, ...rest }) {
      return <a href={`#${to}`} className={className} {...rest}>{children}</a>;
    }

    // ========================================
    // 📦 Store (전역 상태: 재료 + 레시피)
    // ========================================
    // ========================================
    // 🔐 Auth (JWT 로그인 상태)
    // ========================================
    const AuthContext = createContext(null);
    const useAuth = () => useContext(AuthContext);

    function AuthProvider({ children }) {
      const [user, setUser] = useState(null);
      // 저장된 토큰이 있으면 켜질 때 /auth/me 로 아직 유효한지 확인한다
      const [checking, setChecking] = useState(() => !!tokenStore.get());
      const [notice, setNotice] = useState(null);

      useEffect(() => {
        if (!tokenStore.get()) return;
        api.me()
          .then(setUser)
          .catch(() => tokenStore.clear())
          .finally(() => setChecking(false));
      }, []);

      // 사용 중 토큰이 만료되면(request 가 401 을 받으면) 로그인 화면으로
      useEffect(() => {
        const onExpired = (e) => { setUser(null); setNotice(e.detail || '다시 로그인해주세요.'); };
        window.addEventListener('auth:expired', onExpired);
        return () => window.removeEventListener('auth:expired', onExpired);
      }, []);

      const finish = (data) => {
        tokenStore.set(data.token);
        setNotice(null);
        setUser(data.user);
      };

      const value = useMemo(() => ({
        user,
        checking,
        notice,
        login: async (form) => finish(await api.login(form)),
        signup: async (form) => finish(await api.signup(form)),
        logout: () => {
          tokenStore.clear();
          setUser(null);
          setNotice('로그아웃했어요.');
          window.location.hash = '/';
        },
      }), [user, checking, notice]);

      return <AuthContext.Provider value={value}>{children}</AuthContext.Provider>;
    }

    const StoreContext = createContext(null);
    const useStore = () => useContext(StoreContext);

    function StoreProvider({ children }) {
      const [ingredients, setIngredients] = useState([]);
      const [recipes, setRecipes] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [toast, setToast] = useState(null);
      const [shopping, setShopping] = useState([]); // 장보기 목록: { id, name, checked }

      const load = useCallback(async () => {
        setLoading(true);
        setError(null);
        try {
          const [ing, rec] = await Promise.all([api.getIngredients(), api.getRecipes()]);
          setIngredients(ing);
          setRecipes(rec);
        } catch (e) {
          setError(e.message || '데이터를 불러오지 못했어요.');
        } finally {
          setLoading(false);
        }
      }, []);

      useEffect(() => { load(); }, [load]);

      const notify = useCallback((msg, ms = 2200) => {
        setToast(msg);
        setTimeout(() => setToast(null), ms);
      }, []);

      // 서버 요청이 실패하면 토스트로 알리고 null 을 돌려준다 (성공하면 결과값)
      const guard = useCallback(async (fn) => {
        try {
          return await fn();
        } catch (e) {
          notify(`⚠️ ${e.message}`, 3500);
          return null;
        }
      }, [notify]);

      const actions = useMemo(() => ({
        addIngredient: (data) => guard(async () => {
          const item = await api.createIngredient(data);
          setIngredients((prev) => [...prev, item]);
          notify(`🥕 ${item.name} 추가 완료`);
          return item;
        }),
        updateIngredient: (id, data) => guard(async () => {
          const item = await api.updateIngredient(id, data);
          setIngredients((prev) => prev.map((i) => (i.id === id ? item : i)));
          notify('✏️ 수정 완료');
          return item;
        }),
        removeIngredient: (id) => guard(async () => {
          await api.deleteIngredient(id);
          setIngredients((prev) => prev.filter((i) => i.id !== id));
          notify('🗑️ 삭제했어요');
          return true;
        }),
        addRecipe: (data) => guard(async () => {
          const item = await api.createRecipe(data);
          setRecipes((prev) => [...prev, item]);
          notify(`📖 ${item.name} 레시피 등록`);
          return item;
        }),
        toggleFavorite: (recipe) => guard(async () => {
          const item = await api.updateRecipe(recipe.id, { favorite: !recipe.favorite });
          setRecipes((prev) => prev.map((r) => (r.id === recipe.id ? item : r)));
          return item;
        }),
        removeRecipe: (id) => guard(async () => {
          await api.deleteRecipe(id);
          setRecipes((prev) => prev.filter((r) => r.id !== id));
          notify('🗑️ 레시피 삭제');
          return true;
        }),
        addToShopping(names) {
          setShopping((prev) => {
            const exists = new Set(prev.map((s) => s.name));
            const fresh = names.filter((n) => !exists.has(n)).map((n) => ({ id: `${n}-${Date.now()}`, name: n, checked: false }));
            return [...prev, ...fresh];
          });
          notify(`🛒 장보기 목록에 ${names.length}개 담았어요`);
        },
        toggleShopping(id) {
          setShopping((prev) => prev.map((s) => (s.id === id ? { ...s, checked: !s.checked } : s)));
        },
        removeShopping(id) {
          setShopping((prev) => prev.filter((s) => s.id !== id));
        },
        clearCheckedShopping() {
          setShopping((prev) => prev.filter((s) => !s.checked));
        },
      }), [notify, guard]);

      const value = { ingredients, recipes, shopping, loading, error, reload: load, toast, ...actions };
      return <StoreContext.Provider value={value}>{children}</StoreContext.Provider>;
    }

    // ========================================
    // 🧩 Common/Layout Components
    // ========================================
    const NAV_ITEMS = [
      { to: '/', label: '홈', emoji: '🏠' },
      { to: '/fridge', label: '냉장고', emoji: '🧊' },
      { to: '/recipes', label: '레시피', emoji: '📖' },
      { to: '/ai', label: 'AI 셰프', emoji: '✨' },
      { to: '/shopping', label: '장보기', emoji: '🛒' },
    ];

    const isActive = (to, path) => (to === '/' ? path === '/' : path.startsWith(to));

    function Header() {
      const { path } = useRouter();
      const { shopping } = useStore();
      const { user, logout } = useAuth();
      const pending = shopping.filter((s) => !s.checked).length;
      return (
        <header className="sticky top-0 z-40 border-b border-slate-200 bg-white/90 backdrop-blur">
          <div className="mx-auto flex max-w-5xl items-center justify-between px-4 py-3">
            <Link to="/" className="flex items-center gap-2 font-extrabold text-lg">
              <span className="text-2xl">🧊</span>
              <span>냉장고 파먹기</span>
            </Link>
            <nav className="hidden sm:flex gap-1" aria-label="주 메뉴">
              {NAV_ITEMS.map((n) => (
                <Link
                  key={n.to}
                  to={n.to}
                  aria-current={isActive(n.to, path) ? 'page' : undefined}

                >
                  {n.emoji} {n.label}

                    <span className="ml-1 rounded-full bg-rose-500 px-1.5 text-xs text-white">{pending}</span>

    function BottomNav() {
      const { path } = useRouter();
      return (
        <nav className="fixed bottom-0 inset-x-0 z-40 grid grid-cols-5 border-t border-slate-200 bg-white sm:hidden" aria-label="하단 메뉴">
          {NAV_ITEMS.map((n) => (
            <Link
              key={n.to}
              to={n.to}
              aria-current={isActive(n.to, path) ? 'page' : undefined}
              className={`flex flex-col items-center py-2 text-xs ${isActive(n.to, path) ? 'text-emerald-600 font-semibold' : 'text-slate-500'}`}
            >
              <span className="text-xl">{n.emoji}</span>
              {n.label}
            </Link>
          ))}
        </nav>
      );
    }

    function Toast() {
      const { toast } = useStore();
      if (!toast) return null;
      return (
        <div className="fixed bottom-20 sm:bottom-6 left-1/2 z-50 -translate-x-1/2 animate-fade-in rounded-full bg-slate-900 px-4 py-2 text-sm text-white shadow-lg" role="status">
          {toast}
        </div>
      );
    }

    function PageTitle({ title, subtitle, action }) {
      return (
        <div className="mb-5 flex flex-wrap items-end justify-between gap-3">
          <div>
            <h1 className="text-2xl font-extrabold">{title}</h1>
            {subtitle && <p className="mt-1 text-sm text-slate-500">{subtitle}</p>}
          </div>
          {action}
        </div>
      );
    }

    function IngredientForm({ initial, onSubmit, onCancel }) {
      const [form, setForm] = useState(initial || {
        name: '', category: '채소', quantity: 1, unit: '개', storage: '냉장', expiresAt: daysFromNow(7),
      });
      const [errors, setErrors] = useState({});
      const [saving, setSaving] = useState(false);
      const set = (key) => (e) => setForm({ ...form, [key]: e.target.value });

      const submit = async (e) => {
        e.preventDefault();
        const errs = {};
        if (!form.name.trim()) errs.name = '재료 이름을 입력해주세요.';
        if (!(Number(form.quantity) > 0)) errs.quantity = '0보다 큰 수량을 입력해주세요.';
        if (!form.expiresAt) errs.expiresAt = '유통기한을 선택해주세요.';
        setErrors(errs);
        if (Object.keys(errs).length) return;
        setSaving(true);
        await onSubmit({ ...form, name: form.name.trim(), quantity: Number(form.quantity) });
        setSaving(false);
      };

      return (
        <form onSubmit={submit} className="space-y-4">
          <Input label="재료 이름" value={form.name} onChange={set('name')} placeholder="예: 대파" error={errors.name} autoFocus />
          <div className="grid grid-cols-2 gap-3">
            <Select label="분류" value={form.category} onChange={set('category')} options={CATEGORIES} />
            <Select label="보관 위치" value={form.storage} onChange={set('storage')} options={STORAGES} />
          </div>
          <div className="grid grid-cols-2 gap-3">
            <Input label="수량" type="number" min="0" step="any" value={form.quantity} onChange={set('quantity')} error={errors.quantity} />
            <Input label="단위" value={form.unit} onChange={set('unit')} placeholder="개, g, 팩" />
          </div>
          <Input label="유통기한" type="date" value={form.expiresAt} onChange={set('expiresAt')} error={errors.expiresAt} />
          <div className="flex justify-end gap-2 pt-2">
            <Button variant="secondary" onClick={onCancel}>취소</Button>
            <Button type="submit" disabled={saving}>{saving ? '저장 중...' : '저장'}</Button>
          </div>
        </form>
      );
    }

    function RecipeCard({ recipe, match }) {
      const { toggleFavorite } = useStore();
      return (
        <Card className="flex flex-col gap-3 transition hover:-translate-y-0.5 hover:shadow-md">
          <div className="flex items-start justify-between gap-2">
            <Link to={`/recipes/${recipe.id}`} className="flex items-center gap-3 min-w-0">
              <span className="flex h-12 w-12 shrink-0 items-center justify-center rounded-xl bg-orange-50 text-2xl">{recipe.emoji}</span>
              <div className="min-w-0">
                <h3 className="truncate font-bold">{recipe.name}</h3>
                <p className="text-xs text-slate-500">⏱ {recipe.minutes}분 · {recipe.difficulty} · {recipe.servings}인분</p>
              </div>
            </Link>
            <button
              onClick={() => toggleFavorite(recipe)}
              aria-label={recipe.favorite ? '즐겨찾기 해제' : '즐겨찾기'}
              aria-pressed={recipe.favorite}
              className="text-xl leading-none transition hover:scale-110"
            >
              {recipe.favorite ? '⭐' : '☆'}
            </button>
          </div>
          <div>
            <div className="mb-1 flex justify-between text-xs">
              <span className="text-slate-500">보유 재료 {match.have.length}/{recipe.ingredients.length}</span>
              <span className="font-semibold">{match.rate}%</span>
            </div>
            <ProgressBar value={match.rate} />
          </div>
          {match.missing.length === 0 ? (
            <Badge variant="green" className="self-start">✅ 지금 바로 만들 수 있어요</Badge>
          ) : (
            <p className="text-xs text-slate-500 truncate">부족: {match.missing.map((m) => m.name).join(', ')}</p>
          )}
        </Card>
      );
    }

    function LoadGate({ children }) {
      const { loading, error, reload } = useStore();
      if (loading) return <Spinner label="냉장고 여는 중..." />;
      if (error) {
        return <EmptyState emoji="⚠️" title={error} description="잠시 후 다시 시도해주세요." action={<Button onClick={reload}>다시 시도</Button>} />;
      }
      return children;
    }

    // ========================================
    // 📄 Page Components
    // ========================================
    function HomePage() {
      const { ingredients, recipes } = useStore();

      const expiring = useMemo(
        () => ingredients.filter((i) => daysLeft(i.expiresAt) <= 3).sort((a, b) => daysLeft(a.expiresAt) - daysLeft(b.expiresAt)),
        [ingredients]
      );
      const ranked = useMemo(
        () => recipes.map((r) => ({ recipe: r, match: matchRecipe(r, ingredients) })).sort((a, b) => b.match.rate - a.match.rate),
        [recipes, ingredients]
      );
      const cookable = ranked.filter((x) => x.match.rate === 100).length;
      const expiredCount = ingredients.filter((i) => daysLeft(i.expiresAt) < 0).length;

      // 임박 재료를 사용하는 레시피 추천
      const rescue = useMemo(() => {
        const names = new Set(expiring.filter((i) => daysLeft(i.expiresAt) >= 0).map((i) => i.name));
        return ranked.filter((x) => x.recipe.ingredients.some((ri) => names.has(ri.name))).slice(0, 3);
      }, [expiring, ranked]);

      const stats = [
        { label: '보관 중인 재료', value: ingredients.length, emoji: '🥕', to: '/fridge' },
        { label: '유통기한 임박', value: expiring.length - expiredCount, emoji: '⏰', to: '/fridge' },
        { label: '기한 지난 재료', value: expiredCount, emoji: '🚨', to: '/fridge' },
        { label: '바로 가능한 요리', value: cookable, emoji: '🍽️', to: '/recipes' },
      ];

      return (
        <div className="space-y-8">
          <section className="rounded-3xl bg-gradient-to-br from-emerald-500 to-teal-600 p-6 text-white shadow-sm">
            <p className="text-sm opacity-90">{new Date().toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'long' })}</p>
            <h1 className="mt-1 text-2xl sm:text-3xl font-extrabold">오늘은 냉장고에서 뭘 꺼내 먹을까요?</h1>
            <p className="mt-2 text-sm opacity-90">임박한 재료부터 먼저 쓰면 버리는 음식이 줄어요.</p>
            <Link to="/ai" className="mt-4 inline-flex items-center gap-1.5 rounded-full bg-white/95 px-4 py-2 text-sm font-semibold text-emerald-700 shadow-sm hover:bg-white">
              ✨ 있는 재료로 AI 레시피 만들기
            </Link>
          </section>

          <section className="grid grid-cols-2 lg:grid-cols-4 gap-3">
            {stats.map((s) => (
              <Link key={s.label} to={s.to}>
                <Card className="p-4 hover:ring-emerald-300 transition">
                  <div className="text-2xl">{s.emoji}</div>
                  <div className="mt-2 text-2xl font-extrabold">{s.value}</div>
                  <div className="text-xs text-slate-500">{s.label}</div>
                </Card>
              </Link>
            ))}
          </section>

          <section>
            <div className="mb-3 flex items-center justify-between">
              <h2 className="text-lg font-bold">⏰ 빨리 먹어야 해요</h2>
              <Link to="/fridge" className="text-sm text-emerald-700 hover:underline">전체 보기 →</Link>
            </div>
            {expiring.length === 0 ? (
              <EmptyState emoji="😌" title="임박한 재료가 없어요" description="모든 재료가 여유 있어요." />
            ) : (
              <div className="flex gap-3 overflow-x-auto pb-2">
                {expiring.map((i) => {
                  const info = expiryInfo(i.expiresAt);
                  return (
                    <Card key={i.id} className="min-w-[140px] p-4">
                      <div className="text-2xl">{CATEGORY_EMOJI[i.category]}</div>
                      <div className="mt-1 font-semibold">{i.name}</div>
                      <div className="text-xs text-slate-500">{i.quantity}{i.unit} · {i.storage}</div>
                      <Badge variant={info.variant} className="mt-2">{info.label}</Badge>
                    </Card>
                  );
                })}
              </div>
            )}
          </section>

          <section>
            <div className="mb-3 flex items-center justify-between">
              <h2 className="text-lg font-bold">🦸 재료 구출 레시피</h2>
              <Link to="/recipes" className="text-sm text-emerald-700 hover:underline">레시피 더 보기 →</Link>
            </div>
            {rescue.length === 0 ? (
              <EmptyState emoji="📖" title="추천할 레시피가 없어요" description="임박 재료를 쓰는 레시피를 등록해보세요." />
            ) : (
              <div className="grid gap-3 sm:grid-cols-2 lg:grid-cols-3">
                {rescue.map(({ recipe, match }) => <RecipeCard key={recipe.id} recipe={recipe} match={match} />)}
              </div>
            )}
          </section>
        </div>
      );
    }

    function FridgePage() {
      const { ingredients, addIngredient, updateIngredient, removeIngredient } = useStore();
      const [storage, setStorage] = useState('전체');
      const [category, setCategory] = useState('전체');
      const [query, setQuery] = useState('');
      const [sort, setSort] = useState('expiry');
      const [modal, setModal] = useState(null); // { mode: 'add' } | { mode: 'edit', item }
      const [confirm, setConfirm] = useState(null);

      const filtered = useMemo(() => {
        let list = ingredients.filter((i) =>
          (storage === '전체' || i.storage === storage) &&
          (category === '전체' || i.category === category) &&
          i.name.includes(query.trim())
        );
        list = [...list].sort((a, b) =>
          sort === 'expiry' ? daysLeft(a.expiresAt) - daysLeft(b.expiresAt) : a.name.localeCompare(b.name, 'ko')
        );
        return list;
      }, [ingredients, storage, category, query, sort]);

      const storageTabs = ['전체', ...STORAGES].map((s) => ({
        value: s,
        label: `${s} ${s === '전체' ? ingredients.length : ingredients.filter((i) => i.storage === s).length}`,
      }));

      const closeModal = useCallback(() => setModal(null), []);

      return (
        <div>
          <PageTitle
            title="🧊 내 냉장고"
            subtitle="유통기한 임박 순으로 정렬돼요."
            action={<Button onClick={() => setModal({ mode: 'add' })}>＋ 재료 추가</Button>}
          />

          <div className="mb-4 space-y-3">
            <Tabs tabs={storageTabs} value={storage} onChange={setStorage} />
            <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
              <Input placeholder="🔍 재료 검색" value={query} onChange={(e) => setQuery(e.target.value)} aria-label="재료 검색" />
              <Select value={category} onChange={(e) => setCategory(e.target.value)} options={['전체', ...CATEGORIES]} id="category-filter" />
              <Select
                value={sort}
                onChange={(e) => setSort(e.target.value)}
                id="sort-filter"
                options={[{ value: 'expiry', label: '유통기한 임박순' }, { value: 'name', label: '이름순' }]}
              />
            </div>
          </div>

          {filtered.length === 0 ? (
            <EmptyState
              emoji="🫙"
              title={ingredients.length === 0 ? '냉장고가 텅 비었어요' : '조건에 맞는 재료가 없어요'}
              description={ingredients.length === 0 ? '첫 재료를 추가해보세요.' : '필터를 바꿔보세요.'}
              action={ingredients.length === 0 && <Button onClick={() => setModal({ mode: 'add' })}>재료 추가</Button>}
            />
          ) : (
            <ul className="grid gap-2 sm:grid-cols-2">
              {filtered.map((i) => {
                const info = expiryInfo(i.expiresAt);
                return (
                  <li key={i.id}>
                    <Card className={`flex items-center gap-3 p-3 ${info.level === 'expired' ? 'opacity-70' : ''}`}>
                      <span className="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl bg-slate-50 text-2xl">{CATEGORY_EMOJI[i.category]}</span>
                      <div className="min-w-0 flex-1">
                        <div className="flex items-center gap-2">
                          <span className={`truncate font-semibold ${info.level === 'expired' ? 'line-through' : ''}`}>{i.name}</span>
                          <Badge variant={info.variant}>{info.label}</Badge>
                        </div>
                        <p className="text-xs text-slate-500">{i.quantity}{i.unit} · {i.category} · {i.storage} · ~{i.expiresAt}</p>
                      </div>
                      <div className="flex shrink-0">
                        <Button variant="ghost" size="sm" onClick={() => setModal({ mode: 'edit', item: i })} aria-label={`${i.name} 수정`}>✏️</Button>
                        <Button variant="ghost" size="sm" onClick={() => setConfirm(i)} aria-label={`${i.name} 삭제`}>🗑️</Button>
                      </div>
                    </Card>
                  </li>
                );
              })}
            </ul>
          )}

          <Modal isOpen={!!modal} onClose={closeModal} title={modal?.mode === 'edit' ? '재료 수정' : '재료 추가'}>
            {modal && (
              <IngredientForm
                key={modal.item?.id || 'new'}
                initial={modal.item}
                onCancel={closeModal}
                onSubmit={async (data) => {
                  const saved = modal.mode === 'edit'
                    ? await updateIngredient(modal.item.id, data)
                    : await addIngredient(data);
                  if (saved) closeModal(); // 실패하면 입력값을 살려두고 모달을 유지한다
                }}
              />
            )}
          </Modal>

          <Modal isOpen={!!confirm} onClose={() => setConfirm(null)} title="재료 삭제" size="sm">
            <p className="text-sm text-slate-600"><b>{confirm?.name}</b> 을(를) 냉장고에서 뺄까요?</p>
            <div className="mt-5 flex justify-end gap-2">
              <Button variant="secondary" onClick={() => setConfirm(null)}>취소</Button>
              <Button variant="danger" onClick={async () => { await removeIngredient(confirm.id); setConfirm(null); }}>삭제</Button>
            </div>
          </Modal>
        </div>
      );
    }

    function RecipesPage() {
      const { recipes, ingredients, addRecipe } = useStore();
      const { navigate } = useRouter();
      const [filter, setFilter] = useState('all');
      const [query, setQuery] = useState('');
      const [open, setOpen] = useState(false);

      const list = useMemo(() => {
        return recipes
          .map((r) => ({ recipe: r, match: matchRecipe(r, ingredients) }))
          .filter(({ recipe, match }) => {
            if (query.trim() && !recipe.name.includes(query.trim()) && !recipe.ingredients.some((i) => i.name.includes(query.trim()))) return false;
            if (filter === 'cookable') return match.rate === 100;
            if (filter === 'favorite') return recipe.favorite;
            return true;
          })
          .sort((a, b) => b.match.rate - a.match.rate);
      }, [recipes, ingredients, filter, query]);

      return (
        <div>
          <PageTitle
            title="📖 레시피"
            subtitle="냉장고 재료 보유율이 높은 순으로 보여줘요."
            action={<Button onClick={() => setOpen(true)}>＋ 레시피 등록</Button>}
          />
          <div className="mb-4 flex flex-col sm:flex-row gap-2">
            <Tabs
              value={filter}
              onChange={setFilter}
              tabs={[{ value: 'all', label: '전체' }, { value: 'cookable', label: '바로 가능' }, { value: 'favorite', label: '⭐ 즐겨찾기' }]}
            />
            <Input className="sm:flex-1" placeholder="🔍 요리 이름 또는 재료로 검색" value={query} onChange={(e) => setQuery(e.target.value)} aria-label="레시피 검색" />
          </div>

          {list.length === 0 ? (
            <EmptyState emoji="🍳" title="레시피가 없어요" description="필터를 바꾸거나 새 레시피를 등록해보세요." />
          ) : (
            <div className="grid gap-3 sm:grid-cols-2 lg:grid-cols-3">
              {list.map(({ recipe, match }) => <RecipeCard key={recipe.id} recipe={recipe} match={match} />)}
            </div>
          )}

          <Modal isOpen={open} onClose={() => setOpen(false)} title="새 레시피 등록" size="lg">
            {open && (
              <RecipeForm
                onCancel={() => setOpen(false)}
                onSubmit={async (data) => {
                  const created = await addRecipe(data);
                  if (!created) return;
                  setOpen(false);
                  navigate(`/recipes/${created.id}`);
                }}
              />
            )}
          </Modal>
        </div>
      );
    }

    function RecipeForm({ onSubmit, onCancel }) {
      const [form, setForm] = useState({ name: '', emoji: '🍽️', minutes: 20, difficulty: '쉬움', servings: 2, description: '', ingredientsText: '', stepsText: '' });
      const [errors, setErrors] = useState({});
      const [saving, setSaving] = useState(false);
      const set = (key) => (e) => setForm({ ...form, [key]: e.target.value });

      const submit = async (e) => {
        e.preventDefault();
        // "재료명 양" 형태로 한 줄에 하나씩 → [{ name, amount }]
        const ingredients = form.ingredientsText.split('\n').map((l) => l.trim()).filter(Boolean).map((line) => {
          const [name, ...rest] = line.split(/\s+/);
          return { name, amount: rest.join(' ') || '적당량' };
        });
        const steps = form.stepsText.split('\n').map((l) => l.trim()).filter(Boolean);
        const errs = {};
        if (!form.name.trim()) errs.name = '요리 이름을 입력해주세요.';
        if (ingredients.length === 0) errs.ingredientsText = '재료를 한 개 이상 입력해주세요.';
        if (steps.length === 0) errs.stepsText = '조리 순서를 한 줄 이상 입력해주세요.';
        setErrors(errs);
        if (Object.keys(errs).length) return;
        setSaving(true);
        await onSubmit({
          name: form.name.trim(), emoji: form.emoji || '🍽️', minutes: Number(form.minutes) || 0,
          difficulty: form.difficulty, servings: Number(form.servings) || 1, description: form.description.trim(),
          ingredients, steps,
        });
        setSaving(false);
      };

      return (
        <form onSubmit={submit} className="space-y-4">
          <div className="grid grid-cols-[5rem_1fr] gap-3">
            <Input label="이모지" value={form.emoji} onChange={set('emoji')} maxLength={4} />
            <Input label="요리 이름" value={form.name} onChange={set('name')} placeholder="예: 된장찌개" error={errors.name} autoFocus />
          </div>
          <div className="grid grid-cols-3 gap-3">
            <Input label="조리 시간(분)" type="number" min="0" value={form.minutes} onChange={set('minutes')} />
            <Select label="난이도" value={form.difficulty} onChange={set('difficulty')} options={['쉬움', '보통', '어려움']} />
            <Input label="인분" type="number" min="1" value={form.servings} onChange={set('servings')} />
          </div>
          <Input label="한 줄 소개" value={form.description} onChange={set('description')} placeholder="어떤 요리인가요?" />
          <Textarea
            label="재료 (한 줄에 하나, '재료명 양')"
            value={form.ingredientsText}
            onChange={set('ingredientsText')}
            placeholder={'두부 1모\n대파 1/2대\n된장 2큰술'}
            error={errors.ingredientsText}
          />
          <Textarea
            label="조리 순서 (한 줄에 한 단계)"
            value={form.stepsText}
            onChange={set('stepsText')}
            placeholder={'물을 끓인다.\n된장을 푼다.'}
            error={errors.stepsText}
          />
          <div className="flex justify-end gap-2">
            <Button variant="secondary" onClick={onCancel}>취소</Button>
            <Button type="submit" disabled={saving}>{saving ? '등록 중...' : '등록'}</Button>
          </div>
        </form>
      );
    }

    function RecipeDetailPage() {
      const { id } = useParams();
      const { recipes, ingredients, toggleFavorite, removeRecipe, addToShopping } = useStore();
      const { navigate } = useRouter();
      const [done, setDone] = useState([]);
      const [confirm, setConfirm] = useState(false);

      const recipe = recipes.find((r) => String(r.id) === id);
      if (!recipe) {
        return <EmptyState emoji="🔍" title="레시피를 찾을 수 없어요" action={<Link to="/recipes" className="text-emerald-700 hover:underline">레시피 목록으로</Link>} />;
      }

      const match = matchRecipe(recipe, ingredients);
      const haveNames = new Set(match.have.map((h) => h.name));
      const toggleStep = (idx) => setDone((d) => (d.includes(idx) ? d.filter((x) => x !== idx) : [...d, idx]));

      return (
        <div className="space-y-5">
          <Link to="/recipes" className="text-sm text-slate-500 hover:text-slate-700">← 레시피 목록</Link>

          <Card className="flex flex-col sm:flex-row gap-5">
            <div className="flex h-24 w-24 shrink-0 items-center justify-center rounded-2xl bg-orange-50 text-5xl">{recipe.emoji}</div>
            <div className="flex-1">
              <div className="flex items-start justify-between gap-2">
                <h1 className="text-2xl font-extrabold">{recipe.name}</h1>
                <div className="flex gap-1">
                  <Button variant="ghost" size="sm" onClick={() => toggleFavorite(recipe)} aria-pressed={recipe.favorite}>
                    {recipe.favorite ? '⭐ 즐겨찾기됨' : '☆ 즐겨찾기'}
                  </Button>
                  <Button variant="ghost" size="sm" onClick={() => setConfirm(true)} aria-label="레시피 삭제">🗑️</Button>
                </div>
              </div>
              <p className="mt-1 text-slate-600">{recipe.description}</p>
              <div className="mt-3 flex flex-wrap gap-2">
                <Badge variant="blue">⏱ {recipe.minutes}분</Badge>
                <Badge>{recipe.difficulty}</Badge>
                <Badge>{recipe.servings}인분</Badge>
                <Badge variant={match.rate === 100 ? 'green' : 'amber'}>재료 {match.rate}% 보유</Badge>
              </div>
            </div>
          </Card>

          <div className="grid gap-5 lg:grid-cols-5">
            <Card className="lg:col-span-2">
              <h2 className="mb-3 font-bold">🥕 재료</h2>
              <ul className="divide-y divide-slate-100">
                {recipe.ingredients.map((ri) => {
                  const has = haveNames.has(ri.name);
                  return (
                    <li key={ri.name} className="flex items-center justify-between py-2 text-sm">
                      <span className="flex items-center gap-2">
                        <span aria-hidden="true">{has ? '✅' : '❌'}</span>
                        <span className={has ? '' : 'text-slate-400'}>{ri.name}</span>
                      </span>
                      <span className="text-slate-500">{ri.amount}</span>
                    </li>
                  );
                })}
              </ul>
              {match.missing.length > 0 ? (
                <Button variant="secondary" className="mt-4 w-full" onClick={() => addToShopping(match.missing.map((m) => m.name))}>
                  🛒 부족한 재료 {match.missing.length}개 장보기에 담기
                </Button>
              ) : (
                <p className="mt-4 rounded-lg bg-emerald-50 p-3 text-center text-sm text-emerald-700">모든 재료가 준비됐어요! 🎉</p>
              )}
            </Card>

            <Card className="lg:col-span-3">
              <div className="mb-3 flex items-center justify-between">
                <h2 className="font-bold">👩‍🍳 조리 순서</h2>
                <span className="text-xs text-slate-500">{done.length}/{recipe.steps.length} 완료</span>
              </div>
              <ol className="space-y-2">
                {recipe.steps.map((step, idx) => {
                  const checked = done.includes(idx);
                  return (
                    <li key={idx}>
                      <button
                        onClick={() => toggleStep(idx)}
                        aria-pressed={checked}
                        className={`flex w-full items-start gap-3 rounded-xl p-3 text-left text-sm transition ${checked ? 'bg-emerald-50 text-slate-400 line-through' : 'bg-slate-50 hover:bg-slate-100'}`}
                      >
                        <span className={`flex h-6 w-6 shrink-0 items-center justify-center rounded-full text-xs font-bold ${checked ? 'bg-emerald-500 text-white' : 'bg-white ring-1 ring-slate-300'}`}>
                          {checked ? '✓' : idx + 1}
                        </span>
                        <span className="pt-0.5">{step}</span>
                      </button>
                    </li>
                  );
                })}
              </ol>
            </Card>
          </div>

          <Modal isOpen={confirm} onClose={() => setConfirm(false)} title="레시피 삭제" size="sm">
            <p className="text-sm text-slate-600"><b>{recipe.name}</b> 레시피를 삭제할까요?</p>
            <div className="mt-5 flex justify-end gap-2">
              <Button variant="secondary" onClick={() => setConfirm(false)}>취소</Button>
              <Button variant="danger" onClick={async () => { if (await removeRecipe(recipe.id)) navigate('/recipes'); else setConfirm(false); }}>삭제</Button>
            </div>
          </Modal>
        </div>
      );
    }

    function ShoppingPage() {
      const { shopping, addToShopping, toggleShopping, removeShopping, clearCheckedShopping, addIngredient } = useStore();
      const [name, setName] = useState('');
      const checkedCount = shopping.filter((s) => s.checked).length;

      const add = (e) => {
        e.preventDefault();
        if (!name.trim()) return;
        addToShopping([name.trim()]);
        setName('');
      };

      // 체크한 항목을 냉장고로 옮기기 (기본값으로 추가)
      const moveToFridge = async () => {
        const items = shopping.filter((s) => s.checked);
        for (const s of items) {
          const saved = await addIngredient({ name: s.name, category: '기타', quantity: 1, unit: '개', storage: '냉장', expiresAt: daysFromNow(7) });
          if (!saved) return; // 실패한 항목부터는 장보기 목록에 남겨둔다
          removeShopping(s.id);
        }
      };

      return (
        <div className="mx-auto max-w-xl">
          <PageTitle title="🛒 장보기 목록" subtitle="레시피 상세에서 부족한 재료를 담을 수 있어요." />
          <form onSubmit={add} className="mb-4 flex gap-2">
            <Input className="flex-1" placeholder="직접 추가하기 (예: 마늘)" value={name} onChange={(e) => setName(e.target.value)} aria-label="장보기 항목" />
            <Button type="submit">추가</Button>
          </form>

          {shopping.length === 0 ? (
            <EmptyState emoji="🧺" title="장바구니가 비었어요" description="레시피에서 부족한 재료를 담아보세요." action={<Link to="/recipes" className="text-sm text-emerald-700 hover:underline">레시피 보러가기 →</Link>} />
          ) : (
            <>
              <Card className="p-2">
                <ul className="divide-y divide-slate-100">
                  {shopping.map((s) => (
                    <li key={s.id} className="flex items-center gap-3 px-3 py-2.5">
                      <input
                        type="checkbox"
                        id={`shop-${s.id}`}
                        checked={s.checked}
                        onChange={() => toggleShopping(s.id)}
                        className="h-5 w-5 accent-emerald-600"
                      />
                      <label htmlFor={`shop-${s.id}`} className={`flex-1 cursor-pointer ${s.checked ? 'text-slate-400 line-through' : ''}`}>{s.name}</label>
                      <Button variant="ghost" size="sm" onClick={() => removeShopping(s.id)} aria-label={`${s.name} 삭제`}>✕</Button>
                    </li>
                  ))}
                </ul>
              </Card>
              <div className="mt-4 flex flex-wrap justify-end gap-2">
                <Button variant="secondary" disabled={checkedCount === 0} onClick={clearCheckedShopping}>체크 항목 지우기</Button>
                <Button disabled={checkedCount === 0} onClick={moveToFridge}>🧊 구매 완료 → 냉장고에 넣기 ({checkedCount})</Button>
              </div>
            </>
          )}
        </div>
      );
    }

    // 서버의 PANTRY 와 같은 목록 — 냉장고에 없어도 되는 기본 양념
    const PANTRY = ['소금', '후추', '설탕', '식용유', '참기름', '물', '다진마늘', '깨'];
    const QUICK_PREFERENCES = ['매콤하게', '국물 요리', '가볍게 다이어트', '아이 반찬', '술안주', '한 그릇 요리'];
    const LOADING_MESSAGES = ['냉장고 문을 여는 중...', '재료 조합을 고민하는 중...', '유통기한 임박 재료 챙기는 중...', '조리 순서를 정리하는 중...'];

    function AiChefPage() {
      const { ingredients, addRecipe } = useStore();
      const { navigate } = useRouter();

      // 유통기한 안 지난 재료만 후보. 임박(3일 이내) 재료는 기본으로 "꼭 쓸 재료"에 체크
      const usable = useMemo(
        () => ingredients.filter((i) => daysLeft(i.expiresAt) >= 0).sort((a, b) => daysLeft(a.expiresAt) - daysLeft(b.expiresAt)),
        [ingredients]
      );
      const [mustUse, setMustUse] = useState(() => usable.filter((i) => daysLeft(i.expiresAt) <= 3).map((i) => i.id));
      const [preference, setPreference] = useState('');
      const [maxMinutes, setMaxMinutes] = useState('');
      const [servings, setServings] = useState('2');
      const [generating, setGenerating] = useState(false);
      const [loadingStep, setLoadingStep] = useState(0);
      const [error, setError] = useState(null);
      const [result, setResult] = useState(null);
      const [saving, setSaving] = useState(false);

      useEffect(() => {
        if (!generating) return;
        setLoadingStep(0);
        const timer = setInterval(() => setLoadingStep((s) => (s + 1) % LOADING_MESSAGES.length), 1800);
        return () => clearInterval(timer);
      }, [generating]);

      const toggle = (id) => setMustUse((prev) => (prev.includes(id) ? prev.filter((x) => x !== id) : [...prev, id]));
      const addPreference = (text) => setPreference((p) => (p.includes(text) ? p : [p.trim(), text].filter(Boolean).join(', ')));

      const generate = async () => {
        setGenerating(true);
        setError(null);
        try {
          const recipe = await api.generateRecipe({
            mustUseIds: mustUse,
            preference,
            maxMinutes: maxMinutes ? Number(maxMinutes) : null,
            servings: Number(servings),
          });
          setResult(recipe);
        } catch (e) {
          setError(e.message);
        } finally {
          setGenerating(false);
        }
      };

      const save = async () => {
        setSaving(true);
        const { tip, ...rest } = result;
        const created = await addRecipe({ ...rest, description: tip ? `${rest.description} 💡 ${tip}` : rest.description });
        setSaving(false);
        if (created) navigate(`/recipes/${created.id}`);
      };

      const match = result ? matchRecipe(result, ingredients) : null;
      const haveNames = new Set(match ? match.have.map((h) => h.name) : []);

      return (
        <div>
          <PageTitle title="✨ AI 셰프" subtitle="냉장고에 있는 재료만으로 AI 가 레시피를 만들어줘요." />

          <div className="grid gap-5 lg:grid-cols-5">
            {/* ── 조건 입력 ── */}
            <Card className="lg:col-span-2 space-y-5 self-start">
              <div>
                <div className="mb-2 flex items-center justify-between">
                  <h2 className="font-bold">🥕 꼭 쓸 재료</h2>
                  <span className="text-xs text-slate-500">{mustUse.length}개 선택</span>
                </div>
                <p className="mb-3 text-xs text-slate-500">선택하지 않은 재료도 AI 가 필요하면 함께 써요. 기한 지난 재료는 빠져요.</p>
                {usable.length === 0 ? (
                  <EmptyState emoji="🫙" title="쓸 수 있는 재료가 없어요" action={<Link to="/fridge" className="text-sm text-emerald-700 hover:underline">재료 추가하러 가기 →</Link>} />
                ) : (
                  <div className="flex flex-wrap gap-2">
                    {usable.map((i) => {
                      const on = mustUse.includes(i.id);
                      const soon = daysLeft(i.expiresAt) <= 3;
                      return (
                        <button
                          key={i.id}
                          onClick={() => toggle(i.id)}
                          aria-pressed={on}
                          className={`rounded-full border px-3 py-1.5 text-sm transition ${on ? 'border-emerald-500 bg-emerald-50 text-emerald-800 font-semibold' : 'border-slate-200 bg-white text-slate-600 hover:border-slate-300'}`}
                        >
                          {CATEGORY_EMOJI[i.category]} {i.name}
                          {soon && <span className="ml-1 text-xs text-amber-600">⏰</span>}
                        </button>
                      );
                    })}
                  </div>
                )}
              </div>

              <div>
                <Input label="요청사항 (선택)" value={preference} onChange={(e) => setPreference(e.target.value)} placeholder="예: 매콤한 국물 요리" maxLength={200} />
                <div className="mt-2 flex flex-wrap gap-1.5">
                  {QUICK_PREFERENCES.map((q) => (
                    <button key={q} onClick={() => addPreference(q)} className="rounded-full bg-slate-100 px-2.5 py-1 text-xs text-slate-600 hover:bg-slate-200">
                      + {q}
                    </button>
                  ))}
                </div>
              </div>

              <div className="grid grid-cols-2 gap-3">
                <Select
                  label="조리 시간"
                  value={maxMinutes}
                  onChange={(e) => setMaxMinutes(e.target.value)}
                  options={[{ value: '', label: '상관없음' }, { value: '15', label: '15분 이내' }, { value: '30', label: '30분 이내' }, { value: '60', label: '1시간 이내' }]}
                />
                <Select
                  label="인분"
                  value={servings}
                  onChange={(e) => setServings(e.target.value)}
                  options={['1', '2', '3', '4'].map((n) => ({ value: n, label: `${n}인분` }))}
                />
              </div>

              <Button size="lg" className="w-full" onClick={generate} disabled={generating || usable.length === 0}>
                {generating ? '만드는 중...' : result ? '🔄 다른 레시피로 다시 만들기' : '✨ 레시피 만들기'}
              </Button>
            </Card>

            {/* ── 결과 ── */}
            <div className="lg:col-span-3">
              {generating ? (
                <Card className="flex flex-col items-center justify-center py-20 text-center" role="status">
                  <div className="text-5xl animate-bounce">👩‍🍳</div>
                  <p className="mt-4 font-semibold">{LOADING_MESSAGES[loadingStep]}</p>
                  <p className="mt-1 text-xs text-slate-500">보통 5~15초 걸려요</p>
                </Card>
              ) : error ? (
                <EmptyState emoji="⚠️" title="레시피를 만들지 못했어요" description={error} action={<Button onClick={generate}>다시 시도</Button>} />
              ) : !result ? (
                <EmptyState emoji="🍳" title="재료를 고르고 레시피를 만들어보세요" description="유통기한이 임박한 재료는 미리 선택해 뒀어요." />
              ) : (
                <Card className="animate-fade-in space-y-5">
                  <div className="flex gap-4">
                    <div className="flex h-20 w-20 shrink-0 items-center justify-center rounded-2xl bg-orange-50 text-4xl">{result.emoji}</div>
                    <div className="min-w-0">
                      <Badge variant="blue" className="mb-1">✨ AI 추천</Badge>
                      <h2 className="text-xl font-extrabold">{result.name}</h2>
                      <p className="mt-1 text-sm text-slate-600">{result.description}</p>
                      <div className="mt-2 flex flex-wrap gap-1.5">
                        <Badge variant="blue">⏱ {result.minutes}분</Badge>
                        <Badge>{result.difficulty}</Badge>
                        <Badge>{result.servings}인분</Badge>
                        <Badge variant={match.missing.every((m) => PANTRY.includes(m.name)) ? 'green' : 'amber'}>냉장고 재료 {match.have.length}개 사용</Badge>
                      </div>
                    </div>
                  </div>

                  {result.tip && <p className="rounded-xl bg-amber-50 p-3 text-sm text-amber-900">💡 {result.tip}</p>}

                  <div>
                    <h3 className="mb-2 font-bold">🥕 재료</h3>
                    <ul className="grid gap-x-6 sm:grid-cols-2">
                      {result.ingredients.map((ri) => {
                        const icon = haveNames.has(ri.name) ? '✅' : PANTRY.includes(ri.name) ? '🧂' : '❌';
                        return (
                          <li key={ri.name} className="flex items-center justify-between border-b border-slate-100 py-1.5 text-sm">
                            <span><span aria-hidden="true">{icon}</span> {ri.name}</span>
                            <span className="text-slate-500">{ri.amount}</span>
                          </li>
                        );
                      })}
                    </ul>
                    <p className="mt-2 text-xs text-slate-400">✅ 냉장고에 있음 · 🧂 기본 양념 · ❌ 없음</p>
                  </div>

                  <div>
                    <h3 className="mb-2 font-bold">👩‍🍳 조리 순서</h3>
                    <ol className="space-y-2">
                      {result.steps.map((step, idx) => (
                        <li key={idx} className="flex gap-3 rounded-xl bg-slate-50 p-3 text-sm">
                          <span className="flex h-6 w-6 shrink-0 items-center justify-center rounded-full bg-white text-xs font-bold ring-1 ring-slate-300">{idx + 1}</span>
                          <span className="pt-0.5">{step}</span>
                        </li>
                      ))}
                    </ol>
                  </div>

                  <div className="flex flex-wrap justify-end gap-2 border-t border-slate-100 pt-4">
                    <Button variant="secondary" onClick={generate}>🔄 다시 만들기</Button>
                    <Button onClick={save} disabled={saving}>{saving ? '저장 중...' : '📖 내 레시피에 저장'}</Button>
                  </div>
                </Card>
              )}
            </div>
          </div>
        </div>
      );
    }

    function AuthPage() {
      const { login, signup, notice } = useAuth();
      const [mode, setMode] = useState('login');
      const [form, setForm] = useState({ email: '', password: '', passwordConfirm: '', nickname: '' });
      const [errors, setErrors] = useState({});
      const [serverError, setServerError] = useState(null);
      const [submitting, setSubmitting] = useState(false);
      const set = (key) => (e) => setForm({ ...form, [key]: e.target.value });
      const isSignup = mode === 'signup';

      const switchMode = (next) => { setMode(next); setErrors({}); setServerError(null); };

      const submit = async (e) => {
        e.preventDefault();
        const errs = {};
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(form.email.trim())) errs.email = '올바른 이메일을 입력해주세요.';
        if (isSignup) {
          if (!form.nickname.trim()) errs.nickname = '닉네임을 입력해주세요.';
          else if (form.nickname.trim().length > 20) errs.nickname = '닉네임은 20자 이내로 입력해주세요.';
          if (form.password.length < 8) errs.password = '비밀번호는 8자 이상이어야 해요.';
          else if (form.password.length > 72) errs.password = '비밀번호는 72자 이내로 입력해주세요.';
          if (form.password !== form.passwordConfirm) errs.passwordConfirm = '비밀번호가 서로 달라요.';
        } else if (!form.password) {
          errs.password = '비밀번호를 입력해주세요.';
        }
        setErrors(errs);
        setServerError(null);
        if (Object.keys(errs).length) return;

        setSubmitting(true);
        try {
          if (isSignup) await signup({ email: form.email.trim(), password: form.password, nickname: form.nickname.trim() });
          else await login({ email: form.email.trim(), password: form.password });
          // 성공하면 AuthProvider 가 user 를 채우고 App 이 앱 화면으로 바꾼다
        } catch (err) {
          setServerError(err.message);
          setSubmitting(false);
        }
      };

      return (
        <div className="flex min-h-screen items-center justify-center bg-gradient-to-br from-emerald-50 to-teal-100 px-4 py-10">
          <div className="w-full max-w-sm animate-fade-in">
            <div className="mb-6 text-center">
              <div className="text-5xl">🧊</div>
              <h1 className="mt-2 text-2xl font-extrabold">냉장고 파먹기</h1>
              <p className="mt-1 text-sm text-slate-600">내 냉장고 재료로 오늘 뭐 먹을지 정해요.</p>
            </div>

            <Card className="p-6">
              <Tabs
                className="mb-5"
                value={mode}
                onChange={switchMode}
                tabs={[{ value: 'login', label: '로그인' }, { value: 'signup', label: '회원가입' }]}
              />

              {notice && !serverError && <p className="mb-4 rounded-lg bg-slate-100 p-3 text-sm text-slate-600" role="status">{notice}</p>}
              {serverError && <p className="mb-4 rounded-lg bg-rose-50 p-3 text-sm text-rose-700" role="alert">{serverError}</p>}

              <form onSubmit={submit} className="space-y-4" noValidate>
                <Input id="auth-email" label="이메일" type="email" autoComplete="email" value={form.email} onChange={set('email')} placeholder="you@example.com" error={errors.email} autoFocus />
                {isSignup && (
                  <Input id="auth-nickname" label="닉네임" autoComplete="nickname" value={form.nickname} onChange={set('nickname')} placeholder="예: 냉파왕" error={errors.nickname} maxLength={20} />
                )}
                <Input
                  id="auth-password"
                  label="비밀번호"
                  type="password"
                  autoComplete={isSignup ? 'new-password' : 'current-password'}
                  value={form.password}
                  onChange={set('password')}
                  placeholder={isSignup ? '8자 이상' : ''}
                  error={errors.password}
                />
                {isSignup && (
                  <Input id="auth-password-confirm" label="비밀번호 확인" type="password" autoComplete="new-password" value={form.passwordConfirm} onChange={set('passwordConfirm')} error={errors.passwordConfirm} />
                )}
                <Button type="submit" size="lg" className="w-full" disabled={submitting}>
                  {submitting ? '잠시만요...' : isSignup ? '가입하고 시작하기' : '로그인'}
                </Button>
              </form>

              <p className="mt-4 text-center text-sm text-slate-500">
                {isSignup ? '이미 계정이 있나요? ' : '처음 오셨나요? '}
                <button className="font-semibold text-emerald-700 hover:underline" onClick={() => switchMode(isSignup ? 'login' : 'signup')}>
                  {isSignup ? '로그인' : '회원가입'}
                </button>
              </p>
              {isSignup && <p className="mt-3 text-center text-xs text-slate-400">가입하면 샘플 재료와 레시피가 미리 채워져요.</p>}
            </Card>
          </div>
        </div>
      );
    }

    function NotFoundPage() {
      return <EmptyState emoji="🧭" title="페이지를 찾을 수 없어요" action={<Link to="/" className="text-emerald-700 hover:underline">홈으로</Link>} />;
    }

    // ========================================
    // 🚀 App Component
    // ========================================
    // 로그인 여부에 따라 로그인 화면 / 앱 화면을 고른다
    function AuthGate() {
      const { user, checking } = useAuth();
      if (checking) return <Spinner label="로그인 확인 중..." />;
      if (!user) return <AuthPage />;
      // key 로 사용자별 상태(장보기 목록 등)를 계정이 바뀌면 새로 시작한다
      return <AppShell key={user.id} />;
    }

    function App() {
      return (
        <Router>
          <AuthProvider>
            <AuthGate />
          </AuthProvider>
        </Router>
      );
    }

    function AppShell() {
      return (
          <StoreProvider>
            <Header />
            <main className="mx-auto max-w-5xl px-4 py-6 pb-24 sm:pb-10">
              <LoadGate>
                <Routes>
                  <Route path="/" element={<HomePage />} />
                  <Route path="/fridge" element={<FridgePage />} />
                  <Route path="/recipes" element={<RecipesPage />} />
                  <Route path="/ai" element={<AiChefPage />} />
                  <Route path="/recipes/:id" element={<RecipeDetailPage />} />
                  <Route path="/shopping" element={<ShoppingPage />} />
                  <Route path="*" element={<NotFoundPage />} />
                </Routes>
              </LoadGate>
            </main>
            <BottomNav />
            <Toast />
          </StoreProvider>
      );
    }

    // ========================================
    // Rendering
    // ========================================
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
