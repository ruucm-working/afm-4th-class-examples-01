<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>투두 02 — 데이터베이스에 저장되는 할 일 관리</title>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.9/babel.min.js"></script>
  <style>
    /* 새 항목이 추가될 때 살짝 떠오르는 효과 (Tailwind 기본 유틸에 없어서 직접 정의) */
    @keyframes riseIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .rise-in { animation: riseIn 0.18s ease-out; }
  </style>
</head>
<body class="bg-slate-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback, useMemo, useRef } = React;

    // ========================================
    // ⚙️ 설정
    // ========================================
    // DB 접속 정보는 서버(.env)에만 있고, 여기서는 우리 서버의 API 만 부른다.
    const API_BASE_URL = '/api';

    // ========================================
    // 🎨 Design System Components
    // ========================================

    function Button({ variant = 'primary', size = 'md', className = '', ...props }) {
      const base = 'inline-flex items-center justify-center font-medium rounded-lg transition-colors disabled:opacity-40 disabled:cursor-not-allowed focus:outline-none focus:ring-2 focus:ring-offset-1';
      const variants = {
        primary: 'bg-indigo-600 text-white hover:bg-indigo-500 focus:ring-indigo-400',
        secondary: 'bg-white text-slate-700 border border-slate-300 hover:bg-slate-50 focus:ring-slate-300',
        danger: 'bg-white text-red-600 border border-red-200 hover:bg-red-50 focus:ring-red-300',
        ghost: 'text-slate-500 hover:text-slate-900 hover:bg-slate-100 focus:ring-slate-300',
      };
      const sizes = {
        sm: 'text-sm px-2.5 py-1',
        md: 'text-sm px-4 py-2',
        lg: 'text-base px-5 py-2.5',
      };
      return <button className={`${base} ${variants[variant]} ${sizes[size]} ${className}`} {...props} />;
    }

    function Input({ label, error, inputRef, className = '', ...props }) {
      return (
        <div className={className}>
          {label && <label className="block text-sm font-medium text-slate-700 mb-1">{label}</label>}
          <input
            ref={inputRef}
            className={`w-full px-4 py-2.5 rounded-lg border bg-white text-slate-900 placeholder-slate-400
              focus:outline-none focus:ring-2 focus:border-transparent
              ${error ? 'border-red-400 focus:ring-red-300' : 'border-slate-300 focus:ring-indigo-400'}`}
            {...props}
          />
          {error && <p className="mt-1 text-sm text-red-600" role="alert">{error}</p>}
        </div>
      );
    }

    function Card({ className = '', children }) {
      return (
        <div className={`bg-white rounded-2xl shadow-sm border border-slate-200 ${className}`}>
          {children}
        </div>
      );
    }

    function Badge({ tone = 'slate', children }) {
      const tones = {
        slate: 'bg-slate-100 text-slate-600',
        green: 'bg-emerald-100 text-emerald-700',
        indigo: 'bg-indigo-100 text-indigo-700',
      };
      return (
        <span className={`inline-block text-xs font-medium px-2 py-0.5 rounded-full ${tones[tone]}`}>
          {children}
        </span>
      );
    }

    // ========================================
    // 🧩 Common Components
    // ========================================

    function Header({ total, doneCount }) {
      return (
        <header className="mb-6">
          <h1 className="text-2xl sm:text-3xl font-bold text-slate-900">할 일 목록</h1>
          <p className="mt-1 text-sm text-slate-500">
            입력한 할 일은 <span className="font-medium text-indigo-600">PostgreSQL 데이터베이스</span>의
            <code className="mx-1 px-1 py-0.5 bg-slate-200 rounded text-slate-700">todos</code> 테이블에 저장됩니다.
          </p>
          <div className="mt-3 flex gap-2">
            <Badge tone="indigo">전체 {total}</Badge>
            <Badge tone="green">완료 {doneCount}</Badge>
            <Badge>남음 {total - doneCount}</Badge>
          </div>
        </header>
      );
    }

    function ErrorBanner({ message, onClose }) {
      if (!message) return null;
      return (
        <div className="mb-4 flex items-start justify-between gap-3 rounded-lg bg-red-50 border border-red-200 px-4 py-3" role="alert">
          <p className="text-sm text-red-700">{message}</p>
          <button onClick={onClose} aria-label="에러 메시지 닫기" className="text-red-400 hover:text-red-600">✕</button>
        </div>
      );
    }

    function TodoForm({ onSubmit, submitting }) {
      const [text, setText] = useState('');
      const [error, setError] = useState('');
      const inputRef = useRef(null);

      async function handleSubmit(e) {
        e.preventDefault();
        const value = text.trim();
        if (!value) {
          setError('할 일을 입력해 주세요.');
          return;
        }
        setError('');
        const ok = await onSubmit(value);
        if (ok) {
          setText('');
          if (inputRef.current) inputRef.current.focus();
        }
      }

      return (
        <form onSubmit={handleSubmit} className="flex flex-col sm:flex-row gap-2 mb-5">
          <Input
            inputRef={inputRef}
            className="flex-1"
            value={text}
            onChange={e => setText(e.target.value)}
            placeholder="오늘 해야 할 일은?"
            maxLength={200}
            error={error}
            aria-label="할 일 입력"
          />
          <Button type="submit" size="lg" disabled={submitting} className="sm:w-28 shrink-0">
            {submitting ? '저장 중…' : '추가'}
          </Button>
        </form>
      );
    }

    function FilterTabs({ value, onChange, counts, onClearDone, clearing }) {
      const tabs = [
        { key: 'all', label: '전체' },
        { key: 'active', label: '진행중' },
        { key: 'done', label: '완료' },
      ];
      return (
        <div className="flex items-center justify-between gap-2 mb-3">
          <div className="flex gap-1" role="tablist" aria-label="할 일 필터">
            {tabs.map(tab => (
              <button
                key={tab.key}
                role="tab"
                aria-selected={value === tab.key}
                onClick={() => onChange(tab.key)}
                className={`text-sm px-3 py-1.5 rounded-lg transition-colors ${
                  value === tab.key
                    ? 'bg-indigo-600 text-white'
                    : 'text-slate-600 hover:bg-slate-200'
                }`}
              >
                {tab.label} <span className="opacity-70">{counts[tab.key]}</span>
              </button>
            ))}
          </div>

          {counts.done > 0 && (
            <Button variant="ghost" size="sm" onClick={onClearDone} disabled={clearing}>
              {clearing ? '삭제 중…' : `완료 ${counts.done}건 비우기`}
            </Button>
          )}
        </div>
      );
    }

    // 등록 시각을 "9월 8일 21:30" 형태로 보여 준다.
    function formatDate(iso) {
      const d = new Date(iso);
      const p = n => String(n).padStart(2, '0');
      return `${d.getMonth() + 1}월 ${d.getDate()}일 ${p(d.getHours())}:${p(d.getMinutes())}`;
    }

    function TodoItem({ todo, onToggle, onDelete, busy }) {
      return (
        <li className="rise-in flex items-center gap-3 px-4 py-3 border-b border-slate-100 last:border-b-0">
          <input
            type="checkbox"
            checked={todo.done}
            onChange={() => onToggle(todo)}
            disabled={busy}
            aria-label={`${todo.text} 완료 표시`}
            className="w-5 h-5 rounded border-slate-300 text-indigo-600 focus:ring-indigo-400 cursor-pointer"
          />
          <div className="flex-1 min-w-0">
            <p className={`break-words ${todo.done ? 'line-through text-slate-400' : 'text-slate-800'}`}>
              {todo.text}
            </p>
            <p className="text-xs text-slate-400 mt-0.5">
              #{todo.id} · {formatDate(todo.createdAt)}
            </p>
          </div>
          <Button variant="danger" size="sm" onClick={() => onDelete(todo)} disabled={busy}>
            삭제
          </Button>
        </li>
      );
    }

    function TodoList({ todos, loading, filter, onToggle, onDelete, busyId }) {
      if (loading) {
        return <p className="px-4 py-10 text-center text-slate-400">불러오는 중…</p>;
      }
      if (todos.length === 0) {
        const messages = {
          all: '아직 할 일이 없습니다. 위에서 첫 할 일을 추가해 보세요.',
          active: '진행중인 할 일이 없습니다. 🎉',
          done: '완료한 할 일이 아직 없습니다.',
        };
        return <p className="px-4 py-10 text-center text-slate-400">{messages[filter]}</p>;
      }
      return (
        <ul>
          {todos.map(todo => (
            <TodoItem
              key={todo.id}
              todo={todo}
              onToggle={onToggle}
              onDelete={onDelete}
              busy={busyId === todo.id}
            />
          ))}
        </ul>
      );
    }

    // 데이터가 실제로 DB에 들어갔는지 확인하는 패널.
    // 접속 정보는 서버가 내려주지 않으므로 여기에는 통계만 표시된다.
    function DbStatus({ status, onRefresh, loading }) {
      const [open, setOpen] = useState(false);

      function handleToggle() {
        const next = !open;
        setOpen(next);
        if (next) onRefresh();
      }

      return (
        <Card className="mt-5 overflow-hidden">
          <button
            onClick={handleToggle}
            aria-expanded={open}
            className="w-full flex items-center justify-between px-4 py-3 text-left hover:bg-slate-50"
          >
            <span className="text-sm font-medium text-slate-700">🗄️ 데이터베이스 상태 보기</span>
            <span className="text-slate-400">{open ? '▲' : '▼'}</span>
          </button>

          {open && (
            <div className="px-4 pb-4">
              <div className="flex justify-end mb-2">
                <Button variant="secondary" size="sm" onClick={onRefresh} disabled={loading}>
                  {loading ? '확인 중…' : '새로고침'}
                </Button>
              </div>

              {status ? (
                <dl className="grid grid-cols-2 gap-x-4 gap-y-2 text-sm bg-slate-50 rounded-lg p-4">
                  <dt className="text-slate-500">연결 상태</dt>
                  <dd className="text-emerald-600 font-medium">연결됨</dd>

                  <dt className="text-slate-500">데이터베이스</dt>
                  <dd className="text-slate-800">{status.database}</dd>

                  <dt className="text-slate-500">테이블</dt>
                  <dd className="text-slate-800">{status.table}</dd>

                  <dt className="text-slate-500">저장된 행</dt>
                  <dd className="text-slate-800">{status.total}건 (완료 {status.done}건)</dd>

                  <dt className="text-slate-500">마지막 등록</dt>
                  <dd className="text-slate-800">
                    {status.last_created ? formatDate(status.last_created) : '—'}
                  </dd>
                </dl>
              ) : (
                <p className="text-sm text-slate-400 px-1">상태를 불러오는 중…</p>
              )}
            </div>
          )}
        </Card>
      );
    }

    // ========================================
    // 📄 Page Component
    // ========================================

    function TodoPage() {
      const [todos, setTodos] = useState([]);
      const [loading, setLoading] = useState(true);
      const [submitting, setSubmitting] = useState(false);
      const [clearing, setClearing] = useState(false);
      const [busyId, setBusyId] = useState(null);
      const [error, setError] = useState('');
      const [filter, setFilter] = useState('all');
      const [status, setStatus] = useState(null);
      const [statusLoading, setStatusLoading] = useState(false);

      // 서버 응답을 공통으로 처리한다. 실패하면 메시지를 던진다.
      const request = useCallback(async (endpoint, options) => {
        const res = await fetch(`${API_BASE_URL}${endpoint}`, options);
        const json = await res.json().catch(() => ({}));
        if (!res.ok || !json.success) {
          throw new Error(json.message || '요청을 처리하지 못했습니다.');
        }
        return json.data;
      }, []);

      const loadTodos = useCallback(async () => {
        try {
          setLoading(true);
          setTodos(await request('/todos'));
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      }, [request]);

      const loadStatus = useCallback(async () => {
        try {
          setStatusLoading(true);
          setStatus(await request('/db-status'));
        } catch (err) {
          setError(err.message);
        } finally {
          setStatusLoading(false);
        }
      }, [request]);

      useEffect(() => { loadTodos(); }, [loadTodos]);

      async function handleAdd(text) {
        try {
          setSubmitting(true);
          setError('');
          const created = await request('/todos', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text }),
          });
          setTodos(prev => [...prev, created]);
          return true;
        } catch (err) {
          setError(err.message);
          return false;
        } finally {
          setSubmitting(false);
        }
      }

      async function handleToggle(todo) {
        try {
          setBusyId(todo.id);
          setError('');
          const updated = await request(`/todos/${todo.id}`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ done: !todo.done }),
          });
          setTodos(prev => prev.map(t => (t.id === updated.id ? updated : t)));
        } catch (err) {
          setError(err.message);
        } finally {
          setBusyId(null);
        }
      }

      async function handleDelete(todo) {
        try {
          setBusyId(todo.id);
          setError('');
          await request(`/todos/${todo.id}`, { method: 'DELETE' });
          setTodos(prev => prev.filter(t => t.id !== todo.id));
        } catch (err) {
          setError(err.message);
        } finally {
          setBusyId(null);
        }
      }

      async function handleClearDone() {
        try {
          setClearing(true);
          setError('');
          await request('/todos', { method: 'DELETE' });
          setTodos(prev => prev.filter(t => !t.done));
        } catch (err) {
          setError(err.message);
        } finally {
          setClearing(false);
        }
      }

      const counts = useMemo(() => ({
        all: todos.length,
        active: todos.filter(t => !t.done).length,
        done: todos.filter(t => t.done).length,
      }), [todos]);

      const visibleTodos = useMemo(() => {
        if (filter === 'active') return todos.filter(t => !t.done);
        if (filter === 'done') return todos.filter(t => t.done);
        return todos;
      }, [todos, filter]);

      return (
        <div className="min-h-screen py-8 px-4">
          <div className="max-w-2xl mx-auto">
            <Header total={counts.all} doneCount={counts.done} />
            <ErrorBanner message={error} onClose={() => setError('')} />
            <TodoForm onSubmit={handleAdd} submitting={submitting} />
            <FilterTabs
              value={filter}
              onChange={setFilter}
              counts={counts}
              onClearDone={handleClearDone}
              clearing={clearing}
            />

            <Card className="overflow-hidden">
              <TodoList
                todos={visibleTodos}
                loading={loading}
                filter={filter}
                onToggle={handleToggle}
                onDelete={handleDelete}
                busyId={busyId}
              />
            </Card>

            <DbStatus status={status} onRefresh={loadStatus} loading={statusLoading} />
          </div>
        </div>
      );
    }

    // ========================================
    // 🚀 App
    // ========================================

    function App() {
      return <TodoPage />;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
