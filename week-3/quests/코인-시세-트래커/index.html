<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>코인 시세 트래커</title>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <!-- ⚠️ 모든 CDN은 버전 고정. Babel 은 반드시 7.x (8.x 는 인라인 text/babel 미지원) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.9/babel.min.js"></script>
  <style>
    /* Tailwind 유틸리티로 표현 불가한 것만 */
    @keyframes fade-up {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-up { animation: fade-up .35s ease-out both; }

    /* 가격이 바뀌면 카드 테두리가 잠깐 반짝인다 */
    @keyframes flash-up {
      0%   { box-shadow: 0 0 0 0 rgba(34,197,94,.55); }
      100% { box-shadow: 0 0 0 14px rgba(34,197,94,0); }
    }
    @keyframes flash-down {
      0%   { box-shadow: 0 0 0 0 rgba(244,63,94,.55); }
      100% { box-shadow: 0 0 0 14px rgba(244,63,94,0); }
    }
    .flash-up   { animation: flash-up .9s ease-out; }
    .flash-down { animation: flash-down .9s ease-out; }

    /* 로딩 스켈레톤 */
    @keyframes shimmer { 100% { transform: translateX(100%); } }
    .shimmer { position: relative; overflow: hidden; }
    .shimmer::after {
      content: ''; position: absolute; inset: 0; transform: translateX(-100%);
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.06), transparent);
      animation: shimmer 1.4s infinite;
    }

    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="bg-slate-950">
  <div id="root"></div>

  <script type="text/babel">
    // ========================================
    // React Hooks
    // ========================================
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    // ========================================
    // ⚙️ 상수 · 유틸
    // ========================================

    // CoinGecko 퍼블릭 API (API 키 불필요, 무료 티어는 분당 호출 수 제한이 있음)
    const CG_BASE = 'https://api.coingecko.com/api/v3';

    const STORAGE_KEY = 'coin-tracker:watchlist';
    const DEFAULT_IDS = ['bitcoin', 'ethereum', 'ripple', 'solana', 'dogecoin', 'cardano'];

    const CURRENCIES = {
      krw: { code: 'KRW', locale: 'ko-KR' },
      usd: { code: 'USD', locale: 'en-US' },
    };

    const REFRESH_OPTIONS = [
      { value: 15, label: '15초' },
      { value: 30, label: '30초' },
      { value: 60, label: '1분' },
      { value: 300, label: '5분' },
    ];

    // 가격대에 따라 소수점 자릿수를 달리한다 (1억짜리 BTC 와 0.00003 달러 코인을 함께 다루므로)
    function formatPrice(value, currency) {
      if (value == null || Number.isNaN(value)) return '-';
      const { locale, code } = CURRENCIES[currency];
      const abs = Math.abs(value);
      let digits;
      if (abs >= 1000) digits = 0;
      else if (abs >= 1) digits = 2;
      else if (abs >= 0.01) digits = 4;
      else digits = 8;
      return new Intl.NumberFormat(locale, {
        style: 'currency',
        currency: code,
        minimumFractionDigits: digits,
        maximumFractionDigits: digits,
      }).format(value);
    }

    // 시가총액처럼 큰 숫자는 조/억, B/M 으로 줄여 표기
    function formatCompact(value, currency) {
      if (value == null || Number.isNaN(value)) return '-';
      if (currency === 'krw') {
        if (value >= 1e12) return (value / 1e12).toFixed(1) + '조 원';
        if (value >= 1e8) return Math.round(value / 1e8).toLocaleString('ko-KR') + '억 원';
        return Math.round(value).toLocaleString('ko-KR') + '원';
      }
      if (value >= 1e9) return '$' + (value / 1e9).toFixed(1) + 'B';
      if (value >= 1e6) return '$' + (value / 1e6).toFixed(1) + 'M';
      return '$' + Math.round(value).toLocaleString('en-US');
    }

    function formatPercent(value) {
      if (value == null || Number.isNaN(value)) return '-';
      return (value > 0 ? '+' : '') + value.toFixed(2) + '%';
    }

    function formatTime(date) {
      if (!date) return '-';
      return date.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }

    // 등락 방향 → 색상 토큰. 이 앱의 초록/빨강 규칙은 전부 여기서 나온다.
    function trendTheme(change) {
      if (change == null || Number.isNaN(change) || change === 0) {
        return { text: 'text-slate-300', bg: 'bg-slate-700/40', border: 'border-slate-800', stroke: '#94a3b8', arrow: '―' };
      }
      if (change > 0) {
        return { text: 'text-emerald-400', bg: 'bg-emerald-500/10', border: 'border-emerald-500/40', stroke: '#34d399', arrow: '▲' };
      }
      return { text: 'text-rose-400', bg: 'bg-rose-500/10', border: 'border-rose-500/40', stroke: '#fb7185', arrow: '▼' };
    }

    function loadWatchlist() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return DEFAULT_IDS;
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) ? parsed : DEFAULT_IDS;
      } catch (e) {
        return DEFAULT_IDS;
      }
    }

    function saveWatchlist(ids) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(ids));
      } catch (e) {
        /* 프라이빗 모드 등에서 실패할 수 있으나 앱 동작에는 지장 없음 */
      }
    }

    // ========================================
    // 🎨 Design System Components
    // ========================================

    function Button({ variant = 'primary', size = 'md', disabled = false, onClick, className = '', children, ...rest }) {
      const base = 'inline-flex items-center justify-center gap-1.5 font-semibold rounded-xl transition ' +
        'focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-offset-slate-950 ' +
        'disabled:opacity-40 disabled:cursor-not-allowed';
      const variants = {
        primary: 'bg-indigo-500 text-white hover:bg-indigo-400 focus-visible:ring-indigo-400',
        secondary: 'bg-slate-800 text-slate-100 hover:bg-slate-700 border border-slate-700 focus-visible:ring-slate-500',
        danger: 'bg-rose-500/10 text-rose-300 hover:bg-rose-500/20 border border-rose-500/30 focus-visible:ring-rose-400',
        ghost: 'text-slate-400 hover:bg-slate-800 focus-visible:ring-slate-600',
      };
      const sizes = {
        sm: 'text-xs px-2.5 py-1.5',
        md: 'text-sm px-4 py-2',
        lg: 'text-base px-5 py-2.5',
      };
      return (
        <button
          type="button"
          onClick={onClick}
          disabled={disabled}
          className={`${base} ${variants[variant]} ${sizes[size]} ${className}`}
          {...rest}
        >
          {children}
        </button>
      );
    }

    function Input({ type = 'text', label, value, onChange, placeholder, error, disabled = false, className = '', ...rest }) {
      return (
        <label className={`block ${className}`}>
          {label && <span className="block mb-1.5 text-xs font-semibold text-slate-400">{label}</span>}
          <input
            type={type}
            value={value}
            onChange={onChange}
            placeholder={placeholder}
            disabled={disabled}
            className={`w-full rounded-xl bg-slate-800/80 border px-3.5 py-2.5 text-sm text-slate-100 placeholder-slate-500
              focus:outline-none focus:ring-2 transition disabled:opacity-50
              ${error ? 'border-rose-500/60 focus:ring-rose-400' : 'border-slate-700 focus:ring-indigo-400'}`}
            {...rest}
          />
          {error && <span className="mt-1.5 block text-xs text-rose-400">{error}</span>}
        </label>
      );
    }

    function Card({ className = '', children, ...rest }) {
      return (
        <div className={`rounded-2xl bg-slate-900 border border-slate-800 shadow-lg shadow-black/30 ${className}`} {...rest}>
          {children}
        </div>
      );
    }

    function Badge({ className = '', children }) {
      return (
        <span className={`inline-flex items-center gap-1 rounded-full px-2 py-0.5 text-[11px] font-bold ${className}`}>
          {children}
        </span>
      );
    }

    function Modal({ isOpen, onClose, title, size = 'md', children }) {
      // ESC 로 닫기 + 열려 있는 동안 배경 스크롤 잠금
      useEffect(() => {
        if (!isOpen) return;
        const onKey = (e) => { if (e.key === 'Escape') onClose(); };
        window.addEventListener('keydown', onKey);
        const prev = document.body.style.overflow;
        document.body.style.overflow = 'hidden';
        return () => {
          window.removeEventListener('keydown', onKey);
          document.body.style.overflow = prev;
        };
      }, [isOpen, onClose]);

      if (!isOpen) return null;
      const sizes = { sm: 'max-w-sm', md: 'max-w-lg', lg: 'max-w-2xl' };

      return (
        <div className="fixed inset-0 z-50 flex items-start justify-center p-4 sm:p-8 overflow-y-auto">
          <div className="fixed inset-0 bg-black/70 backdrop-blur-sm" onClick={onClose} aria-hidden="true" />
          <div
            role="dialog"
            aria-modal="true"
            aria-label={title}
            className={`relative w-full ${sizes[size]} mt-8 rounded-2xl bg-slate-900 border border-slate-800 shadow-2xl animate-fade-up`}
          >
            <div className="flex items-center justify-between px-5 py-4 border-b border-slate-800">
              <h2 className="text-base font-bold text-slate-100">{title}</h2>
              <button
                type="button"
                onClick={onClose}
                aria-label="닫기"
                className="rounded-lg p-1.5 text-slate-400 hover:bg-slate-800 hover:text-slate-100 transition"
              >
                <svg className="w-5 h-5" viewBox="0 0 20 20" fill="none" stroke="currentColor" strokeWidth="1.8">
                  <path d="M5 5l10 10M15 5L5 15" strokeLinecap="round" />
                </svg>
              </button>
            </div>
            <div className="p-5">{children}</div>
          </div>
        </div>
      );
    }

    function Spinner({ className = 'w-4 h-4' }) {
      return (
        <svg className={`animate-spin ${className}`} viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="3" className="opacity-25" />
          <path d="M22 12a10 10 0 0 1-10 10" stroke="currentColor" strokeWidth="3" strokeLinecap="round" />
        </svg>
      );
    }

    function Toggle({ checked, onChange, label }) {
      return (
        <button
          type="button"
          role="switch"
          aria-checked={checked}
          onClick={() => onChange(!checked)}
          className="inline-flex items-center gap-2 rounded-lg px-1 py-0.5 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-400"
        >
          <span className={`relative h-5 w-9 rounded-full transition ${checked ? 'bg-indigo-500' : 'bg-slate-700'}`}>
            <span className={`absolute top-0.5 h-4 w-4 rounded-full bg-white shadow transition-all ${checked ? 'left-[1.125rem]' : 'left-0.5'}`} />
          </span>
          <span className="text-xs font-semibold text-slate-300">{label}</span>
        </button>
      );
    }

    // ========================================
    // 🧩 Common Components
    // ========================================

    // 7일치 가격 배열을 받아 그리는 초경량 SVG 스파크라인
    function Sparkline({ points, stroke, className = '' }) {
      const path = useMemo(() => {
        if (!points || points.length < 2) return null;
        const w = 100, h = 32;
        const min = Math.min(...points);
        const max = Math.max(...points);
        const span = max - min || 1;
        const step = w / (points.length - 1);
        const coords = points.map((p, i) => [i * step, h - ((p - min) / span) * h]);
        const line = coords.map(([x, y], i) => `${i === 0 ? 'M' : 'L'}${x.toFixed(2)},${y.toFixed(2)}`).join(' ');
        return { line, area: `${line} L${w},${h} L0,${h} Z`, w, h };
      }, [points]);

      if (!path) {
        return <div className={`h-8 flex items-center text-[11px] text-slate-600 ${className}`}>차트 데이터 없음</div>;
      }

      const gradId = 'sg-' + stroke.replace('#', '');
      return (
        <svg
          viewBox={`0 0 ${path.w} ${path.h}`}
          preserveAspectRatio="none"
          className={`w-full h-8 ${className}`}
          role="img"
          aria-label="최근 7일 가격 추이"
        >
          <defs>
            <linearGradient id={gradId} x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stopColor={stroke} stopOpacity="0.32" />
              <stop offset="100%" stopColor={stroke} stopOpacity="0" />
            </linearGradient>
          </defs>
          <path d={path.area} fill={`url(#${gradId})`} />
          <path
            d={path.line}
            fill="none"
            stroke={stroke}
            strokeWidth="1.6"
            strokeLinejoin="round"
            strokeLinecap="round"
            vectorEffect="non-scaling-stroke"
          />
        </svg>
      );
    }

    function CoinCardSkeleton() {
      return (
        <Card className="p-5 shimmer">
          <div className="flex items-center gap-3">
            <div className="w-9 h-9 rounded-full bg-slate-800" />
            <div className="flex-1 space-y-2">
              <div className="h-3 w-24 rounded bg-slate-800" />
              <div className="h-2.5 w-12 rounded bg-slate-800" />
            </div>
          </div>
          <div className="mt-5 h-7 w-40 rounded bg-slate-800" />
          <div className="mt-3 h-4 w-24 rounded bg-slate-800" />
          <div className="mt-5 h-8 w-full rounded bg-slate-800" />
        </Card>
      );
    }

    // 코인 1개 = 카드 1장. 24시간 등락률의 부호가 카드 전체 색을 결정한다.
    function CoinCard({ coin, currency, onRemove }) {
      const change = coin.price_change_percentage_24h;
      const theme = trendTheme(change);
      const changeAbs = coin.price_change_24h;

      // 직전 가격을 기억해 두고, 갱신으로 값이 바뀌면 카드를 한 번 반짝인다.
      const prevPrice = useRef(coin.current_price);
      const [flash, setFlash] = useState('');

      useEffect(() => {
        const before = prevPrice.current;
        const now = coin.current_price;
        prevPrice.current = now;
        if (before == null || now == null || before === now) return;
        setFlash(now > before ? 'flash-up' : 'flash-down');
        const t = setTimeout(() => setFlash(''), 900);
        return () => clearTimeout(t);
      }, [coin.current_price]);

      return (
        <Card className={`p-5 border ${theme.border} ${flash} animate-fade-up group`}>
          {/* 헤더: 아이콘 · 이름 · 삭제 */}
          <div className="flex items-start gap-3">
            <img
              src={coin.image}
              alt=""
              loading="lazy"
              className="w-9 h-9 rounded-full bg-slate-800 shrink-0"
              onError={(e) => { e.currentTarget.style.visibility = 'hidden'; }}
            />
            <div className="min-w-0 flex-1">
              <div className="flex items-center gap-2">
                <h3 className="font-bold text-slate-100 truncate">{coin.name}</h3>
                {coin.market_cap_rank && (
                  <Badge className="bg-slate-800 text-slate-400 shrink-0">#{coin.market_cap_rank}</Badge>
                )}
              </div>
              <p className="text-xs font-semibold uppercase tracking-wide text-slate-500">{coin.symbol}</p>
            </div>
            <button
              type="button"
              onClick={() => onRemove(coin.id)}
              aria-label={`${coin.name} 관심 목록에서 제거`}
              title="관심 목록에서 제거"
              className="shrink-0 rounded-lg p-1.5 text-slate-600 transition hover:bg-rose-500/10 hover:text-rose-400
                         opacity-0 group-hover:opacity-100 focus:opacity-100 focus:outline-none focus-visible:ring-2 focus-visible:ring-rose-400"
            >
              <svg className="w-4 h-4" viewBox="0 0 20 20" fill="none" stroke="currentColor" strokeWidth="1.8">
                <path d="M5 5l10 10M15 5L5 15" strokeLinecap="round" />
              </svg>
            </button>
          </div>

          {/* 현재가 + 24시간 등락 */}
          <div className="mt-4">
            <p className="text-2xl font-extrabold tabular-nums tracking-tight text-slate-50">
              {formatPrice(coin.current_price, currency)}
            </p>
            <div className="mt-2 flex flex-wrap items-center gap-2">
              <Badge className={`${theme.bg} ${theme.text}`}>
                <span aria-hidden="true">{theme.arrow}</span>
                <span className="tabular-nums">{formatPercent(change)}</span>
                <span className="sr-only">24시간 등락률</span>
              </Badge>
              {changeAbs != null && (
                <span className={`text-xs font-semibold tabular-nums ${theme.text}`}>
                  {changeAbs > 0 ? '+' : '-'}{formatPrice(Math.abs(changeAbs), currency)}
                </span>
              )}
              <span className="text-xs text-slate-600">24시간</span>
            </div>
          </div>

          {/* 최근 7일 추이 */}
          <div className="mt-4">
            <Sparkline points={coin.sparkline_in_7d && coin.sparkline_in_7d.price} stroke={theme.stroke} />
          </div>

          {/* 보조 지표 */}
          <dl className="mt-4 grid grid-cols-2 gap-3 border-t border-slate-800 pt-3 text-xs">
            <div>
              <dt className="text-slate-500">시가총액</dt>
              <dd className="mt-0.5 font-semibold tabular-nums text-slate-300">{formatCompact(coin.market_cap, currency)}</dd>
            </div>
            <div>
              <dt className="text-slate-500">24시간 거래대금</dt>
              <dd className="mt-0.5 font-semibold tabular-nums text-slate-300">{formatCompact(coin.total_volume, currency)}</dd>
            </div>
            <div>
              <dt className="text-slate-500">24시간 고가</dt>
              <dd className="mt-0.5 font-semibold tabular-nums text-emerald-400/90">{formatPrice(coin.high_24h, currency)}</dd>
            </div>
            <div>
              <dt className="text-slate-500">24시간 저가</dt>
              <dd className="mt-0.5 font-semibold tabular-nums text-rose-400/90">{formatPrice(coin.low_24h, currency)}</dd>
            </div>
          </dl>
        </Card>
      );
    }

    // 관심 목록에 코인을 추가하는 검색 모달 (CoinGecko /search)
    function AddCoinModal({ isOpen, onClose, onAdd, watchlist }) {
      const [query, setQuery] = useState('');
      const [results, setResults] = useState([]);
      const [searching, setSearching] = useState(false);
      const [error, setError] = useState(null);

      useEffect(() => {
        if (!isOpen) {
          setQuery('');
          setResults([]);
          setError(null);
        }
      }, [isOpen]);

      // 타이핑이 멈추고 350ms 뒤에만 검색 (무료 API 호출 수 아끼기)
      useEffect(() => {
        const q = query.trim();
        if (!isOpen || q.length < 1) {
          setResults([]);
          setSearching(false);
          return;
        }
        setSearching(true);
        setError(null);
        const controller = new AbortController();
        const timer = setTimeout(() => {
          fetch(`${CG_BASE}/search?query=${encodeURIComponent(q)}`, { signal: controller.signal })
            .then((res) => {
              if (!res.ok) throw new Error(`검색에 실패했어요 (HTTP ${res.status})`);
              return res.json();
            })
            .then((json) => setResults((json.coins || []).slice(0, 20)))
            .catch((err) => { if (err.name !== 'AbortError') setError(err.message); })
            .finally(() => setSearching(false));
        }, 350);

        return () => {
          clearTimeout(timer);
          controller.abort();
        };
      }, [query, isOpen]);

      return (
        <Modal isOpen={isOpen} onClose={onClose} title="관심 코인 추가">
          <Input
            label="코인 이름 또는 심볼"
            value={query}
            onChange={(e) => setQuery(e.target.value)}
            placeholder="예: bitcoin, sol, chainlink…"
            autoFocus
          />

          <div className="mt-4 max-h-80 overflow-y-auto no-scrollbar">
            {searching && (
              <p className="flex items-center justify-center gap-2 py-6 text-sm text-slate-400">
                <Spinner /> 검색 중…
              </p>
            )}

            {!searching && error && <p className="py-6 text-center text-sm text-rose-400">{error}</p>}

            {!searching && !error && !query.trim() && (
              <p className="py-6 text-center text-sm text-slate-500">코인 이름을 입력하면 목록이 나타납니다.</p>
            )}

            {!searching && !error && query.trim() && results.length === 0 && (
              <p className="py-6 text-center text-sm text-slate-500">검색 결과가 없어요.</p>
            )}

            <ul className="space-y-1">
              {!searching && results.map((coin) => {
                const already = watchlist.includes(coin.id);
                return (
                  <li key={coin.id} className="flex items-center gap-3 rounded-xl px-2 py-2 transition hover:bg-slate-800/60">
                    <img src={coin.thumb} alt="" loading="lazy" className="w-6 h-6 rounded-full bg-slate-800" />
                    <div className="min-w-0 flex-1">
                      <p className="truncate text-sm font-semibold text-slate-100">{coin.name}</p>
                      <p className="text-[11px] uppercase text-slate-500">
                        {coin.symbol}{coin.market_cap_rank ? ` · 시총 ${coin.market_cap_rank}위` : ''}
                      </p>
                    </div>
                    <Button size="sm" variant={already ? 'ghost' : 'primary'} disabled={already} onClick={() => onAdd(coin.id)}>
                      {already ? '추가됨' : '추가'}
                    </Button>
                  </li>
                );
              })}
            </ul>
          </div>
        </Modal>
      );
    }

    // 새로고침 · 자동 갱신 · 통화 · 정렬을 모아 둔 컨트롤 바
    function Toolbar({
      currency, onCurrencyChange,
      sortKey, onSortChange,
      autoRefresh, onAutoRefreshChange,
      intervalSec, onIntervalChange,
      countdown, loading, lastUpdated, onRefresh, onAddClick,
    }) {
      return (
        <Card className="p-4 sm:p-5">
          <div className="flex flex-wrap items-center gap-3">
            <Button onClick={onRefresh} disabled={loading}>
              {loading ? <Spinner /> : (
                <svg className="w-4 h-4" viewBox="0 0 20 20" fill="none" stroke="currentColor" strokeWidth="1.8">
                  <path d="M16.5 10a6.5 6.5 0 1 1-1.9-4.6M16.5 3v3.5H13" strokeLinecap="round" strokeLinejoin="round" />
                </svg>
              )}
              {loading ? '불러오는 중' : '새로고침'}
            </Button>

            <Button onClick={onAddClick} variant="secondary">
              <span className="text-base leading-none">＋</span> 코인 추가
            </Button>

            <div className="ml-auto flex items-center gap-2">
              <Toggle checked={autoRefresh} onChange={onAutoRefreshChange} label="자동 갱신" />
              <select
                value={intervalSec}
                onChange={(e) => onIntervalChange(Number(e.target.value))}
                disabled={!autoRefresh}
                aria-label="자동 갱신 주기"
                className="rounded-xl border border-slate-700 bg-slate-800 px-2.5 py-1.5 text-xs font-semibold text-slate-200
                           disabled:opacity-40 focus:outline-none focus:ring-2 focus:ring-indigo-400"
              >
                {REFRESH_OPTIONS.map((o) => (
                  <option key={o.value} value={o.value}>{o.label}마다</option>
                ))}
              </select>
            </div>
          </div>

          <div className="mt-4 flex flex-wrap items-center gap-3 border-t border-slate-800 pt-4">
            {/* 통화 전환 */}
            <div className="inline-flex rounded-xl bg-slate-800 p-1" role="group" aria-label="표시 통화">
              {Object.keys(CURRENCIES).map((key) => (
                <button
                  key={key}
                  type="button"
                  onClick={() => onCurrencyChange(key)}
                  aria-pressed={currency === key}
                  className={`rounded-lg px-3 py-1.5 text-xs font-bold transition
                    ${currency === key ? 'bg-indigo-500 text-white' : 'text-slate-400 hover:text-slate-200'}`}
                >
                  {CURRENCIES[key].code}
                </button>
              ))}
            </div>

            <select
              value={sortKey}
              onChange={(e) => onSortChange(e.target.value)}
              aria-label="정렬 기준"
              className="rounded-xl border border-slate-700 bg-slate-800 px-3 py-2 text-xs font-semibold text-slate-200
                         focus:outline-none focus:ring-2 focus:ring-indigo-400"
            >
              <option value="market_cap">시가총액 순</option>
              <option value="change_desc">상승률 높은 순</option>
              <option value="change_asc">하락률 큰 순</option>
              <option value="name">이름 순</option>
            </select>

            <p className="ml-auto text-xs tabular-nums text-slate-500">
              마지막 갱신 <span className="font-semibold text-slate-300">{formatTime(lastUpdated)}</span>
              {autoRefresh && !loading && <span className="ml-2 text-slate-600">· {countdown}초 후 갱신</span>}
            </p>
          </div>
        </Card>
      );
    }

    // 상승/하락 개수를 한눈에 보여주는 요약 줄
    function MarketSummary({ coins }) {
      const stats = useMemo(() => {
        const up = coins.filter((c) => (c.price_change_percentage_24h || 0) > 0).length;
        const down = coins.filter((c) => (c.price_change_percentage_24h || 0) < 0).length;
        const pick = (better) => coins.reduce(
          (acc, c) => (acc == null || better(c.price_change_percentage_24h || 0, acc.price_change_percentage_24h || 0) ? c : acc),
          null
        );
        return { up, down, best: pick((a, b) => a > b), worst: pick((a, b) => a < b) };
      }, [coins]);

      if (coins.length === 0) return null;

      return (
        <div className="grid grid-cols-2 gap-3 lg:grid-cols-4">
          <Card className="p-4">
            <p className="text-xs text-slate-500">상승</p>
            <p className="mt-1 text-xl font-extrabold tabular-nums text-emerald-400">{stats.up}개</p>
          </Card>
          <Card className="p-4">
            <p className="text-xs text-slate-500">하락</p>
            <p className="mt-1 text-xl font-extrabold tabular-nums text-rose-400">{stats.down}개</p>
          </Card>
          {/* 값의 색은 라벨이 아니라 실제 부호를 따른다 — 전 종목 하락장이면 '최고 상승'도 빨강 */}
          <Card className="p-4">
            <p className="text-xs text-slate-500">최고 상승</p>
            <p className="mt-1 truncate text-sm font-bold text-slate-100">{stats.best ? stats.best.name : '-'}</p>
            <p className={`text-xs font-semibold tabular-nums ${trendTheme(stats.best && stats.best.price_change_percentage_24h).text}`}>
              {stats.best ? formatPercent(stats.best.price_change_percentage_24h) : ''}
            </p>
          </Card>
          <Card className="p-4">
            <p className="text-xs text-slate-500">최고 하락</p>
            <p className="mt-1 truncate text-sm font-bold text-slate-100">{stats.worst ? stats.worst.name : '-'}</p>
            <p className={`text-xs font-semibold tabular-nums ${trendTheme(stats.worst && stats.worst.price_change_percentage_24h).text}`}>
              {stats.worst ? formatPercent(stats.worst.price_change_percentage_24h) : ''}
            </p>
          </Card>
        </div>
      );
    }

    function Header() {
      return (
        <header className="flex items-center gap-3">
          <div className="flex h-11 w-11 items-center justify-center rounded-2xl bg-gradient-to-br from-indigo-500 to-fuchsia-500 text-xl shadow-lg shadow-indigo-500/20">
            📈
          </div>
          <div>
            <h1 className="text-xl font-extrabold tracking-tight text-slate-50 sm:text-2xl">코인 시세 트래커</h1>
            <p className="text-xs text-slate-500">CoinGecko 실시간 시세 · 24시간 등락률</p>
          </div>
        </header>
      );
    }

    // ========================================
    // 📄 Page Component
    // ========================================

    function TrackerPage() {
      const [watchlist, setWatchlist] = useState(loadWatchlist);
      const [coins, setCoins] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [lastUpdated, setLastUpdated] = useState(null);

      const [currency, setCurrency] = useState('krw');
      const [sortKey, setSortKey] = useState('market_cap');
      const [autoRefresh, setAutoRefresh] = useState(true);
      const [intervalSec, setIntervalSec] = useState(30);
      const [countdown, setCountdown] = useState(30);
      const [modalOpen, setModalOpen] = useState(false);

      // 관심 목록은 브라우저에 저장해 두고 다음 방문에도 그대로 쓴다
      useEffect(() => { saveWatchlist(watchlist); }, [watchlist]);

      // 시세 조회. watchlist / currency 가 바뀌면 새 함수가 만들어져 아래 effect 가 다시 돈다.
      const fetchPrices = useCallback((signal) => {
        if (watchlist.length === 0) {
          setCoins([]);
          setLoading(false);
          setError(null);
          setLastUpdated(new Date());
          return Promise.resolve();
        }

        setLoading(true);
        const params = new URLSearchParams({
          vs_currency: currency,
          ids: watchlist.join(','),
          order: 'market_cap_desc',
          per_page: '250',
          page: '1',
          sparkline: 'true',
          price_change_percentage: '24h',
        });

        return fetch(`${CG_BASE}/coins/markets?${params.toString()}`, { signal })
          .then((res) => {
            if (res.status === 429) throw new Error('CoinGecko 호출 한도를 넘었어요. 잠시 뒤 다시 시도하거나 갱신 주기를 늘려 주세요.');
            if (!res.ok) throw new Error(`시세를 불러오지 못했어요 (HTTP ${res.status})`);
            return res.json();
          })
          .then((json) => {
            if (!Array.isArray(json)) throw new Error('예상과 다른 응답을 받았어요.');
            setCoins(json);
            setError(null);
            setLastUpdated(new Date());
          })
          .catch((err) => {
            if (err.name === 'AbortError') return;
            setError(err.message || '알 수 없는 오류가 발생했어요.');
          })
          .finally(() => {
            if (!signal || !signal.aborted) setLoading(false);
          });
      }, [watchlist, currency]);

      // 최초 로드 + 관심목록/통화 변경 시 즉시 재조회
      useEffect(() => {
        const controller = new AbortController();
        fetchPrices(controller.signal);
        return () => controller.abort();
      }, [fetchPrices]);

      // 자동 갱신: 1초마다 카운트다운하고 0 이 되면 다시 불러온다
      useEffect(() => {
        if (!autoRefresh) return;
        setCountdown(intervalSec);
        const controller = new AbortController();
        const timer = setInterval(() => {
          setCountdown((prev) => {
            if (prev <= 1) {
              fetchPrices(controller.signal);
              return intervalSec;
            }
            return prev - 1;
          });
        }, 1000);

        return () => {
          clearInterval(timer);
          controller.abort();
        };
      }, [autoRefresh, intervalSec, fetchPrices]);

      const handleManualRefresh = useCallback(() => {
        fetchPrices();
        setCountdown(intervalSec);
      }, [fetchPrices, intervalSec]);

      const handleAdd = useCallback((id) => {
        setWatchlist((prev) => (prev.includes(id) ? prev : [...prev, id]));
      }, []);

      const handleRemove = useCallback((id) => {
        setWatchlist((prev) => prev.filter((x) => x !== id));
      }, []);

      const sortedCoins = useMemo(() => {
        const list = [...coins];
        if (sortKey === 'change_desc') {
          list.sort((a, b) => (b.price_change_percentage_24h || 0) - (a.price_change_percentage_24h || 0));
        } else if (sortKey === 'change_asc') {
          list.sort((a, b) => (a.price_change_percentage_24h || 0) - (b.price_change_percentage_24h || 0));
        } else if (sortKey === 'name') {
          list.sort((a, b) => a.name.localeCompare(b.name, 'ko'));
        } else {
          list.sort((a, b) => (b.market_cap || 0) - (a.market_cap || 0));
        }
        return list;
      }, [coins, sortKey]);

      const showSkeleton = loading && coins.length === 0;

      return (
        <div className="min-h-screen text-slate-100">
          <div className="mx-auto max-w-6xl space-y-6 px-4 py-8 sm:py-10">
            <Header />

            <Toolbar
              currency={currency}
              onCurrencyChange={setCurrency}
              sortKey={sortKey}
              onSortChange={setSortKey}
              autoRefresh={autoRefresh}
              onAutoRefreshChange={setAutoRefresh}
              intervalSec={intervalSec}
              onIntervalChange={setIntervalSec}
              countdown={countdown}
              loading={loading}
              lastUpdated={lastUpdated}
              onRefresh={handleManualRefresh}
              onAddClick={() => setModalOpen(true)}
            />

            {/* 에러 배너: 이전에 받아 둔 시세는 남겨 두고 경고만 위에 띄운다 */}
            {error && (
              <div role="alert" className="rounded-2xl border border-rose-500/40 bg-rose-500/10 px-4 py-3 text-sm text-rose-200">
                <span className="font-bold">불러오기 실패 </span>{error}
              </div>
            )}

            {!showSkeleton && <MarketSummary coins={sortedCoins} />}

            {showSkeleton && (
              <div className="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
                {Array.from({ length: 6 }).map((_, i) => <CoinCardSkeleton key={i} />)}
              </div>
            )}

            {/* 관심 목록이 비었을 때 */}
            {!showSkeleton && watchlist.length === 0 && (
              <Card className="p-12 text-center">
                <p className="text-4xl">🪙</p>
                <p className="mt-3 font-bold text-slate-200">관심 코인이 없어요</p>
                <p className="mt-1 text-sm text-slate-500">추적하고 싶은 코인을 추가해 보세요.</p>
                <Button className="mt-5" onClick={() => setModalOpen(true)}>코인 추가하기</Button>
              </Card>
            )}

            {/* 목록은 있는데 응답이 비었을 때 */}
            {!showSkeleton && watchlist.length > 0 && sortedCoins.length === 0 && !error && (
              <Card className="p-12 text-center">
                <p className="font-bold text-slate-200">표시할 시세가 없어요</p>
                <p className="mt-1 text-sm text-slate-500">새로고침하거나 다른 코인을 추가해 보세요.</p>
              </Card>
            )}

            {!showSkeleton && sortedCoins.length > 0 && (
              <div className="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
                {sortedCoins.map((coin) => (
                  <CoinCard key={coin.id} coin={coin} currency={currency} onRemove={handleRemove} />
                ))}
              </div>
            )}

            <footer className="pb-8 pt-2 text-center text-xs text-slate-600">
              시세 데이터 제공 · CoinGecko · 투자 판단의 근거로 사용하지 마세요
            </footer>
          </div>

          <AddCoinModal isOpen={modalOpen} onClose={() => setModalOpen(false)} onAdd={handleAdd} watchlist={watchlist} />
        </div>
      );
    }

    // ========================================
    // 🚀 App Component
    // ========================================

    function App() {
      return <TrackerPage />;
    }

    // ========================================
    // Rendering
    // ========================================
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
